            --accent: #38bdf8;
            --accent-light: #e0f2fe;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --sensor-bg: #0f172a;
            --sensor-text: #38bdf8;
            --sensor-border: #1e293b;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --success-bg: #dcfce7;
            --success-color: #16a34a;
            --success-border: #86efac;
            --warning-bg: #fef3c7;
            --warning-color: #d97706;
            --warning-border: #fcd34d;
            --error-bg: #fee2e2;
            --error-color: #dc2626;
            --error-border: #fca5a5;
        }

        /* CSS Variables - Dark Theme */
        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #f8fafc;
            --accent: #38bdf8;
            --accent-light: rgba(56, 189, 248, 0.15);
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --sensor-bg: #022c22;
            --sensor-text: #4ade80;
            --sensor-border: #065f46;
            --input-bg: #0f172a;
            --input-border: #475569;
            --success-bg: rgba(34, 197, 94, 0.15);
            --success-color: #4ade80;
            --success-border: #22c55e;
            --warning-bg: rgba(245, 158, 11, 0.15);
            --warning-color: #fbbf24;
            --warning-border: #f59e0b;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-color: #f87171;
            --error-border: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--card-border);
        }

        header {
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            background: var(--bg);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); font-weight: 800; }

        /* Navigation Modules */
        .module-selector-container {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
        }

        .module-selector-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .mod-card {
            background: var(--bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .mod-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
        }

        .mod-card.active {
            background: rgba(37, 99, 235, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .mod-card-icon {
            font-size: 1.4rem;
            background: var(--card-bg);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .mod-card.active .mod-card-icon {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .mod-card-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .lab-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .lab-grid { grid-template-columns: 1fr; }
            .module-grid { grid-template-columns: 1fr; }
        }

        .instrument-panel {
            background: var(--bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .sensor-display {
            background: var(--sensor-bg);
            color: var(--sensor-text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid var(--sensor-border);
            margin: 15px 0;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            word-break: break-all;
            width: 90%;
            box-sizing: border-box;
            white-space: pre-line;
        }

        .instrument-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .task-card {
            background: var(--bg);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-top: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
        }

        .task-card h4 { margin: 0 0 8px 0; color: var(--secondary); font-weight: 700; font-size: 1.05rem; }
        .task-card p { margin: 0; color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }

        .control-group {
            width: 100%;
            margin-bottom: 12px;
        }

        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-action {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .btn-action:hover { background-color: var(--primary-dark); }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            display: none;
            line-height: 1.4;
        }

        .feedback.success { background: var(--success-bg); color: var(--success-color); border: 1px solid var(--success-border); }
        .feedback.warning { background: var(--warning-bg); color: var(--warning-color); border: 1px solid var(--warning-border); }
        .feedback.error { background: var(--error-bg); color: var(--error-color); border: 1px solid var(--error-border); }

        canvas {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-top: 10px;
        }

        .canvas-controls {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
        }

        .btn-sub {
            flex: 1;
            padding: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-sub:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>

<div class="container">
    <header>
        <div>
            <h1 id="header-title">Virtual Lab: Kinematika</h1>
        </div>
        <div class="header-actions">
            <a href="physica.html" class="btn-back" id="home-link">

        </div>
    </header>

    <!-- Module Selector -->
    <div class="module-selector-container">
        <div class="module-selector-label" id="select-mod-label">

        </div>
        <div class="module-grid" id="module-nav"></div>
    </div>

    <div class="lab-grid">
        <!-- Instrument / Visual Display Panel -->
        <div class="instrument-panel">
            <div class="instrument-icon" id="inst-icon">🏎️</div>
            <div style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600;" id="inst-name">Panel Instrumen</div>
            <div class="sensor-display" id="sensor-display">Pilih modul untuk memulai</div>
            <canvas id="kinematics-canvas" width="300" height="200" style="display: none;"></canvas>
            
            <div class="canvas-controls" id="canvas-btn-group" style="display: none;">
                <button class="btn-sub" onclick="startSim()" id="btn-start-sim">▶️ Mulai Sim</button>
                <button class="btn-sub" onclick="resetSim()" id="btn-reset-sim">⏹️ Reset</button>
            </div>

            <button class="btn-action" style="background: var(--bg); color: var(--text-main); border: 1px solid var(--card-border); padding: 8px; margin-top: 10px;" onclick="generateNewData()" id="btn-new-sample">
                🔄 Dapatkan Sampel / Soal Baru
            </button>
        </div>

        <!-- Student Analysis Input Panel -->
        <div>
            <div class="task-card">
                <h4 id="task-title">Judul Modul</h4>
                <p id="task-desc">Petunjuk tugas akan muncul di sini.</p>
            </div>

            <!-- Dynamic Input Container -->
            <div id="dynamic-inputs"></div>

            <button class="btn-action" id="btn-submit" onclick="submitAnalysis()">Kirim Data Analisis</button>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>
</div>

            mod4Correct: "✅ <b>Correct Projectile Analysis!</b><br>• Max Height (hₘₐₓ): <b>{h} m</b><br>• Max Range (xₘₐₓ): <b>{x} m</b>",
            mod4Incorrect: "❌ <b>Projectile Analysis Not Quite Correct!</b><br>• Expected hₘₐₓ: <b>{h} m</b><br>• Expected xₘₐₓ: <b>{x} m</b>",

            mod5Correct: "✅ <b>Correct Circular Motion Analysis!</b><br>• Linear Velocity v: <b>{v} m/s</b><br>• Centripetal Acceleration aₛ: <b>{a} m/s²</b>",
            mod5Incorrect: "❌ <b>Circular Motion Analysis Not Quite Correct!</b><br>• Expected Linear Velocity v: <b>{v} m/s</b><br>• Expected Centripetal Acceleration aₛ: <b>{a} m/s²</b>"
        }
    };

    let currentLang = 'id';
    let currentTheme = 'light';
    let currentModIndex = 0;
    let currentRawData = {};

    // Canvas Animation Control
    let canvas, ctx;
    let animationId = null;
    let simProgress = 0;
    let isSimRunning = false;
    const G = 9.8;

    function applySettings(isInitial = false) {
        currentLang = localStorage.getItem('user_lang') || 'id';
        currentTheme = localStorage.getItem('user_theme');

        document.documentElement.lang = currentLang;

        if (currentTheme) {
            document.documentElement.setAttribute('data-theme', currentTheme);
        } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }

        updateUIStaticText();
        initNav();
        renderCurrentModuleText();
    }

    document.addEventListener('DOMContentLoaded', () => {
        applySettings(true);
        generateNewData();
    });

    window.addEventListener('storage', (e) => {
        if (e.key === 'user_theme' || e.key === 'user_lang') {
            applySettings(false);
        }
    });

    function updateUIStaticText() {
        const t = translations[currentLang];
        document.getElementById('page-title').innerText = t.pageTitle;
        document.getElementById('header-title').innerText = t.headerTitle;
        document.getElementById('home-text').innerText = t.homeText;
        document.getElementById('select-mod-label').innerHTML = `<i class="fa-solid fa-compass"></i> ${t.selectModLabel}`;
        document.getElementById('btn-new-sample').innerText = t.btnNewSample;
        document.getElementById('btn-submit').innerText = t.btnSubmit;
        document.getElementById('btn-start-sim').innerText = t.btnStartSim;
        document.getElementById('btn-reset-sim').innerText = t.btnResetSim;
    }

    function initNav() {
        const nav = document.getElementById('module-nav');
        nav.innerHTML = '';
        const t = translations[currentLang];
        t.modules.forEach((modMeta, idx) => {
            const card = document.createElement('div');
            card.className = `mod-card ${idx === currentModIndex ? 'active' : ''}`;
            card.onclick = () => switchModule(idx);
            
            card.innerHTML = `
                <div class="mod-card-icon">${modMeta.icon}</div>
                <div class="mod-card-title">${modMeta.name}</div>
            `;
            nav.appendChild(card);
        });
    }

    function switchModule(index) {
        currentModIndex = index;
        initNav();
        generateNewData();
    }

    function updateSensorDisplay() {
        const t = translations[currentLang];
        if (!currentRawData || Object.keys(currentRawData).length === 0) return;

        if (currentModIndex === 0) {
            document.getElementById('sensor-display').innerText = t.mod1Sensor(currentRawData);
        } else if (currentModIndex === 1) {
            document.getElementById('sensor-display').innerText = t.mod2Sensor(currentRawData);
        } else if (currentModIndex === 2) {
            document.getElementById('sensor-display').innerText = t.mod3Sensor(currentRawData);
        } else if (currentModIndex === 3) {
            document.getElementById('sensor-display').innerText = t.mod4Sensor(currentRawData);
        } else if (currentModIndex === 4) {
            document.getElementById('sensor-display').innerText = t.mod5Sensor(currentRawData);
        }
    }

    function renderCurrentModuleText() {
        const t = translations[currentLang];
        document.getElementById('inst-name').innerText = t.instruments[currentModIndex];
        
        if (currentModIndex === 0) {
            document.getElementById('inst-icon').innerText = "🚗";
            document.getElementById('task-title').innerText = t.mod1Title;
            document.getElementById('task-desc').innerText = t.mod1Desc;
            const lbl = document.getElementById('lbl-mod1');
            const inp = document.getElementById('mod1-x');
            if (lbl) lbl.innerText = t.mod1Label;
            if (inp) inp.placeholder = t.mod1Placeholder;

        } else if (currentModIndex === 1) {
            document.getElementById('inst-icon').innerText = "🚀";
            document.getElementById('task-title').innerText = t.mod2Title;
            document.getElementById('task-desc').innerText = t.mod2Desc;
            const lbl1 = document.getElementById('lbl-mod2-1');
            const lbl2 = document.getElementById('lbl-mod2-2');
            const inp1 = document.getElementById('mod2-x');
            const inp2 = document.getElementById('mod2-v');
            if (lbl1) lbl1.innerText = t.mod2Label1;
            if (lbl2) lbl2.innerText = t.mod2Label2;
            if (inp1) inp1.placeholder = t.mod2Placeholder1;
            if (inp2) inp2.placeholder = t.mod2Placeholder2;

        } else if (currentModIndex === 2) {
            document.getElementById('inst-icon').innerText = "🍎";
            document.getElementById('task-title').innerText = t.mod3Title;
            document.getElementById('task-desc').innerText = t.mod3Desc;
            const lbl1 = document.getElementById('lbl-mod3-1');
            const lbl2 = document.getElementById('lbl-mod3-2');
            const inp1 = document.getElementById('mod3-t');
            const inp2 = document.getElementById('mod3-v');
            if (lbl1) lbl1.innerText = t.mod3Label1;
            if (lbl2) lbl2.innerText = t.mod3Label2;
            if (inp1) inp1.placeholder = t.mod3Placeholder1;
            if (inp2) inp2.placeholder = t.mod3Placeholder2;

        } else if (currentModIndex === 3) {
            document.getElementById('inst-icon').innerText = "⚽";
            document.getElementById('task-title').innerText = t.mod4Title;
            document.getElementById('task-desc').innerText = t.mod4Desc;
            const lbl1 = document.getElementById('lbl-mod4-1');
            const lbl2 = document.getElementById('lbl-mod4-2');
            const inp1 = document.getElementById('mod4-h');
            const inp2 = document.getElementById('mod4-x');
            if (lbl1) lbl1.innerText = t.mod4Label1;
            if (lbl2) lbl2.innerText = t.mod4Label2;
            if (inp1) inp1.placeholder = t.mod4Placeholder1;
            if (inp2) inp2.placeholder = t.mod4Placeholder2;

        } else if (currentModIndex === 4) {
            document.getElementById('inst-icon').innerText = "🎡";
            document.getElementById('task-title').innerText = t.mod5Title;
            document.getElementById('task-desc').innerText = t.mod5Desc;
            const lbl1 = document.getElementById('lbl-mod5-1');
            const lbl2 = document.getElementById('lbl-mod5-2');
            const inp1 = document.getElementById('mod5-v');
            const inp2 = document.getElementById('mod5-a');
            if (lbl1) lbl1.innerText = t.mod5Label1;
            if (lbl2) lbl2.innerText = t.mod5Label2;
            if (inp1) inp1.placeholder = t.mod5Placeholder1;
            if (inp2) inp2.placeholder = t.mod5Placeholder2;
        }

        updateSensorDisplay();
    }

    function generateNewData() {
        const t = translations[currentLang];
        document.getElementById('feedback').style.display = 'none';
        const dynamicInputs = document.getElementById('dynamic-inputs');
        dynamicInputs.innerHTML = '';

        const canvasEl = document.getElementById('kinematics-canvas');
        const btnGroup = document.getElementById('canvas-btn-group');
        canvasEl.style.display = 'block';
        btnGroup.style.display = 'flex';

        resetSim();

        if (currentModIndex === 0) { // GLB
            const v = Math.floor(Math.random() * 15) + 5; // 5 - 20 m/s
            const time = Math.floor(Math.random() * 8) + 2; // 2 - 9 s
            currentRawData = { v, time };

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label id="lbl-mod1">${t.mod1Label}</label>
                    <input type="number" id="mod1-x" step="any" placeholder="${t.mod1Placeholder}">
                </div>
            `;
        } else if (currentModIndex === 1) { // GLBB
            const v0 = Math.floor(Math.random() * 10); // 0 - 9 m/s
            const a = Math.floor(Math.random() * 6) + 1; // 1 - 6 m/s^2
            const time = Math.floor(Math.random() * 6) + 2; // 2 - 7 s
            currentRawData = { v0, a, time };

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label id="lbl-mod2-1">${t.mod2Label1}</label>
                    <input type="number" id="mod2-x" step="any" placeholder="${t.mod2Placeholder1}">
                </div>
                <div class="control-group">
                    <label id="lbl-mod2-2">${t.mod2Label2}</label>
                    <input type="number" id="mod2-v" step="any" placeholder="${t.mod2Placeholder2}">
                </div>
            `;
        } else if (currentModIndex === 2) { // GJB
            const h = (Math.floor(Math.random() * 8) + 2) * 10; // 20 - 90 m
            currentRawData = { h };

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label id="lbl-mod3-1">${t.mod3Label1}</label>
                    <input type="number" id="mod3-t" step="any" placeholder="${t.mod3Placeholder1}">
                </div>
                <div class="control-group">
                    <label id="lbl-mod3-2">${t.mod3Label2}</label>
                    <input type="number" id="mod3-v" step="any" placeholder="${t.mod3Placeholder2}">
                </div>
            `;
        } else if (currentModIndex === 3) { // Projectile
            const v0 = Math.floor(Math.random() * 20) + 15; // 15 - 34 m/s
            const angles = [30, 45, 60];
            const theta = angles[Math.floor(Math.random() * angles.length)];
            currentRawData = { v0, theta };

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label id="lbl-mod4-1">${t.mod4Label1}</label>
                    <input type="number" id="mod4-h" step="any" placeholder="${t.mod4Placeholder1}">
                </div>
                <div class="control-group">
                    <label id="lbl-mod4-2">${t.mod4Label2}</label>
                    <input type="number" id="mod4-x" step="any" placeholder="${t.mod4Placeholder2}">
                </div>
            `;
        } else if (currentModIndex === 4) { // GMB (Gerak Melingkar Beraturan)
            const r = Math.floor(Math.random() * 8) + 2; // 2 - 9 m
            const omega = Math.floor(Math.random() * 10) + 2; // 2 - 11 rad/s
            const period = ((2 * Math.PI) / omega).toFixed(2);
            currentRawData = { r, omega, period };

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label id="lbl-mod5-1">${t.mod5Label1}</label>
                    <input type="number" id="mod5-v" step="any" placeholder="${t.mod5Placeholder1}">
                </div>
                <div class="control-group">
                    <label id="lbl-mod5-2">${t.mod5Label2}</label>
                    <input type="number" id="mod5-a" step="any" placeholder="${t.mod5Placeholder2}">
                </div>
            `;
        }

        renderCurrentModuleText();
        drawCanvasState(0);
    }

    // Canvas Visualization Functions
    function startSim() {
        if (isSimRunning) return;
        isSimRunning = true;
        let startTime = null;
        const duration = 2500; // 2.5 seconds animation

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = Math.min((timestamp - startTime) / duration, 1);
            simProgress = progress;
            drawCanvasState(progress);

            if (progress < 1 && isSimRunning) {
                animationId = requestAnimationFrame(step);
            } else {
                isSimRunning = false;
            }
        }
        animationId = requestAnimationFrame(step);
    }

    function resetSim() {
        isSimRunning = false;
        if (animationId) cancelAnimationFrame(animationId);
        simProgress = 0;
        drawCanvasState(0);
    }

    function drawCanvasState(p) {
        canvas = document.getElementById('kinematics-canvas');
        ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const w = canvas.width;
        const h = canvas.height;

        if (currentModIndex === 0 || currentModIndex === 1) { // GLB / GLBB Track
            const groundY = 160;
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(20, groundY); ctx.lineTo(w - 20, groundY); ctx.stroke();

            const carX = 30 + p * (w - 80);
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(carX, groundY - 15, 30, 15);
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(carX + 7, groundY, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(carX + 23, groundY, 4, 0, Math.PI * 2); ctx.fill();

        } else if (currentModIndex === 2) { // GJB
            const startY = 30;
            const endY = 160;
            const currentY = startY + (p * p) * (endY - startY);

            ctx.fillStyle = '#64748b';
            ctx.fillRect(100, 20, 10, 150); // Building/cliff
            ctx.fillStyle = '#e11d48';
            ctx.beginPath(); ctx.arc(135, currentY, 8, 0, Math.PI * 2); ctx.fill();

        } else if (currentModIndex === 3) { // Projectile Motion
            const startX = 30;
            const startY = 160;
            const maxW = w - 60;
            const maxH = 100;

            // Draw trajectory path
            ctx.strokeStyle = '#cbd5e1';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            for (let t = 0; t <= 1; t += 0.02) {
                const px = startX + t * maxW;
                const py = startY - (4 * t * (1 - t)) * maxH;
                if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // Animated Ball
            const currX = startX + p * maxW;
            const currY = startY - (4 * p * (1 - p)) * maxH;
            ctx.fillStyle = '#16a34a';
            ctx.beginPath(); ctx.arc(currX, currY, 7, 0, Math.PI * 2); ctx.fill();

        } else if (currentModIndex === 4) { // GMB (Gerak Melingkar Beraturan)
            const centerX = w / 2;
            const centerY = h / 2;
            const radius = 60;

            // Lintasan Melingkar
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Pusat lingkaran
            ctx.fillStyle = '#64748b';
            ctx.beginPath(); ctx.arc(centerX, centerY, 4, 0, Math.PI * 2); ctx.fill();

            // Sudut rotasi berdasarkan progress
            const angle = p * Math.PI * 4; // 2 putaran penuh selama animasi
            const ballX = centerX + radius * Math.cos(angle);
            const ballY = centerY + radius * Math.sin(angle);

            // Tali penghubung / Jari-jari (r)
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(ballX, ballY); ctx.stroke();

            // Objek Melingkar
            ctx.fillStyle = '#8b5cf6';
            ctx.beginPath(); ctx.arc(ballX, ballY, 8, 0, Math.PI * 2); ctx.fill();

            // Vektor Kecepatan Linear (v) - Tegak lurus jari-jari
            const vLength = 25;
            const vx = -Math.sin(angle) * vLength;
            const vy = Math.cos(angle) * vLength;
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ballX, ballY);
            ctx.lineTo(ballX + vx, ballY + vy);
            ctx.stroke();

            // Vektor Percepatan Sentripetal (a_s) - Mengarah ke pusat
            const ax = -Math.cos(angle) * 20;
            const ay = -Math.sin(angle) * 20;
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ballX, ballY);
            ctx.lineTo(ballX + ax, ballY + ay);
            ctx.stroke();
        }
    }

    function showFeedback(type, message) {
        const fb = document.getElementById('feedback');
        fb.className = `feedback ${type}`;
        fb.innerHTML = message;
        fb.style.display = 'block';
    }

    function submitAnalysis() {
        const t = translations[currentLang];

        if (currentModIndex === 0) {
            const userX = parseFloat(document.getElementById('mod1-x').value);
            if (isNaN(userX)) { showFeedback('error', t.errFillFields); return; }

            const expectedX = currentRawData.v * currentRawData.time;
            if (Math.abs(userX - expectedX) < 0.1) {
                showFeedback('success', t.mod1Correct.replace('{x}', expectedX.toFixed(1)));
            } else {
                showFeedback('warning', t.mod1Incorrect.replace('{x}', expectedX.toFixed(1)));
            }
        } else if (currentModIndex === 1) {
            const userX = parseFloat(document.getElementById('mod2-x').value);
            const userV = parseFloat(document.getElementById('mod2-v').value);
            if (isNaN(userX) || isNaN(userV)) { showFeedback('error', t.errFillFields); return; }

            const { v0, a, time } = currentRawData;
            const expectedX = v0 * time + 0.5 * a * Math.pow(time, 2);
            const expectedV = v0 + a * time;

            if (Math.abs(userX - expectedX) < 0.2 && Math.abs(userV - expectedV) < 0.2) {
                showFeedback('success', t.mod2Correct.replace('{x}', expectedX.toFixed(1)).replace('{v}', expectedV.toFixed(1)));
            } else {
                showFeedback('warning', t.mod2Incorrect.replace('{x}', expectedX.toFixed(1)).replace('{v}', expectedV.toFixed(1)));
            }
        } else if (currentModIndex === 2) {
            const userT = parseFloat(document.getElementById('mod3-t').value);
            const userV = parseFloat(document.getElementById('mod3-v').value);
            if (isNaN(userT) || isNaN(userV)) { showFeedback('error', t.errFillFields); return; }

            const expectedT = Math.sqrt((2 * currentRawData.h) / G);
            const expectedV = G * expectedT;

            if (Math.abs(userT - expectedT) < 0.2 && Math.abs(userV - expectedV) < 0.2) {
                showFeedback('success', t.mod3Correct.replace('{t}', expectedT.toFixed(2)).replace('{v}', expectedV.toFixed(2)));
            } else {
                showFeedback('warning', t.mod3Incorrect.replace('{t}', expectedT.toFixed(2)).replace('{v}', expectedV.toFixed(2)));
            }
        } else if (currentModIndex === 3) {
            const userH = parseFloat(document.getElementById('mod4-h').value);
            const userX = parseFloat(document.getElementById('mod4-x').value);
            if (isNaN(userH) || isNaN(userX)) { showFeedback('error', t.errFillFields); return; }

            const rad = (currentRawData.theta * Math.PI) / 180;
            const expectedH = (Math.pow(currentRawData.v0, 2) * Math.pow(Math.sin(rad), 2)) / (2 * G);
            const expectedX = (Math.pow(currentRawData.v0, 2) * Math.sin(2 * rad)) / G;

            if (Math.abs(userH - expectedH) < 0.3 && Math.abs(userX - expectedX) < 0.3) {
                showFeedback('success', t.mod4Correct.replace('{h}', expectedH.toFixed(2)).replace('{x}', expectedX.toFixed(2)));
            } else {
                showFeedback('warning', t.mod4Incorrect.replace('{h}', expectedH.toFixed(2)).replace('{x}', expectedX.toFixed(2)));
            }
        } else if (currentModIndex === 4) { // GMB Validation
            const userV = parseFloat(document.getElementById('mod5-v').value);
            const userA = parseFloat(document.getElementById('mod5-a').value);
            if (isNaN(userV) || isNaN(userA)) { showFeedback('error', t.errFillFields); return; }

            const { r, omega } = currentRawData;
            // v = omega * r
            // a_s = omega^2 * r = v^2 / r
            const expectedV = omega * r;
            const expectedA = Math.pow(omega, 2) * r;

            if (Math.abs(userV - expectedV) < 0.2 && Math.abs(userA - expectedA) < 0.2) {
                showFeedback('success', t.mod5Correct.replace('{v}', expectedV.toFixed(1)).replace('{a}', expectedA.toFixed(2)));
            } else {
                showFeedback('warning', t.mod5Incorrect.replace('{v}', expectedV.toFixed(1)).replace('{a}', expectedA.toFixed(2)));
            }
        }
    }
</script>
