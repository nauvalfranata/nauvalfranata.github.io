    function generateNewData() {
        document.getElementById('feedback').style.display = 'none';

        if (currentMainMod === 0) {
            if (currentSubCalcCase === 0) {
                const F = Math.floor(Math.random() * 40) + 20;
                const angles = [0, 30, 45, 60];
                const theta = angles[Math.floor(Math.random() * angles.length)];
                const s = Math.floor(Math.random() * 10) + 5;
                currentRawData = { F, theta, s };
            } else if (currentSubCalcCase === 1) {
                const m = Math.floor(Math.random() * 5) + 2;
                const v1 = Math.floor(Math.random() * 4) + 2;
                const v2 = v1 + Math.floor(Math.random() * 6) + 3;
                currentRawData = { m, v1, v2 };
            } else if (currentSubCalcCase === 2) {
                const m = Math.floor(Math.random() * 6) + 2;
                const h = Math.floor(Math.random() * 15) + 5;
                currentRawData = { m, h };
            } else if (currentSubCalcCase === 3) {
                const m = Math.floor(Math.random() * 4) + 2;
                const h1 = Math.floor(Math.random() * 10) + 12;
                const h2 = Math.floor(Math.random() * 6) + 2;
                currentRawData = { m, h1, h2 };
            } else if (currentSubCalcCase === 4) {
                const w = Math.floor(Math.random() * 200) + 100;
                const h = Math.floor(Math.random() * 8) + 4;
                const t = Math.floor(Math.random() * 5) + 5;
                const PoutCalculated = (w * h) / t;
                const Pin = Math.round(PoutCalculated + Math.random() * 50 + 20);
                currentRawData = { w, h, t, Pin };
            }
            renderMainModule();
            drawCanvasState(0);

        } else if (currentMainMod === 1) {
            const cases = energyConceptCasesData[currentLang];
            currentConceptIndex = Math.floor(Math.random() * cases.length);
            renderMainModule();

        } else if (currentMainMod === 2) {
            const k = (Math.floor(Math.random() * 5) + 2) * 50; // 100 - 350 N/m
            const dx = parseFloat((Math.random() * 0.3 + 0.1).toFixed(2)); // 0.10 - 0.40 m
            currentRawData = { k, dx };
            renderMainModule();
            drawCanvasState(0);
        }
    }

    function startSim() {
        if (isSimRunning) return;
        isSimRunning = true;
        let startTime = null;
        const duration = 2500;

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = Math.min((timestamp - startTime) / duration, 1);
            simProgress = progress;
            drawCanvasState(progress);

            if (progress < 1 && isSimRunning) {
                animationId = requestAnimationFrame(step);
            } else {
                isSimRunning = false;
            }
        }
        animationId = requestAnimationFrame(step);
    }

    function resetSim() {
        isSimRunning = false;
        if (animationId) cancelAnimationFrame(animationId);
        simProgress = 0;
        drawCanvasState(0);
    }

    function updateEnergyBars(epPercent, ekPercent) {
        const barEp = document.getElementById('bar-ep');
        const barEk = document.getElementById('bar-ek');
        const barEm = document.getElementById('bar-em');

        if (barEp && barEk && barEm) {
            barEp.style.width = `${Math.max(0, Math.min(100, epPercent))}%`;
            barEk.style.width = `${Math.max(0, Math.min(100, ekPercent))}%`;
            barEm.style.width = `100%`;
        }
    }

    function drawCanvasState(p) {
        canvas = document.getElementById('energy-canvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const w = canvas.width;
        const h = canvas.height;

        if (currentMainMod === 0) {
            if (currentSubCalcCase === 0) {
                // Balok ditarik gaya miring
                const groundY = 160;
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(20, groundY); ctx.lineTo(w - 20, groundY); ctx.stroke();

                const bx = 30 + p * (w - 110);
                const by = groundY - 30;

                ctx.fillStyle = '#10b981';
                ctx.fillRect(bx, by, 40, 30);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif';
                ctx.fillText('m', bx + 15, by + 20);

                // Garis Gaya Miring F
                const rad = ((currentRawData.theta || 30) * Math.PI) / 180;
                const arrowLen = 50;
                const ax = bx + 40 + arrowLen * Math.cos(rad);
                const ay = by + 15 - arrowLen * Math.sin(rad);

                ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(bx + 40, by + 15); ctx.lineTo(ax, ay); ctx.stroke();

                // Sudut θ
                ctx.setLineDash([2, 2]); ctx.strokeStyle = '#94a3b8';
                ctx.beginPath(); ctx.moveTo(bx + 40, by + 15); ctx.lineTo(bx + 90, by + 15); ctx.stroke();
                ctx.setLineDash([]);

            } else if (currentSubCalcCase === 1) {
                // Mobil berakselerasi (Teorema Usaha-Energi)
                const groundY = 160;
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(20, groundY); ctx.lineTo(w - 20, groundY); ctx.stroke();

                // Bergerak makin cepat (p^2)
                const bx = 30 + (p * p) * (w - 100);
                const by = groundY - 25;

                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(bx, by, 45, 25);
                ctx.fillStyle = '#ffffff'; ctx.font = '10px sans-serif';
                ctx.fillText('v(t)', bx + 12, by + 16);

            } else if (currentSubCalcCase === 2) {
                // Jatuh Bebas dari ketinggian h
                const groundY = 190;
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(40, groundY); ctx.lineTo(w - 40, groundY); ctx.stroke();

                // Bola jatuh
                const startY = 40;
                const ballY = startY + (p * p) * (groundY - startY - 15);

                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(w / 2, ballY, 15, 0, Math.PI * 2); ctx.fill();

                // Update Grafik Energi
                const epPct = (1 - (ballY - startY) / (groundY - startY - 15)) * 100;
                const ekPct = 100 - epPct;
                updateEnergyBars(epPct, ekPct);

            } else if (currentSubCalcCase === 3) {
                // Jatuh dari h1 ke h2
                const groundY = 190;
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(40, groundY); ctx.lineTo(w - 40, groundY); ctx.stroke();

                const h1Y = 40;
                const h2Y = 130;
                const currentY = h1Y + p * (h2Y - h1Y);

                // Garis penanda ketinggian h2
                ctx.setLineDash([3, 3]); ctx.strokeStyle = '#f59e0b';
                ctx.beginPath(); ctx.moveTo(40, h2Y); ctx.lineTo(w - 40, h2Y); ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#8b5cf6';
                ctx.beginPath(); ctx.arc(w / 2, currentY, 14, 0, Math.PI * 2); ctx.fill();

                const epPct = (1 - (currentY - h1Y) / (groundY - h1Y)) * 100;
                const ekPct = 100 - epPct;
                updateEnergyBars(epPct, ekPct);

            } else if (currentSubCalcCase === 4) {
                // Motor Listrik mengangkat beban
                const topY = 40;
                const pulleyX = w / 2;

                ctx.fillStyle = '#64748b';
                ctx.beginPath(); ctx.arc(pulleyX, topY, 18, 0, Math.PI * 2); ctx.fill();

                const boxY = 170 - p * 90; // terangkat naik
                ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(pulleyX, topY); ctx.lineTo(pulleyX, boxY); ctx.stroke();

                ctx.fillStyle = '#10b981';
                ctx.fillRect(pulleyX - 15, boxY, 30, 30);
                ctx.fillStyle = '#ffffff'; ctx.font = '10px sans-serif';
                ctx.fillText('w', pulleyX - 4, boxY + 18);
            }

        } else if (currentMainMod === 2) {
            // Mode Pegas (Hukum Hooke)
            const wallX = 30;
            const centerY = h / 2;
            const eqX = 140; // posisi setimbang
            const stretchX = eqX + p * (currentRawData.dx || 0.2) * 200; // animasi meregang

            // Tembok kiri
            ctx.fillStyle = '#64748b';
            ctx.fillRect(10, centerY - 40, 20, 80);

            // Garis setimbang
            ctx.setLineDash([2, 2]); ctx.strokeStyle = '#cbd5e1';
            ctx.beginPath(); ctx.moveTo(eqX, centerY - 50); ctx.lineTo(eqX, centerY + 50); ctx.stroke();
            ctx.setLineDash([]);

            // Gambar Pegas (Zig-zag)
            ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(wallX, centerY);
            
            const coils = 10;
            const springWidth = stretchX - wallX;
            for (let i = 0; i <= coils; i++) {
                const x = wallX + (i / coils) * springWidth;
                const y = (i === 0 || i === coils) ? centerY : centerY + (i % 2 === 0 ? 15 : -15);
                ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Beban di ujung pegas
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(stretchX, centerY - 20, 35, 40);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif';
            ctx.fillText('m', stretchX + 12, centerY + 5);
        }
    }

        const isEn = currentLang === 'en';

        if (currentMainMod === 0) { // Mode 1: Perhitungan
            const val1 = parseFloat(document.getElementById('mod-val-1').value);
            const val2 = parseFloat(document.getElementById('mod-val-2').value);
            if (isNaN(val1) || isNaN(val2)) { showFeedback('error', t.errFillFields); return; }

            if (currentSubCalcCase === 0) {
                const { F, theta, s } = currentRawData;
                const rad = (theta * Math.PI) / 180;
                const expectedFx = F * Math.cos(rad);
                const expectedW = expectedFx * s;

                if (Math.abs(val1 - expectedFx) < 0.3 && Math.abs(val2 - expectedW) < 0.5) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Force Fₓ:' : 'Gaya Fₓ:'} <b>${expectedFx.toFixed(2)} N</b><br>• ${isEn ? 'Work W:' : 'Usaha W:'} <b>${expectedW.toFixed(2)} J</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be Fₓ:' : 'Seharusnya Fₓ:'} <b>${expectedFx.toFixed(2)} N</b><br>• ${isEn ? 'Should be W:' : 'Seharusnya W:'} <b>${expectedW.toFixed(2)} J</b>`);
                }

            } else if (currentSubCalcCase === 1) {
                const { m, v1, v2 } = currentRawData;
                const expectedEk1 = 0.5 * m * Math.pow(v1, 2);
                const expectedEk2 = 0.5 * m * Math.pow(v2, 2);
                const expectedW = expectedEk2 - expectedEk1;

                if (Math.abs(val1 - expectedEk1) < 0.3 && Math.abs(val2 - expectedW) < 0.5) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Initial Ek₁:' : 'Ek Awal:'} <b>${expectedEk1.toFixed(2)} J</b><br>• ${isEn ? 'Work W:' : 'Usaha W:'} <b>${expectedW.toFixed(2)} J</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be Ek₁:' : 'Seharusnya Ek₁:'} <b>${expectedEk1.toFixed(2)} J</b><br>• ${isEn ? 'Should be W:' : 'Seharusnya W:'} <b>${expectedW.toFixed(2)} J</b>`);
                }

            } else if (currentSubCalcCase === 2) {
                const { m, h } = currentRawData;
                const expectedEp = m * G * h;
                const expectedV = Math.sqrt(2 * G * h);

                if (Math.abs(val1 - expectedEp) < 0.5 && Math.abs(val2 - expectedV) < 0.3) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Potential Energy Ep:' : 'Energi Potensial Ep:'} <b>${expectedEp.toFixed(2)} J</b><br>• ${isEn ? 'Impact Velocity v:' : 'Kecepatan v:'} <b>${expectedV.toFixed(2)} m/s</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be Ep:' : 'Seharusnya Ep:'} <b>${expectedEp.toFixed(2)} J</b><br>• ${isEn ? 'Should be v:' : 'Seharusnya v:'} <b>${expectedV.toFixed(2)} m/s</b>`);
                }

            } else if (currentSubCalcCase === 3) {
                const { m, h1, h2 } = currentRawData;
                const expectedV2 = Math.sqrt(2 * G * (h1 - h2));
                const expectedEk2 = 0.5 * m * Math.pow(expectedV2, 2);

                if (Math.abs(val1 - expectedV2) < 0.3 && Math.abs(val2 - expectedEk2) < 0.5) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Velocity v₂:' : 'Kecepatan v₂:'} <b>${expectedV2.toFixed(2)} m/s</b><br>• ${isEn ? 'Kinetic Energy Ek₂:' : 'Energi Kinetik Ek₂:'} <b>${expectedEk2.toFixed(2)} J</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be v₂:' : 'Seharusnya v₂:'} <b>${expectedV2.toFixed(2)} m/s</b><br>• ${isEn ? 'Should be Ek₂:' : 'Seharusnya Ek₂:'} <b>${expectedEk2.toFixed(2)} J</b>`);
                }

            } else if (currentSubCalcCase === 4) {
                const { w, h, t: timeVal, Pin } = currentRawData;
                const expectedPout = (w * h) / timeVal;
                const expectedEta = (expectedPout / Pin) * 100;

                if (Math.abs(val1 - expectedPout) < 0.3 && Math.abs(val2 - expectedEta) < 0.5) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Output Power P_out:' : 'Daya Output P_out:'} <b>${expectedPout.toFixed(2)} W</b><br>• ${isEn ? 'Efficiency η:' : 'Efisiensi η:'} <b>${expectedEta.toFixed(1)}%</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be P_out:' : 'Seharusnya P_out:'} <b>${expectedPout.toFixed(2)} W</b><br>• ${isEn ? 'Should be η:' : 'Seharusnya η:'} <b>${expectedEta.toFixed(1)}%</b>`);
                }
            }

        } else if (currentMainMod === 1) { // Mode 2: Pemahaman Konsep
            const a1 = document.getElementById('concept-ans-1').value;
            const a2 = document.getElementById('concept-ans-2').value;

            if (a1 === "" || a2 === "") {
                showFeedback('error', t.errFillFields);
                return;
            }

            const cases = energyConceptCasesData[currentLang];
            const c = cases[currentConceptIndex];
            const isCorrect1 = parseInt(a1) === c.ans1;
            const isCorrect2 = parseInt(a2) === c.ans2;

            if (isCorrect1 && isCorrect2) {
                showFeedback('success', `${t.evalSuccessConcept}<br>${c.diffExplanation}`);
            } else {
                showFeedback('warning', `${t.evalFailConcept}<br>• ${t.conceptUI.q1Label} <b>${c.options1[c.ans1]}</b><br>• ${t.conceptUI.q2Label} <b>${c.options2[c.ans2]}</b><br><br>${c.diffExplanation}`);
            }

        } else if (currentMainMod === 2) { // Mode 3: Pegas (Hukum Hooke)
            const val1 = parseFloat(document.getElementById('mod-val-1').value);
            const val2 = parseFloat(document.getElementById('mod-val-2').value);
            if (isNaN(val1) || isNaN(val2)) { showFeedback('error', t.errFillFields); return; }

            const { k, dx } = currentRawData;
            const expectedF = k * dx;
            const expectedEp = 0.5 * k * Math.pow(dx, 2);

            if (Math.abs(val1 - expectedF) < 0.3 && Math.abs(val2 - expectedEp) < 0.3) {
                showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Spring Force F:' : 'Gaya Pegas F:'} <b>${expectedF.toFixed(2)} N</b><br>• ${isEn ? 'Potential Energy Ep:' : 'Energi Potensial Ep:'} <b>${expectedEp.toFixed(2)} J</b>`);
            } else {
                showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be F:' : 'Seharusnya F:'} <b>${expectedF.toFixed(2)} N</b><br>• ${isEn ? 'Should be Ep:' : 'Seharusnya Ep:'} <b>${expectedEp.toFixed(2)} J</b>`);
            }
        }
    }
</script>
