            mod1Desc: "Calculate Hydrostatic Pressure (P<sub>h</sub> = ρ · g · h), Total Absolute Pressure (P<sub>tot</sub> = P<sub>0</sub> + P<sub>h</sub>), and Bottom Thrust Force (F = P<sub>tot</sub> · A). [g = 9.8 m/s², P<sub>0</sub> = 101,325 Pa]",

            mod2Title: "U-Tube Manometer & Density Ratio",
            mod2Desc: "Using the Fundamental Principle of Hydrostatics (P<sub>A</sub> = P<sub>B</sub> ⇒ ρ₁ · h₁ = ρ₂ · h₂), determine the unknown liquid height or fluid density.",
            mod2Val: "Unknown Liquid Height or Density (h₂ [cm] or ρ₂ [kg/m³]):",

            mod3Title: "Pascal's Law (Hydraulic Lift)",
            mod3Desc: "Based on Pascal's Principle (F₁ / A₁ = F₂ / A₂), calculate Output Force (F₂) and Mechanical Advantage ratio (F₂ / F₁).",

            mod4Title: "Archimedes' Principle & Buoyancy",
            mod4Desc: "Calculate Buoyant Force (F<sub>A</sub> = ρ<sub>f</sub> · V<sub>submerged</sub> · g), Apparent Weight (W<sub>app</sub> = W<sub>actual</sub> - F<sub>A</sub>), and identify the object's State.",
            mod4Fa: "1. Buoyant Force F<sub>A</sub> (N):",

            mod4Sink: "SINKING",

            mod5Title: "Capillarity & Viscosity",
            mod5Desc: "Calculate Capillary Rise/Fall (h = 2γ cosθ / (ρ g r)) and Stokes' Viscous Drag Force (F<sub>f</sub> = 6π η r v).",
            mod5Cap: "1. Capillary Height h (mm) [(+) rise, (-) fall]:",
            mod5Visc: "2. Stokes' Viscous Drag F<sub>f</sub> (N):",

            symbolTitle: "Physics Parameters & Symbols:",
            errFillAll: "⚠️ Please fill in all analysis fields first.",
            successMod: "🎉 <b>Spot on!</b> Your calculation and analysis align perfectly with Hydrostatic Fluid laws.",
            warnModTitle: "<b>Analysis Not Quite Correct:</b><br><ul>",
        }
    };

    let currentLang = 'id';
    let currentTheme = 'light';
    let currentModIndex = 0;
    let currentRawData = {};

    const g = 9.8; // m/s2
    const P0 = 101325; // Pa

    function applySettings(isInitial = false) {
        currentLang = localStorage.getItem('user_lang') || 'id';
        currentTheme = localStorage.getItem('user_theme');

        document.documentElement.lang = currentLang;

        if (currentTheme) {
            document.documentElement.setAttribute('data-theme', currentTheme);
        } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }

        updateUIStaticText();
        initNav();
        
        if (isInitial) {
            generateNewData();
        } else {
            renderCurrentQuestionUI();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        applySettings(true);
    });

    window.addEventListener('storage', (e) => {
        if (e.key === 'user_theme' || e.key === 'user_lang') {
            applySettings(false);
        }
    });

    function updateUIStaticText() {
        const t = translations[currentLang];
        document.getElementById('page-title').innerText = t.pageTitle;
        document.getElementById('header-title').innerText = t.headerTitle;
        document.getElementById('home-text').innerText = t.homeText;
        document.getElementById('select-mod-label').innerHTML = `<i class="fa-solid fa-compass"></i> ${t.selectModLabel}`;
        document.getElementById('btn-new-sample').innerText = t.btnNewSample;
        document.getElementById('btn-submit').innerText = t.btnSubmit;
    }

    const modules = [
        {
            id: 'hydro-press',
            icon: '🌊',
            nameKey: 0,
            generate: () => {
                const fluids = [
                    { name: 'Air / Water', rho: 1000 },
                    { name: 'Minyak / Oil', rho: 800 },
                    { name: 'Raksa / Mercury', rho: 13600 },
                    { name: 'Glisering / Glycerin', rho: 1260 }
                ];
                const fluid = fluids[Math.floor(Math.random() * fluids.length)];
                const h = parseFloat((Math.random() * 8 + 0.5).toFixed(2)); // m
                const area = parseFloat((Math.random() * 3 + 0.2).toFixed(2)); // m2

                const Ph = fluid.rho * g * h;
                const Ptot = P0 + Ph;
                const F = Ptot * area;

                return {
                    fluid: fluid.name,
                    rho: fluid.rho,
                    h: h,
                    area: area,
                    Ph: Ph,
                    Ptot: Ptot,
                    F: F
                };
            }
        },
        {
            id: 'u-tube',
            icon: '🧪',
            nameKey: 1,
            generate: () => {
                const rho1 = 1000;
                const h1 = parseFloat((Math.random() * 15 + 5).toFixed(1)); // cm
                const unknownType = Math.random() > 0.5 ? 'h2' : 'rho2';
                
                const rho2Options = [800, 13600, 750, 900];
                const rho2 = rho2Options[Math.floor(Math.random() * rho2Options.length)];
                
                const h2 = parseFloat(((rho1 * h1) / rho2).toFixed(2));

                return {
                    rho1: rho1,
                    h1: h1,
                    rho2: rho2,
                    h2: h2,
                    target: unknownType
                };
            }
        },
        {
            id: 'pascal',
            icon: '⚙️',
            nameKey: 2,
            generate: () => {
                const F1 = Math.floor(Math.random() * 400 + 50); // N
                const r1 = parseFloat((Math.random() * 4 + 1).toFixed(1)); // cm
                const r2 = parseFloat((Math.random() * 20 + 8).toFixed(1)); // cm
                
                const A1 = Math.PI * Math.pow(r1 / 100, 2);
                const A2 = Math.PI * Math.pow(r2 / 100, 2);
                
                const F2 = F1 * (A2 / A1);
                const ratio = A2 / A1;

                return {
                    F1: F1,
                    r1: r1,
                    r2: r2,
                    A1: A1,
                    A2: A2,
                    F2: F2,
                    ratio: ratio
                };
            }
        },
        {
            id: 'archimedes',
            icon: '⚓',
            nameKey: 3,
            generate: () => {
                const states = ['TERAPUNG', 'MELAYANG', 'TENGGELAM'];
                const selectedState = states[Math.floor(Math.random() * states.length)];
                
                const rho_f = 1000; // Water
                const V_buka = parseFloat((Math.random() * 0.05 + 0.01).toFixed(4)); // m3
                let rho_b, V_tercelup, stateStr;

                if (selectedState === 'TERAPUNG') {
                    rho_b = Math.floor(Math.random() * 400 + 400); // < 1000
                    V_tercelup = (rho_b / rho_f) * V_buka;
                    stateStr = 'TERAPUNG';
                } else if (selectedState === 'MELAYANG') {
                    rho_b = 1000;
                    V_tercelup = V_buka;
                    stateStr = 'MELAYANG';
                } else {
                    rho_b = Math.floor(Math.random() * 3000 + 2000); // > 1000
                    V_tercelup = V_buka;
                    stateStr = 'TENGGELAM';
                }

                const W_asli = rho_b * V_buka * g;
                const Fa = rho_f * V_tercelup * g;
                const W_semu = Math.max(0, W_asli - Fa);

                return {
                    rho_f: rho_f,
                    rho_b: rho_b,
                    V_buka: V_buka,
                    V_tercelup: V_tercelup,
                    W_asli: W_asli,
                    Fa: Fa,
                    W_semu: W_semu,
                    state: stateStr
                };
            }
        },
        {
            id: 'visc-cap',
            icon: '💧',
            nameKey: 4,
            generate: () => {
                const isWater = Math.random() > 0.4;
                const gamma = isWater ? 0.0728 : 0.465;
                const thetaDeg = isWater ? 0 : 140;
                const thetaRad = (thetaDeg * Math.PI) / 180;
                const rho = isWater ? 1000 : 13600;
                const r_mm = parseFloat((Math.random() * 0.8 + 0.2).toFixed(2)); // mm
                const r = r_mm / 1000; // m

                const h_m = (2 * gamma * Math.cos(thetaRad)) / (rho * g * r);
                const h_mm = h_m * 1000;

                const eta = parseFloat((Math.random() * 0.8 + 0.1).toFixed(2)); // Pa·s
                const r_sphere = parseFloat((Math.random() * 3 + 1).toFixed(1)); // mm
                const v = parseFloat((Math.random() * 2 + 0.2).toFixed(2)); // m/s
                
                const Ff = 6 * Math.PI * eta * (r_sphere / 1000) * v;

                return {
                    isWater: isWater,
                    gamma: gamma,
                    thetaDeg: thetaDeg,
                    rho: rho,
                    r_mm: r_mm,
                    h_mm: h_mm,
                    eta: eta,
                    r_sphere: r_sphere,
                    v: v,
                    Ff: Ff
                };
            }
        }
    ];

    function initNav() {
        const nav = document.getElementById('module-nav');
        nav.innerHTML = '';
        const t = translations[currentLang];
        modules.forEach((mod, idx) => {
            const card = document.createElement('div');
            card.className = `mod-card ${idx === currentModIndex ? 'active' : ''}`;
            card.onclick = () => switchModule(idx);
            
            const modMeta = t.modules[idx];
            card.innerHTML = `
                <div class="mod-card-icon">${modMeta.icon}</div>
                <div class="mod-card-title">${modMeta.name}</div>
            `;
            nav.appendChild(card);
        });
    }

    function switchModule(index) {
        currentModIndex = index;
        initNav();
        generateNewData();
    }

    function generateNewData() {
        const mod = modules[currentModIndex];
        currentRawData = mod.generate();
        renderCurrentQuestionUI();
    }

    function renderCurrentQuestionUI() {
        const mod = modules[currentModIndex];
        const t = translations[currentLang];

        document.getElementById('feedback').style.display = 'none';

        const legendBox = document.getElementById('symbol-legend-box');
        legendBox.style.display = 'none';

        const dynamicInputs = document.getElementById('dynamic-inputs');
        dynamicInputs.innerHTML = '';

        document.getElementById('inst-icon').innerText = mod.icon;
        document.getElementById('task-title').innerText = t[`mod${currentModIndex + 1}Title`];
        document.getElementById('task-desc').innerHTML = t[`mod${currentModIndex + 1}Desc`];

        if (currentModIndex === 0) {
            // Hydrostatic Pressure
            const d = currentRawData;
            document.getElementById('sensor-display').innerHTML = `
                <span class="sensor-section">Fluida: <b>${d.fluid}</b> (ρ = ${d.rho} kg/m³)</span>
                <span class="sensor-section">Kedalaman (h) = <b>${d.h} m</b></span>
                <span class="sensor-section">Luas Alas (A) = <b>${d.area} m²</b></span>
            `;

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label for="input-ph">${t.mod1Ph}</label>
                    <input type="number" id="input-ph" step="any" placeholder="P_h (Pa)">
                </div>
                <div class="control-group">
                    <label for="input-ptot">${t.mod1Ptot}</label>
                    <input type="number" id="input-ptot" step="any" placeholder="P_tot (Pa)">
                </div>
                <div class="control-group">
                    <label for="input-f">${t.mod1F}</label>
                    <input type="number" id="input-f" step="any" placeholder="F (N)">
                </div>
            `;
        } else if (currentModIndex === 1) {
            // U-Tube
            const d = currentRawData;
            if (d.target === 'h2') {
                document.getElementById('sensor-display').innerHTML = `
                    <span class="sensor-section">Fluida 1 (Air): ρ₁ = ${d.rho1} kg/m³, h₁ = ${d.h1} cm</span>
                    <span class="sensor-section">Fluida 2: ρ₂ = <b>${d.rho2} kg/m³</b></span>
                    <span class="sensor-section">Hitung ketinggian <b>h₂ (cm)</b></span>
                `;
            } else {
                document.getElementById('sensor-display').innerHTML = `
                    <span class="sensor-section">Fluida 1 (Air): ρ₁ = ${d.rho1} kg/m³, h₁ = ${d.h1} cm</span>
                    <span class="sensor-section">Fluida 2: h₂ = <b>${d.h2} cm</b></span>
                    <span class="sensor-section">Hitung massa jenis <b>ρ₂ (kg/m³)</b></span>
                `;
            }

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label for="input-utube">${t.mod2Val}</label>
                    <input type="number" id="input-utube" step="any" placeholder="${d.target === 'h2' ? 'h₂ (cm)' : 'ρ₂ (kg/m³)'}">
                </div>
            `;
        } else if (currentModIndex === 2) {
            // Pascal
            const d = currentRawData;
            document.getElementById('sensor-display').innerHTML = `
                <span class="sensor-section">Gaya Input (F₁) = <b>${d.F1} N</b></span>
                <span class="sensor-section">Jari-jari Piston 1 (r₁) = <b>${d.r1} cm</b></span>
                <span class="sensor-section">Jari-jari Piston 2 (r₂) = <b>${d.r2} cm</b></span>
            `;

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label for="input-f2">${t.mod3F2}</label>
                    <input type="number" id="input-f2" step="any" placeholder="F₂ (N)">
                </div>
                <div class="control-group">
                    <label for="input-ratio">${t.mod3Ratio}</label>
                    <input type="number" id="input-ratio" step="any" placeholder="F₂ / F₁">
                </div>
            `;
        } else if (currentModIndex === 3) {
            // Archimedes
            const d = currentRawData;
            document.getElementById('sensor-display').innerHTML = `
                <span class="sensor-section">Fluida: Air (ρ<sub>f</sub> = ${d.rho_f} kg/m³)</span>
                <span class="sensor-section">Benda: ρ<sub>benda</sub> = <b>${d.rho_b} kg/m³</b></span>
                <span class="sensor-section">Volume Total (V<sub>benda</sub>) = <b>${d.V_buka} m³</b></span>
            `;

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label for="input-fa">${t.mod4Fa}</label>
                    <input type="number" id="input-fa" step="any" placeholder="F_A (N)">
                </div>
                <div class="control-group">
                    <label for="input-wapp">${t.mod4WApp}</label>
                    <input type="number" id="input-wapp" step="any" placeholder="W_semu (N)">
                </div>
                <div class="control-group">
                    <label for="input-state">${t.mod4State}</label>
                    <select id="input-state">
                        <option value="">${t.mod4StateSelect}</option>
                        <option value="TERAPUNG">${t.mod4Float}</option>
                        <option value="MELAYANG">${t.mod4Suspend}</option>
                        <option value="TENGGELAM">${t.mod4Sink}</option>
                    </select>
                </div>
            `;
        } else if (currentModIndex === 4) {
            // Viscosity & Capillarity
            const d = currentRawData;
            const liquidName = d.isWater ? 'Air' : 'Raksa / Mercury';
            document.getElementById('sensor-display').innerHTML = `
                <span class="sensor-section"><span class="sensor-tag">[Kapilaritas]</span> ${liquidName}</span>
                <span class="sensor-section">γ = ${d.gamma} N/m &nbsp;|&nbsp; θ = ${d.thetaDeg}° &nbsp;|&nbsp; r<sub>pipa</sub> = ${d.r_mm} mm</span>
                <span class="sensor-section" style="margin-top: 6px;"><span class="sensor-tag">[Viskositas]</span> Bola dalam Cairan</span>
                <span class="sensor-section">η = ${d.eta} Pa·s &nbsp;|&nbsp; r<sub>bola</sub> = ${d.r_sphere} mm &nbsp;|&nbsp; v = ${d.v} m/s</span>
            `;

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label for="input-cap">${t.mod5Cap}</label>
                    <input type="number" id="input-cap" step="any" placeholder="h (mm)">
                </div>
                <div class="control-group">
                    <label for="input-visc">${t.mod5Visc}</label>
                    <input type="number" id="input-visc" step="any" placeholder="F_f (N)">
                </div>
            `;
        }
    }

    function showFeedback(type, message) {
        const fb = document.getElementById('feedback');
        fb.className = `feedback ${type}`;
        fb.innerHTML = message;
        fb.style.display = 'block';
    }

    function checkTolerance(userVal, correctVal, tolPercent = 2.5) {
        if (isNaN(userVal)) return false;
        if (correctVal === 0) return Math.abs(userVal) < 0.001;
        const diff = Math.abs((userVal - correctVal) / correctVal) * 100;
        return diff <= tolPercent;
    }

    function submitAnalysis() {
        const t = translations[currentLang];
        const d = currentRawData;
        let isCorrect = true;
        let warnMsgs = [];

        if (currentModIndex === 0) {
            const userPh = parseFloat(document.getElementById('input-ph').value);
            const userPtot = parseFloat(document.getElementById('input-ptot').value);
            const userF = parseFloat(document.getElementById('input-f').value);

            if (isNaN(userPh) || isNaN(userPtot) || isNaN(userF)) {
                showFeedback('error', t.errFillAll);
                return;
            }

            if (!checkTolerance(userPh, d.Ph)) {
                isCorrect = false;
                warnMsgs.push(`<li>P<sub>h</sub> seharusnya: <b>${d.Ph.toFixed(1)} Pa</b></li>`);
            }
            if (!checkTolerance(userPtot, d.Ptot)) {
                isCorrect = false;
                warnMsgs.push(`<li>P<sub>tot</sub> seharusnya: <b>${d.Ptot.toFixed(1)} Pa</b></li>`);
            }
            if (!checkTolerance(userF, d.F)) {
                isCorrect = false;
                warnMsgs.push(`<li>Gaya Tekan F seharusnya: <b>${d.F.toFixed(1)} N</b></li>`);
            }
        } else if (currentModIndex === 1) {
            const userVal = parseFloat(document.getElementById('input-utube').value);

            if (isNaN(userVal)) {
                showFeedback('error', t.errFillAll);
                return;
            }

            const expected = d.target === 'h2' ? d.h2 : d.rho2;
            const unit = d.target === 'h2' ? 'cm' : 'kg/m³';

            if (!checkTolerance(userVal, expected)) {
                isCorrect = false;
                warnMsgs.push(`<li>Nilai ${d.target === 'h2' ? 'h₂' : 'ρ₂'} seharusnya: <b>${expected} ${unit}</b></li>`);
            }
        } else if (currentModIndex === 2) {
            const userF2 = parseFloat(document.getElementById('input-f2').value);
            const userRatio = parseFloat(document.getElementById('input-ratio').value);

            if (isNaN(userF2) || isNaN(userRatio)) {
                showFeedback('error', t.errFillAll);
                return;
            }

            if (!checkTolerance(userF2, d.F2)) {
                isCorrect = false;
                warnMsgs.push(`<li>Gaya Output F₂ seharusnya: <b>${d.F2.toFixed(1)} N</b></li>`);
            }
            if (!checkTolerance(userRatio, d.ratio)) {
                isCorrect = false;
                warnMsgs.push(`<li>Keuntungan Mekanik (F₂/F₁) seharusnya: <b>${d.ratio.toFixed(2)}</b></li>`);
            }
        } else if (currentModIndex === 3) {
            const userFa = parseFloat(document.getElementById('input-fa').value);
            const userWapp = parseFloat(document.getElementById('input-wapp').value);
            const userState = document.getElementById('input-state').value;

            if (isNaN(userFa) || isNaN(userWapp) || !userState) {
                showFeedback('error', t.errFillAll);
                return;
            }

            if (!checkTolerance(userFa, d.Fa)) {
                isCorrect = false;
                warnMsgs.push(`<li>Gaya Apung F<sub>A</sub> seharusnya: <b>${d.Fa.toFixed(2)} N</b></li>`);
            }
            if (!checkTolerance(userWapp, d.W_semu)) {
                isCorrect = false;
                warnMsgs.push(`<li>Berat Semu W<sub>semu</sub> seharusnya: <b>${d.W_semu.toFixed(2)} N</b></li>`);
            }
            if (userState !== d.state) {
                isCorrect = false;
                warnMsgs.push(`<li>Kondisi benda seharusnya: <b>${d.state}</b></li>`);
            }
        } else if (currentModIndex === 4) {
            const userCap = parseFloat(document.getElementById('input-cap').value);
            const userVisc = parseFloat(document.getElementById('input-visc').value);

            if (isNaN(userCap) || isNaN(userVisc)) {
                showFeedback('error', t.errFillAll);
                return;
            }

            if (!checkTolerance(userCap, d.h_mm)) {
                isCorrect = false;
                warnMsgs.push(`<li>Tinggi Kapiler h seharusnya: <b>${d.h_mm.toFixed(2)} mm</b></li>`);
            }
            if (!checkTolerance(userVisc, d.Ff)) {
                isCorrect = false;
                warnMsgs.push(`<li>Gaya Stokes F<sub>f</sub> seharusnya: <b>${d.Ff.toFixed(4)} N</b></li>`);
            }
        }

        if (isCorrect) {
            showFeedback('success', t.successMod);
        } else {
            showFeedback('warning', t.warnModTitle + warnMsgs.join('') + '</ul>');
        }
    }
</script>
</body>
</html>
