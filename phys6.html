<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topik 6: Impuls, Momentum & Dinamika Rotasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --accent: #38bdf8;
            --accent-light: #e0f2fe;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --sensor-bg: #0f172a;
            --sensor-text: #38bdf8;
            --sensor-border: #1e293b;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --success-bg: #dcfce7;
            --success-color: #16a34a;
            --success-border: #86efac;
            --warning-bg: #fef3c7;
            --warning-color: #d97706;
            --warning-border: #fcd34d;
            --error-bg: #fee2e2;
            --error-color: #dc2626;
            --error-border: #fca5a5;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #f8fafc;
            --accent: #38bdf8;
            --accent-light: rgba(56, 189, 248, 0.15);
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --sensor-bg: #022c22;
            --sensor-text: #4ade80;
            --sensor-border: #065f46;
            --input-bg: #0f172a;
            --input-border: #475569;
            --success-bg: rgba(34, 197, 94, 0.15);
            --success-color: #4ade80;
            --success-border: #22c55e;
            --warning-bg: rgba(245, 158, 11, 0.15);
            --warning-color: #fbbf24;
            --warning-border: #f59e0b;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-color: #f87171;
            --error-border: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            max-width: 980px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--card-border);
        }

        header {
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back, .btn-theme, .btn-lang {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
            background: var(--bg);
            padding: 0.5rem 0.9rem;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover, .btn-theme:hover, .btn-lang:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        h1 { margin: 0; font-size: 1.4rem; color: var(--primary); font-weight: 800; }

        .module-selector-container {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
        }

        .module-selector-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .mod-card {
            background: var(--bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .mod-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
        }

        .mod-card.active {
            background: rgba(37, 99, 235, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .mod-card-icon {
            font-size: 1.2rem;
            background: var(--card-bg);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .mod-card.active .mod-card-icon {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .mod-card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .lab-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .lab-grid { grid-template-columns: 1fr; }
            .module-grid { grid-template-columns: 1fr; }
        }

        .instrument-panel {
            background: var(--bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
        }

        .sensor-display {
            background: var(--sensor-bg);
            color: var(--sensor-text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.92rem;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid var(--sensor-border);
            margin: 15px 0;
            text-align: left;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            word-break: break-all;
            width: 100%;
            box-sizing: border-box;
            white-space: pre-line;
            line-height: 1.5;
        }

        .task-card {
            background: var(--bg);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-top: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
        }

        .task-card h4 { margin: 0 0 8px 0; color: var(--secondary); font-weight: 700; font-size: 1.05rem; }
        .task-card p { margin: 0; color: var(--text-muted); font-size: 0.88rem; line-height: 1.5; }

        .control-group {
            width: 100%;
            margin-bottom: 12px;
        }

        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-action {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .btn-action:hover { background-color: var(--primary-dark); }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            display: none;
            line-height: 1.5;
        }

        .feedback.success { background: var(--success-bg); color: var(--success-color); border: 1px solid var(--success-border); }
        .feedback.warning { background: var(--warning-bg); color: var(--warning-color); border: 1px solid var(--warning-border); }
        .feedback.error { background: var(--error-bg); color: var(--error-color); border: 1px solid var(--error-border); }

        canvas {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-top: 10px;
            touch-action: none;
            width: 100%;
            max-width: 340px;
        }

        .canvas-controls {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
        }

        .btn-sub {
            flex: 1;
            padding: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-sub:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 id="title-txt">Impuls, Tumbukan & Dinamika Rotasi</h1>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;" id="subtitle-txt">Modul Interaktif Fisika Dasar</p>
        </div>
        <div class="header-actions">
            <button class="btn-lang" onclick="toggleLanguage()" id="btn-lang">🌐 EN</button>
            <button class="btn-theme" onclick="toggleTheme()" id="btn-theme">🌙 Mode</button>
        </div>
    </header>

    <!-- Module Selector -->
    <div class="module-selector-container">
        <div class="module-selector-label" id="select-mod-label">
            <i class="fa-solid fa-compass"></i> Pilih Sub-Topik Pembelajaran
        </div>
        <div class="module-grid" id="module-nav"></div>
    </div>

    <div class="lab-grid">
        <!-- Visual Display Panel -->
        <div class="instrument-panel">
            <div class="instrument-icon" id="inst-icon" style="font-size: 2rem;">🚀</div>
            <div style="color: var(--text-muted); font-size: 0.9rem; font-weight: 700; margin-top: 5px;" id="inst-name">Panel Visualisasi</div>
            
            <div class="sensor-display" id="sensor-display">Memuat data...</div>
            
            <canvas id="sim-canvas" width="340" height="200" style="display: none;"></canvas>
            
            <div class="canvas-controls" id="canvas-btn-group" style="display: none;">
                <button class="btn-sub" onclick="startAnim()" id="btn-start-sim">▶️ Mulai Sim</button>
                <button class="btn-sub" onclick="resetAnim()" id="btn-reset-sim">⏹️ Reset</button>
            </div>

            <button class="btn-action" style="background: var(--bg); color: var(--text-main); border: 1px solid var(--card-border); padding: 8px; margin-top: 10px;" onclick="generateNewData()" id="btn-new-sample">
                🔄 Sampel / Soal Baru
            </button>
        </div>

        <!-- Student Input / Analysis Panel -->
        <div>
            <div class="task-card">
                <h4 id="task-title">Judul Modul</h4>
                <p id="task-desc">Petunjuk tugas akan muncul di sini.</p>
            </div>

            <div id="dynamic-inputs"></div>

            <button class="btn-action" id="btn-submit" onclick="submitAnalysis()">Kirim Data Analisis</button>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>
</div>

<script>
    // Language State
    let currentLang = 'id';
    let currentTheme = 'light';
    let currentModule = 0;
    let currentData = {};
    let animFrame = null;
    let animRunning = false;
    let animTime = 0;

    const modules = [
        {
            id: 'impulse_momentum',
            icon: '⚡',
            title: { id: 'Impuls & Teorema Impuls-Momentum', en: 'Impulse & Impulse-Momentum Theorem' },
            desc: {
                id: 'Analisis gaya impulsif F yang bekerja pada benda bermassa m selama selang waktu dt untuk mengubah kecepatannya dari v1 ke v2 (J = F*dt = m*(v2 - v1)).',
                en: 'Analyze the impulsive force F acting on mass m over duration dt to change velocity from v1 to v2 (J = F*dt = m*(v2 - v1)).'
            }
        },
        {
            id: 'collisions_elastic',
            icon: '💥',
            title: { id: 'Tumbukan Lenting Sempurna (e=1)', en: 'Elastic Collision (e=1)' },
            desc: {
                id: 'Tumbukan 1-Dimensi di mana hukum kekekalan momentum dan energi kinetik berlaku penuh. Hitung kecepatan akhir v1\' dan v2\'.',
                en: '1D collision preserving both momentum and kinetic energy (e=1). Calculate final velocities v1\' and v2\'.'
            }
        },
        {
            id: 'collisions_inelastic',
            icon: '🧱',
            title: { id: 'Tumbukan Tak Lenting Sama Sekali', en: 'Perfectly Inelastic Collision' },
            desc: {
                id: 'Dua benda bertumbukan dan menyatu (e=0). Hitung kecepatan bersama vf dan hilangnya energi kinetik (Delta EK).',
                en: 'Two bodies collide and stick together (e=0). Calculate common velocity vf and kinetic energy loss (Delta EK).'
            }
        },
        {
            id: 'coefficient_restitution',
            icon: '🎾',
            title: { id: 'Koefisien Restitusi (e)', en: 'Coefficient of Restitution (e)' },
            desc: {
                id: 'Analisis tumbukan sebagian lenting (0 < e < 1) atau pantulan bola dari ketinggian h1 ke h2 di mana e = sqrt(h2/h1).',
                en: 'Analyze partially elastic collision (0 < e < 1) or ball bounce from h1 to h2 where e = sqrt(h2/h1).'
            }
        },
        {
            id: 'torque_inertia',
            icon: '🔩',
            title: { id: 'Torsi & Momen Inersia', en: 'Torque & Moment of Inertia' },
            desc: {
                id: 'Hitung torsi tau = F * r * sin(theta) dan momen inersia I untuk berbagai bentuk benda tegar.',
                en: 'Calculate torque tau = F * r * sin(theta) and moment of inertia I for rigid bodies.'
            }
        },
        {
            id: 'rotational_dynamics',
            icon: '🎡',
            title: { id: 'Dinamika & Kinematika Rotasi', en: 'Rotational Dynamics & Kinematics' },
            desc: {
                id: 'Simulasi roda berotasi dengan percepatan sudut alpha = tau / I. Hitung kecepatan sudut omega dan sudut tempuh theta.',
                en: 'Simulate rotating wheel with angular acceleration alpha = tau / I. Compute angular velocity omega and angle theta.'
            }
        }
    ];

    function init() {
        renderModuleNav();
        loadModule(0);
    }

    function toggleLanguage() {
        currentLang = currentLang === 'id' ? 'en' : 'id';
        document.getElementById('btn-lang').innerText = currentLang === 'id' ? '🌐 EN' : '🌐 ID';
        document.getElementById('title-txt').innerText = currentLang === 'id' ? 'Impuls, Tumbukan & Dinamika Rotasi' : 'Impulse, Collisions & Rotational Dynamics';
        document.getElementById('subtitle-txt').innerText = currentLang === 'id' ? 'Modul Interaktif Fisika Dasar' : 'Basic Physics Interactive Module';
        document.getElementById('select-mod-label').innerHTML = `<i class="fa-solid fa-compass"></i> ${currentLang === 'id' ? 'Pilih Sub-Topik Pembelajaran' : 'Select Learning Sub-Topic'}`;
        document.getElementById('btn-submit').innerText = currentLang === 'id' ? 'Kirim Data Analisis' : 'Submit Analysis Data';
        document.getElementById('btn-new-sample').innerText = currentLang === 'id' ? '🔄 Sampel / Soal Baru' : '🔄 New Sample / Problem';
        document.getElementById('btn-start-sim').innerText = currentLang === 'id' ? '▶️ Mulai Sim' : '▶️ Start Sim';
        document.getElementById('btn-reset-sim').innerText = currentLang === 'id' ? '⏹️ Reset' : '⏹️ Reset';
        
        renderModuleNav();
        loadModule(currentModule, false);
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('btn-theme').innerText = currentTheme === 'light' ? '🌙 Mode' : '☀️ Mode';
        drawCanvas();
    }

    function renderModuleNav() {
        const nav = document.getElementById('module-nav');
        nav.innerHTML = '';
        modules.forEach((mod, idx) => {
            const card = document.createElement('div');
            card.className = `mod-card ${idx === currentModule ? 'active' : ''}`;
            card.onclick = () => loadModule(idx);
            card.innerHTML = `
                <div class="mod-card-icon">${mod.icon}</div>
                <div class="mod-card-title">${mod.title[currentLang]}</div>
            `;
            nav.appendChild(card);
        });
    }

    function loadModule(idx, generateNew = true) {
        currentModule = idx;
        renderModuleNav();
        const mod = modules[idx];
        
        document.getElementById('inst-icon').innerText = mod.icon;
        document.getElementById('inst-name').innerText = mod.title[currentLang];
        document.getElementById('task-title').innerText = mod.title[currentLang];
        document.getElementById('task-desc').innerText = mod.desc[currentLang];

        document.getElementById('feedback').style.display = 'none';

        if (generateNew) {
            generateNewData();
        } else {
            updateDisplay();
            renderInputs();
        }
    }

    function generateNewData() {
        cancelAnimationFrame(animFrame);
        animRunning = false;
        animTime = 0;

        switch (currentModule) {
            case 0: // Impulse & Momentum
                currentData = {
                    m: +(Math.random() * 2 + 0.5).toFixed(2), // 0.5 - 2.5 kg
                    v1: +(Math.random() * 10 - 5).toFixed(1), // -5 to 5 m/s
                    v2: +(Math.random() * 15 + 5).toFixed(1), // 5 to 20 m/s
                    dt: +(Math.random() * 0.05 + 0.01).toFixed(3) // 0.01 - 0.06 s
                };
                break;

            case 1: // Elastic Collision
                currentData = {
                    m1: +(Math.random() * 3 + 1).toFixed(1),
                    v1: +(Math.random() * 8 + 2).toFixed(1),
                    m2: +(Math.random() * 3 + 1).toFixed(1),
                    v2: -(+(Math.random() * 5 + 1).toFixed(1))
                };
                break;

            case 2: // Perfectly Inelastic Collision
                currentData = {
                    m1: +(Math.random() * 4 + 1).toFixed(1),
                    v1: +(Math.random() * 10 + 2).toFixed(1),
                    m2: +(Math.random() * 4 + 1).toFixed(1),
                    v2: +(Math.random() * 4 - 2).toFixed(1)
                };
                break;

            case 3: // Coefficient of Restitution
                currentData = {
                    h1: +(Math.random() * 5 + 2).toFixed(2), // Initial height 2-7 m
                    e: +(Math.random() * 0.5 + 0.4).toFixed(2) // e between 0.4 - 0.9
                };
                // Calculate resulting h2
                currentData.h2 = +(currentData.h1 * currentData.e * currentData.e).toFixed(2);
                break;

            case 4: // Torque & Moment of Inertia
                const shapes = [
                    { name: 'Silinder Pejal (1/2 M R²)', k: 0.5 },
                    { name: 'Bola Pejal (2/5 M R²)', k: 0.4 },
                    { name: 'Cincin / Silinder Tipis (M R²)', k: 1.0 }
                ];
                const selectedShape = shapes[Math.floor(Math.random() * shapes.length)];
                currentData = {
                    shapeName: selectedShape.name,
                    k: selectedShape.k,
                    m: +(Math.random() * 5 + 1).toFixed(1),
                    r: +(Math.random() * 0.5 + 0.1).toFixed(2),
                    f: +(Math.random() * 20 + 5).toFixed(1),
                    thetaDeg: [30, 45, 60, 90][Math.floor(Math.random() * 4)]
                };
                break;

            case 5: // Rotational Dynamics & Kinematics
                currentData = {
                    I: +(Math.random() * 0.8 + 0.2).toFixed(2), // kg m2
                    tau: +(Math.random() * 4 + 1).toFixed(2), // N m
                    t: +(Math.random() * 4 + 2).toFixed(1) // 2 - 6 s
                };
                break;
        }

        updateDisplay();
        renderInputs();
        drawCanvas();
    }

    function updateDisplay() {
        const disp = document.getElementById('sensor-display');
        const canvas = document.getElementById('sim-canvas');
        const btnGroup = document.getElementById('canvas-btn-group');

        canvas.style.display = 'none';
        btnGroup.style.display = 'none';

        if (currentLang === 'id') {
            switch (currentModule) {
                case 0:
                    disp.innerHTML = `Massa Benda (m)     : ${currentData.m} kg\nKecepatan Awal (v1) : ${currentData.v1} m/s\nKecepatan Akhir (v2): ${currentData.v2} m/s\nDurasi Gaya (dt)    : ${currentData.dt} s`;
                    break;
                case 1:
                    disp.innerHTML = `Benda 1: m1 = ${currentData.m1} kg, v1 = ${currentData.v1} m/s\nBenda 2: m2 = ${currentData.m2} kg, v2 = ${currentData.v2} m/s\n\nSifat: Tumbukan Lenting Sempurna (e = 1.0)`;
                    canvas.style.display = 'block';
                    btnGroup.style.display = 'flex';
                    break;
                case 2:
                    disp.innerHTML = `Benda 1: m1 = ${currentData.m1} kg, v1 = ${currentData.v1} m/s\nBenda 2: m2 = ${currentData.m2} kg, v2 = ${currentData.v2} m/s\n\nSifat: Tumbukan Tak Lenting Sama Sekali (e = 0)`;
                    canvas.style.display = 'block';
                    btnGroup.style.display = 'flex';
                    break;
                case 3:
                    disp.innerHTML = `Tinggi Awal Bola (h1)  : ${currentData.h1} m\nTinggi Pantulan (h2)   : ${currentData.h2} m\nPercepatan Gravitasi g : 9.8 m/s²`;
                    canvas.style.display = 'block';
                    btnGroup.style.display = 'flex';
                    break;
                case 4:
                    disp.innerHTML = `Bentuk Benda  : ${currentData.shapeName}\nMassa (M)     : ${currentData.m} kg\nJari-jari (R) : ${currentData.r} m\nGaya Tangensial (F): ${currentData.f} N\nSudut Gaya (θ): ${currentData.thetaDeg}°`;
                    break;
                case 5:
                    disp.innerHTML = `Momen Inersia (I) : ${currentData.I} kg·m²\nTorsi Total (τ)   : ${currentData.tau} N·m\nWaktu Rotasi (t)  : ${currentData.t} s`;
                    canvas.style.display = 'block';
                    btnGroup.style.display = 'flex';
                    break;
            }
        } else {
            switch (currentModule) {
                case 0:
                    disp.innerHTML = `Mass (m)            : ${currentData.m} kg\nInitial Velocity(v1): ${currentData.v1} m/s\nFinal Velocity (v2) : ${currentData.v2} m/s\nForce Duration (dt) : ${currentData.dt} s`;
                    break;
                case 1:
                    disp.innerHTML = `Body 1: m1 = ${currentData.m1} kg, v1 = ${currentData.v1} m/s\nBody 2: m2 = ${currentData.m2} kg, v2 = ${currentData.v2} m/s\n\nProperty: Perfectly Elastic Collision (e = 1.0)`;
                    canvas.style.display = 'block';
                    btnGroup.style.display = 'flex';
                    break;
                case 2:
                    disp.innerHTML = `Body 1: m1 = ${currentData.m1} kg, v1 = ${currentData.v1} m/s\nBody 2: m2 = ${currentData.m2} kg, v2 = ${currentData.v2} m/s\n\nProperty: Perfectly Inelastic Collision (e = 0)`;
                    canvas.style.display = 'block';
                    btnGroup.style.display = 'flex';
                    break;
                case 3:
                    disp.innerHTML = `Initial Height (h1) : ${currentData.h1} m\nBounce Height (h2)  : ${currentData.h2} m\nGravity (g)         : 9.8 m/s²`;
                    canvas.style.display = 'block';
                    btnGroup.style.display = 'flex';
                    break;
                case 4:
                    disp.innerHTML = `Shape Object : ${currentData.shapeName}\nMass (M)     : ${currentData.m} kg\nRadius (R)   : ${currentData.r} m\nForce (F)    : ${currentData.f} N\nForce Angle  : ${currentData.thetaDeg}°`;
                    break;
                case 5:
                    disp.innerHTML = `Moment of Inertia (I): ${currentData.I} kg·m²\nNet Torque (τ)       : ${currentData.tau} N·m\nRotation Time (t)    : ${currentData.t} s`;
                    canvas.style.display = 'block';
                    btnGroup.style.display = 'flex';
                    break;
            }
        }
    }

    function renderInputs() {
        const container = document.getElementById('dynamic-inputs');
        container.innerHTML = '';

        if (currentModule === 0) {
            container.innerHTML = `
                <div class="control-group">
                    <label>${currentLang === 'id' ? '1. Hitung Perubahan Momentum Δp (N·s / kg·m/s):' : '1. Calculate Momentum Change Δp (N·s):'}</label>
                    <input type="number" step="0.01" id="in_dp" placeholder="e.g. 15.5">
                </div>
                <div class="control-group">
                    <label>${currentLang === 'id' ? '2. Hitung Besar Gaya Impulsif Rata-Rata F (N):' : '2. Calculate Average Impulsive Force F (N):'}</label>
                    <input type="number" step="0.1" id="in_f" placeholder="e.g. 350.0">
                </div>
            `;
        } else if (currentModule === 1) {
            container.innerHTML = `
                <div class="control-group">
                    <label>${currentLang === 'id' ? '1. Kecepatan Akhir Benda 1 v1\' (m/s):' : '1. Final Velocity of Object 1 v1\' (m/s):'}</label>
                    <input type="number" step="0.01" id="in_v1_prime" placeholder="e.g. -2.4">
                </div>
                <div class="control-group">
                    <label>${currentLang === 'id' ? '2. Kecepatan Akhir Benda 2 v2\' (m/s):' : '2. Final Velocity of Object 2 v2\' (m/s):'}</label>
                    <input type="number" step="0.01" id="in_v2_prime" placeholder="e.g. 4.6">
                </div>
            `;
        } else if (currentModule === 2) {
            container.innerHTML = `
                <div class="control-group">
                    <label>${currentLang === 'id' ? '1. Kecepatan Bersama Setelah Tumbukan vf (m/s):' : '1. Common Velocity After Collision vf (m/s):'}</label>
                    <input type="number" step="0.01" id="in_vf" placeholder="e.g. 3.25">
                </div>
                <div class="control-group">
                    <label>${currentLang === 'id' ? '2. Energi Kinetik Hilang ΔEK (Joule):' : '2. Kinetic Energy Loss ΔEK (Joule):'}</label>
                    <input type="number" step="0.1" id="in_dek" placeholder="e.g. 42.1">
                </div>
            `;
        } else if (currentModule === 3) {
            container.innerHTML = `
                <div class="control-group">
                    <label>${currentLang === 'id' ? '1. Nilai Koefisien Restitusi (e):' : '1. Coefficient of Restitution (e):'}</label>
                    <input type="number" step="0.01" id="in_e" placeholder="e.g. 0.75">
                </div>
                <div class="control-group">
                    <label>${currentLang === 'id' ? '2. Kecepatan Tumbuk Sebelum Pantulan v1 = sqrt(2gh1) (m/s):' : '2. Impact Velocity Before Bounce v1 = sqrt(2gh1) (m/s):'}</label>
                    <input type="number" step="0.1" id="in_vimp" placeholder="e.g. 9.9">
                </div>
            `;
        } else if (currentModule === 4) {
            container.innerHTML = `
                <div class="control-group">
                    <label>${currentLang === 'id' ? '1. Momen Inersia I (kg·m²):' : '1. Moment of Inertia I (kg·m²):'}</label>
                    <input type="number" step="0.001" id="in_inertia" placeholder="e.g. 0.125">
                </div>
                <div class="control-group">
                    <label>${currentLang === 'id' ? '2. Torsi Murni τ = F·R·sin(θ) (N·m):' : '2. Torque τ = F·R·sin(θ) (N·m):'}</label>
                    <input type="number" step="0.01" id="in_torque" placeholder="e.g. 1.85">
                </div>
            `;
        } else if (currentModule === 5) {
            container.innerHTML = `
                <div class="control-group">
                    <label>${currentLang === 'id' ? '1. Percepatan Sudut α (rad/s²):' : '1. Angular Acceleration α (rad/s²):'}</label>
                    <input type="number" step="0.01" id="in_alpha" placeholder="e.g. 3.50">
                </div>
                <div class="control-group">
                    <label>${currentLang === 'id' ? '2. Kecepatan Sudut Akhir ω (rad/s) pada detik ke-t:' : '2. Final Angular Velocity ω (rad/s) at time t:'}</label>
                    <input type="number" step="0.1" id="in_omega" placeholder="e.g. 14.0">
                </div>
            `;
        }
    }

    function submitAnalysis() {
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';

        let correct = true;
        let msg = '';

        if (currentModule === 0) {
            const userDp = parseFloat(document.getElementById('in_dp').value);
            const userF = parseFloat(document.getElementById('in_f').value);

            const trueDp = currentData.m * (currentData.v2 - currentData.v1);
            const trueF = trueDp / currentData.dt;

            if (isNaN(userDp) || isNaN(userF)) {
                showFeedback('warning', currentLang === 'id' ? 'Isi semua nilai input!' : 'Fill in all inputs!');
                return;
            }

            const errDp = Math.abs(userDp - trueDp);
            const errF = Math.abs(userF - trueF);

            if (errDp < 0.2 && errF < 2.0) {
                msg = currentLang === 'id' 
                    ? `<b>Sangat Tepat!</b><br>Δp = m(v2 - v1) = ${trueDp.toFixed(2)} kg·m/s.<br>Gaya Impulsif F = Δp / dt = ${trueF.toFixed(1)} N.`
                    : `<b>Perfect!</b><br>Δp = m(v2 - v1) = ${trueDp.toFixed(2)} kg·m/s.<br>Impulsive Force F = Δp / dt = ${trueF.toFixed(1)} N.`;
                showFeedback('success', msg);
            } else {
                msg = currentLang === 'id'
                    ? `<b>Kurang Tepat.</b><br>Kunci: Δp = ${trueDp.toFixed(2)} kg·m/s, F = ${trueF.toFixed(1)} N.`
                    : `<b>Incorrect.</b><br>Key: Δp = ${trueDp.toFixed(2)} kg·m/s, F = ${trueF.toFixed(1)} N.`;
                showFeedback('error', msg);
            }

        } else if (currentModule === 1) {
            const userV1 = parseFloat(document.getElementById('in_v1_prime').value);
            const userV2 = parseFloat(document.getElementById('in_v2_prime').value);

            const { m1, m2, v1, v2 } = currentData;
            const trueV1 = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
            const trueV2 = ((m2 - m1) * v2 + 2 * m1 * v1) / (m1 + m2);

            if (isNaN(userV1) || isNaN(userV2)) {
                showFeedback('warning', currentLang === 'id' ? 'Isi semua nilai input!' : 'Fill in all inputs!');
                return;
            }

            if (Math.abs(userV1 - trueV1) < 0.2 && Math.abs(userV2 - trueV2) < 0.2) {
                msg = currentLang === 'id'
                    ? `<b>Analisis Lenting Sempurna Tepat!</b><br>v1' = ${trueV1.toFixed(2)} m/s<br>v2' = ${trueV2.toFixed(2)} m/s.`
                    : `<b>Elastic Collision Correct!</b><br>v1' = ${trueV1.toFixed(2)} m/s<br>v2' = ${trueV2.toFixed(2)} m/s.`;
                showFeedback('success', msg);
            } else {
                msg = currentLang === 'id'
                    ? `<b>Kurang Tepat.</b><br>Gunakan v1' = [(m1-m2)v1 + 2m2v2]/(m1+m2).<br>Hasil: v1' = ${trueV1.toFixed(2)} m/s, v2' = ${trueV2.toFixed(2)} m/s.`
                    : `<b>Incorrect.</b><br>Use formulas for elastic 1D collision.<br>Expected: v1' = ${trueV1.toFixed(2)} m/s, v2' = ${trueV2.toFixed(2)} m/s.`;
                showFeedback('error', msg);
            }

        } else if (currentModule === 2) {
            const userVf = parseFloat(document.getElementById('in_vf').value);
            const userDek = parseFloat(document.getElementById('in_dek').value);

            const { m1, m2, v1, v2 } = currentData;
            const trueVf = (m1 * v1 + m2 * v2) / (m1 + m2);
            const ek1 = 0.5 * m1 * v1 * v1 + 0.5 * m2 * v2 * v2;
            const ek2 = 0.5 * (m1 + m2) * trueVf * trueVf;
            const trueDek = ek1 - ek2;

            if (isNaN(userVf) || isNaN(userDek)) {
                showFeedback('warning', currentLang === 'id' ? 'Isi semua nilai input!' : 'Fill in all inputs!');
                return;
            }

            if (Math.abs(userVf - trueVf) < 0.15 && Math.abs(userDek - trueDek) < 1.0) {
                msg = currentLang === 'id'
                    ? `<b>Sangat Tepat!</b><br>vf = ${trueVf.toFixed(2)} m/s.<br>Energi Kinetik yang hilang ΔEK = ${trueDek.toFixed(1)} Joules.`
                    : `<b>Great job!</b><br>vf = ${trueVf.toFixed(2)} m/s.<br>Lost Kinetic Energy ΔEK = ${trueDek.toFixed(1)} Joules.`;
                showFeedback('success', msg);
            } else {
                msg = currentLang === 'id'
                    ? `<b>Kurang Tepat.</b><br>Kunci: vf = ${trueVf.toFixed(2)} m/s, ΔEK = ${trueDek.toFixed(1)} J.`
                    : `<b>Incorrect.</b><br>Key: vf = ${trueVf.toFixed(2)} m/s, ΔEK = ${trueDek.toFixed(1)} J.`;
                showFeedback('error', msg);
            }

        } else if (currentModule === 3) {
            const userE = parseFloat(document.getElementById('in_e').value);
            const userVimp = parseFloat(document.getElementById('in_vimp').value);

            const trueE = Math.sqrt(currentData.h2 / currentData.h1);
            const trueVimp = Math.sqrt(2 * 9.8 * currentData.h1);

            if (isNaN(userE) || isNaN(userVimp)) {
                showFeedback('warning', currentLang === 'id' ? 'Isi semua nilai input!' : 'Fill in all inputs!');
                return;
            }

            if (Math.abs(userE - trueE) < 0.05 && Math.abs(userVimp - trueVimp) < 0.3) {
                msg = currentLang === 'id'
                    ? `<b>Tepat Sekali!</b><br>e = sqrt(h2/h1) = ${trueE.toFixed(2)}.<br>Kecepatan sebelum tumbukan v1 = ${trueVimp.toFixed(1)} m/s.`
                    : `<b>Correct!</b><br>e = sqrt(h2/h1) = ${trueE.toFixed(2)}.<br>Impact speed v1 = ${trueVimp.toFixed(1)} m/s.`;
                showFeedback('success', msg);
            } else {
                msg = currentLang === 'id'
                    ? `<b>Kurang Tepat.</b><br>Kunci: e = ${trueE.toFixed(2)}, v1 = ${trueVimp.toFixed(1)} m/s.`
                    : `<b>Incorrect.</b><br>Key: e = ${trueE.toFixed(2)}, v1 = ${trueVimp.toFixed(1)} m/s.`;
                showFeedback('error', msg);
            }

        } else if (currentModule === 4) {
            const userI = parseFloat(document.getElementById('in_inertia').value);
            const userTau = parseFloat(document.getElementById('in_torque').value);

            const trueI = currentData.k * currentData.m * currentData.r * currentData.r;
            const rad = (currentData.thetaDeg * Math.PI) / 180;
            const trueTau = currentData.f * currentData.r * Math.sin(rad);

            if (isNaN(userI) || isNaN(userTau)) {
                showFeedback('warning', currentLang === 'id' ? 'Isi semua nilai input!' : 'Fill in all inputs!');
                return;
            }

            if (Math.abs(userI - trueI) < 0.01 && Math.abs(userTau - trueTau) < 0.1) {
                msg = currentLang === 'id'
                    ? `<b>Perhitungan Torsi & Inersia Tepat!</b><br>I = ${trueI.toFixed(4)} kg·m²<br>τ = ${trueTau.toFixed(2)} N·m.`
                    : `<b>Torque & Inertia Correct!</b><br>I = ${trueI.toFixed(4)} kg·m²<br>τ = ${trueTau.toFixed(2)} N·m.`;
                showFeedback('success', msg);
            } else {
                msg = currentLang === 'id'
                    ? `<b>Kurang Tepat.</b><br>I = k M R² = ${trueI.toFixed(4)} kg·m²<br>τ = F R sin(θ) = ${trueTau.toFixed(2)} N·m.`
                    : `<b>Incorrect.</b><br>I = k M R² = ${trueI.toFixed(4)} kg·m²<br>τ = F R sin(θ) = ${trueTau.toFixed(2)} N·m.`;
                showFeedback('error', msg);
            }

        } else if (currentModule === 5) {
            const userAlpha = parseFloat(document.getElementById('in_alpha').value);
            const userOmega = parseFloat(document.getElementById('in_omega').value);

            const trueAlpha = currentData.tau / currentData.I;
            const trueOmega = trueAlpha * currentData.t;

            if (isNaN(userAlpha) || isNaN(userOmega)) {
                showFeedback('warning', currentLang === 'id' ? 'Isi semua nilai input!' : 'Fill in all inputs!');
                return;
            }

            if (Math.abs(userAlpha - trueAlpha) < 0.1 && Math.abs(userOmega - trueOmega) < 0.5) {
                msg = currentLang === 'id'
                    ? `<b>Sangat Tepat!</b><br>α = τ / I = ${trueAlpha.toFixed(2)} rad/s²<br>ω(t) = α · t = ${trueOmega.toFixed(1)} rad/s.`
                    : `<b>Excellent!</b><br>α = τ / I = ${trueAlpha.toFixed(2)} rad/s²<br>ω(t) = α · t = ${trueOmega.toFixed(1)} rad/s.`;
                showFeedback('success', msg);
            } else {
                msg = currentLang === 'id'
                    ? `<b>Kurang Tepat.</b><br>Kunci: α = ${trueAlpha.toFixed(2)} rad/s², ω = ${trueOmega.toFixed(1)} rad/s.`
                    : `<b>Incorrect.</b><br>Key: α = ${trueAlpha.toFixed(2)} rad/s², ω = ${trueOmega.toFixed(1)} rad/s.`;
                showFeedback('error', msg);
            }
        }
    }

    function showFeedback(type, message) {
        const fb = document.getElementById('feedback');
        fb.className = `feedback ${type}`;
        fb.innerHTML = message;
        fb.style.display = 'block';
    }

    // Animation & Canvas Functions
    function drawCanvas() {
        const canvas = document.getElementById('sim-canvas');
        if (canvas.style.display === 'none') return;

        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        const isDark = currentTheme === 'dark';
        const textColor = isDark ? '#f1f5f9' : '#1e293b';

        if (currentModule === 1 || currentModule === 2) {
            // Collision Visualization
            ctx.beginPath();
            ctx.moveTo(10, height - 30);
            ctx.lineTo(width - 10, height - 30);
            ctx.strokeStyle = isDark ? '#475569' : '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.stroke();

            let x1 = 70;
            let x2 = 250;

            if (animRunning) {
                animTime += 0.02;
                if (currentModule === 1) { // Elastic
                    const { m1, m2, v1, v2 } = currentData;
                    const v1p = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
                    const v2p = ((m2 - m1) * v2 + 2 * m1 * v1) / (m1 + m2);

                    const collideTime = 1.2;
                    if (animTime < collideTime) {
                        x1 = 70 + v1 * 12 * animTime;
                        x2 = 250 + v2 * 12 * animTime;
                    } else {
                        const t2 = animTime - collideTime;
                        const xCollide1 = 70 + v1 * 12 * collideTime;
                        const xCollide2 = 250 + v2 * 12 * collideTime;
                        x1 = xCollide1 + v1p * 12 * t2;
                        x2 = xCollide2 + v2p * 12 * t2;
                    }
                } else { // Inelastic
                    const { m1, m2, v1, v2 } = currentData;
                    const vf = (m1 * v1 + m2 * v2) / (m1 + m2);
                    const collideTime = 1.2;
                    if (animTime < collideTime) {
                        x1 = 70 + v1 * 12 * animTime;
                        x2 = 250 + v2 * 12 * animTime;
                    } else {
                        const t2 = animTime - collideTime;
                        const xCollide = 70 + v1 * 12 * collideTime;
                        x1 = xCollide + vf * 12 * t2;
                        x2 = x1 + 25;
                    }
                }
            }

            // Draw Block 1
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(x1 - 15, height - 55, 30, 25);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText('m1', x1 - 8, height - 38);

            // Draw Block 2
            ctx.fillStyle = '#e11d48';
            ctx.fillRect(x2 - 15, height - 55, 30, 25);
            ctx.fillStyle = '#ffffff';
            ctx.fillText('m2', x2 - 8, height - 38);

        } else if (currentModule === 3) {
            // Ball Bounce Simulation
            ctx.beginPath();
            ctx.moveTo(20, height - 20);
            ctx.lineTo(width - 20, height - 20);
            ctx.strokeStyle = isDark ? '#475569' : '#cbd5e1';
            ctx.lineWidth = 3;
            ctx.stroke();

            let ballY = height - 20 - (currentData.h1 * 20);
            if (animRunning) {
                animTime += 0.03;
                const g = 9.8;
                const tImpact = Math.sqrt((2 * currentData.h1) / g);
                if (animTime < tImpact) {
                    const yPos = 0.5 * g * animTime * animTime;
                    ballY = height - 20 - (currentData.h1 * 20) + (yPos * 20);
                } else {
                    const t2 = animTime - tImpact;
                    const vUp = Math.sqrt(2 * g * currentData.h2);
                    const yPos = vUp * t2 - 0.5 * g * t2 * t2;
                    ballY = height - 20 - Math.max(0, yPos * 20);
                }
            }

            // Draw Ball
            ctx.beginPath();
            ctx.arc(width / 2, ballY, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#059669';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

        } else if (currentModule === 5) {
            // Rotating Wheel Simulation
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = 60;

            let angle = 0;
            if (animRunning) {
                animTime += 0.03;
                const alpha = currentData.tau / currentData.I;
                angle = 0.5 * alpha * animTime * animTime;
            }

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle);

            // Outer Wheel
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Spokes
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(radius * Math.cos((i * Math.PI) / 2), radius * Math.sin((i * Math.PI) / 2));
                ctx.strokeStyle = textColor;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            ctx.restore();
        }

        if (animRunning) {
            animFrame = requestAnimationFrame(drawCanvas);
        }
    }

    function startAnim() {
        if (!animRunning) {
            animRunning = true;
            animTime = 0;
            drawCanvas();
        }
    }

    function resetAnim() {
        animRunning = false;
        cancelAnimationFrame(animFrame);
        animTime = 0;
        drawCanvas();
    }

    window.onload = init;
</script>
