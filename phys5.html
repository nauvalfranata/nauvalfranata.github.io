    /* Event Handler Canvas FBD Drawing */
    function initFbdEvents() {
        const cvs = document.getElementById('dynamics-canvas');
        
        const getCanvasCoords = (e) => {
            const rect = cvs.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        };

        const handleStart = (e) => {
            if (currentMainMod !== 2) return;
            isDrawingVector = true;
            dragStartPos = { x: cvs.width / 2, y: cvs.height / 2 };
            dragCurrentPos = getCanvasCoords(e);
        };

        const handleMove = (e) => {
            if (currentMainMod !== 2 || !isDrawingVector) return;
            dragCurrentPos = getCanvasCoords(e);
            drawFbdCanvas();
        };

        const handleEnd = () => {
            if (currentMainMod !== 2 || !isDrawingVector) return;
            isDrawingVector = false;

            const dx = dragCurrentPos.x - dragStartPos.x;
            const dy = dragCurrentPos.y - dragStartPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 20) {
                let rad = Math.atan2(dy, dx);
                let deg = Math.round(rad * (180 / Math.PI));
                if (deg < 0) deg += 360;

                const t = translations[currentLang];
                let forceName = prompt(t.promptVectorName, "F");
                if (forceName) {
                    userFbdVectors.push({
                        name: forceName.trim().toUpperCase(),
                        angle: deg,
                        dx: dx,
                        dy: dy
                    });
                }
            }
            drawFbdCanvas();
            updateFbdVectorListUI();
        };

        cvs.addEventListener('mousedown', handleStart);
        cvs.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        cvs.addEventListener('touchstart', handleStart);
        cvs.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);
    }

    function clearFbdVectors() {
        userFbdVectors = [];
        drawFbdCanvas();
        updateFbdVectorListUI();
    }

    function removeFbdVector(idx) {
        userFbdVectors.splice(idx, 1);

    function updateFbdVectorListUI() {
        const container = document.getElementById('fbd-vector-list');
        if (!container) return;
        container.innerHTML = '';
        const t = translations[currentLang];

        if (userFbdVectors.length === 0) {
            container.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); text-align:center;">${t.noVectors}</div>`;
            return;
        }

        userFbdVectors.forEach((v, idx) => {
            const item = document.createElement('div');
            item.className = 'fbd-vector-item';
            item.innerHTML = `
                <span><span class="fbd-tag">${t.vectorLabel} ${v.name}</span> (${v.angle}°)</span>
                <button class="btn-del-vector" onclick="removeFbdVector(${idx})"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(item);
        });
    }

    function drawFbdCanvas() {
        if (currentMainMod !== 2) return;
        canvas = document.getElementById('dynamics-canvas');
        ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.fillStyle = '#2563eb';
        ctx.fillRect(cx - 30, cy - 25, 60, 50);
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = 2;
        ctx.strokeRect(cx - 30, cy - 25, 60, 50);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('m', cx, cy);

        userFbdVectors.forEach(v => {
            drawArrow(ctx, cx, cy, cx + v.dx, cy + v.dy, '#ef4444', v.name);
        });

        if (isDrawingVector) {
            drawArrow(ctx, cx, cy, dragCurrentPos.x, dragCurrentPos.y, '#38bdf8', '...');
        }
    }

    function drawArrow(context, fromx, fromy, tox, toy, color, label) {
        const headlen = 10;
        const dx = tox - fromx;
        const dy = toy - fromy;
        const angle = Math.atan2(dy, dx);
        
        context.strokeStyle = color;
        context.lineWidth = 3;
        context.beginPath();
        context.moveTo(fromx, fromy);
        context.lineTo(tox, toy);
        context.stroke();

        context.fillStyle = color;
        context.beginPath();
        context.moveTo(tox, toy);
        context.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
        context.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
        context.fill();

        if (label) {
            context.fillStyle = color;
            context.font = 'bold 12px sans-serif';
            context.fillText(label, tox + 12 * Math.cos(angle), toy + 12 * Math.sin(angle));
        }
    }

    /* =========================================================
       GENERASI DATA BARU & ANIMASI SIMULASI USAHA/ENERGI
       ========================================================= */
    function generateNewData() {
        document.getElementById('feedback').style.display = 'none';

        if (currentMainMod === 0) {
            if (currentSubCalcCase === 0) {
                const F = Math.floor(Math.random() * 40) + 20;
                const angles = [0, 30, 45, 60];
                const theta = angles[Math.floor(Math.random() * angles.length)];
                const s = Math.floor(Math.random() * 15) + 5;
                currentRawData = { F, theta, s };
            } else if (currentSubCalcCase === 1) {
                const m = Math.floor(Math.random() * 8) + 2;
                const v1 = Math.floor(Math.random() * 5) + 2;
                const v2 = v1 + Math.floor(Math.random() * 8) + 3;
                currentRawData = { m, v1, v2 };
            } else if (currentSubCalcCase === 2) {
                const m = Math.floor(Math.random() * 10) + 2;
                const h = Math.floor(Math.random() * 20) + 5;
                currentRawData = { m, h };
            } else if (currentSubCalcCase === 3) {
                const m = Math.floor(Math.random() * 6) + 2;
                const h = Math.floor(Math.random() * 25) + 10;
                currentRawData = { m, h };
            } else if (currentSubCalcCase === 4) {
                const Ein = (Math.floor(Math.random() * 20) + 10) * 100;
                const Wout = Math.floor(Ein * (Math.random() * 0.4 + 0.5));
                const t = Math.floor(Math.random() * 10) + 5;
                currentRawData = { Ein, Wout, t };
            }
            renderMainModule();
            drawCanvasState(0);

        } else if (currentMainMod === 1) {
            const cases = energyConceptCasesData[currentLang];
            currentConceptIndex = Math.floor(Math.random() * cases.length);
            renderMainModule();

        } else if (currentMainMod === 2) {
            const cases = fbdCasesData[currentLang];
            currentFbdIndex = Math.floor(Math.random() * cases.length);
            userFbdVectors = [];
            renderMainModule();
        }
    }

    function startSim() {
        if (isSimRunning || currentMainMod !== 0) return;
        isSimRunning = true;
        let startTime = null;
        const duration = 2500;

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = Math.min((timestamp - startTime) / duration, 1);
            simProgress = progress;
            drawCanvasState(progress);

            if (progress < 1 && isSimRunning) {
                animationId = requestAnimationFrame(step);
            } else {
                isSimRunning = false;
            }
        }
        animationId = requestAnimationFrame(step);
    }

    function resetSim() {
        isSimRunning = false;
        if (animationId) cancelAnimationFrame(animationId);
        simProgress = 0;
        if (currentMainMod === 0) drawCanvasState(0);
    }

    function drawCanvasState(p) {
        if (currentMainMod !== 0) return;
        canvas = document.getElementById('dynamics-canvas');
        ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const w = canvas.width;
        const h = canvas.height;

        if (currentSubCalcCase === 0 || currentSubCalcCase === 1) {
            // Balok ditarik di permukaan datar
            const groundY = 160;
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(20, groundY); ctx.lineTo(w - 20, groundY); ctx.stroke();

            const blockX = 30 + p * (w - 100);
            const blockY = groundY - 30;

            ctx.fillStyle = '#2563eb';
            ctx.fillRect(blockX, blockY, 40, 30);
            ctx.fillStyle = '#ffffff'; ctx.font = '12px sans-serif';
            ctx.fillText('m', blockX + 15, blockY + 20);

            if (currentSubCalcCase === 0) {
                // Gambar Vektor Gaya Bersudut
                const rad = ((currentRawData.theta || 0) * Math.PI) / 180;
                const fx = Math.cos(rad) * 45;
                const fy = -Math.sin(rad) * 45;
                drawArrow(ctx, blockX + 40, blockY + 15, blockX + 40 + fx, blockY + 15 + fy, '#38bdf8', 'F');
            } else {
                // Tampilkan perubahan Vektor Kecepatan (v1 -> v2)
                const vScale = 20 + p * 30;
                drawArrow(ctx, blockX + 40, blockY + 15, blockX + 40 + vScale, blockY + 15, '#22c55e', 'v');
            }

        } else if (currentSubCalcCase === 2 || currentSubCalcCase === 3) {
            // Simulasi Benda Jatuh Bebas / Energi Potensial
            const topY = 40;
            const bottomY = 180;
            const startX = w / 2 - 20;
            const currentY = topY + p * (bottomY - topY);

            // Garis Ketinggian h
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(startX - 30, topY); ctx.lineTo(startX - 30, bottomY); ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#64748b'; ctx.font = '11px sans-serif';
            ctx.fillText('h', startX - 45, (topY + bottomY) / 2);

            // Tanah
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(40, bottomY + 20); ctx.lineTo(w - 40, bottomY + 20); ctx.stroke();

            // Bola / Balok
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(startX + 20, currentY, 16, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif';
            ctx.fillText('m', startX + 15, currentY + 4);

            // Diagram Batang Energi (Ep vs Ek)
            const barWidth = 15;
            const maxBarH = 120;
            const epH = (1 - p) * maxBarH;
            const ekH = p * maxBarH;

            // Ep Bar (Biru)
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(w - 50, bottomY - epH, barWidth, epH);
            // Ek Bar (Hijau)
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(w - 30, bottomY - ekH, barWidth, ekH);

            ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif';
            ctx.fillText('Ep Ek', w - 52, bottomY + 12);

        } else if (currentSubCalcCase === 4) {
            // Diagram Daya & Efisiensi Mesin
            const cx = w / 2;
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(cx - 60, 60, 120, 80);

            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('MESIN / GENERATOR', cx, 100);

            // Panah Input (Kiri)
            drawArrow(ctx, cx - 110, 100, cx - 65, 100, '#38bdf8', 'E_in');
            // Panah Output (Kanan)
            drawArrow(ctx, cx + 65, 100, cx + 110, 100, '#22c55e', 'W_out');
        }
    }

    /* =========================================================
       SUBMIT & FEEDBACK EVALUASI
       ========================================================= */
    function showFeedback(type, message) {
        const fb = document.getElementById('feedback');
        fb.className = `feedback ${type}`;
        fb.innerHTML = message;
        fb.style.display = 'block';
    }

    function submitAnalysis() {
        const t = translations[currentLang];
        const isEn = currentLang === 'en';

        if (currentMainMod === 0) { // Mode 1: Perhitungan
            const val1 = parseFloat(document.getElementById('mod-val-1').value);
            const val2 = parseFloat(document.getElementById('mod-val-2').value);
            if (isNaN(val1) || isNaN(val2)) { showFeedback('error', t.errFillFields); return; }

            if (currentSubCalcCase === 0) {
                const rad = (currentRawData.theta * Math.PI) / 180;
                const expectedFx = currentRawData.F * Math.cos(rad);
                const expectedW = expectedFx * currentRawData.s;

                if (Math.abs(val1 - expectedFx) < 0.3 && Math.abs(val2 - expectedW) < 0.5) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Parallel Force Fₓ:' : 'Gaya Sejajar Fₓ:'} <b>${expectedFx.toFixed(2)} N</b><br>• ${isEn ? 'Total Work W:' : 'Usaha W:'} <b>${expectedW.toFixed(2)} Joule</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be Fₓ:' : 'Seharusnya Fₓ:'} <b>${expectedFx.toFixed(2)} N</b><br>• ${isEn ? 'Should be W:' : 'Seharusnya W:'} <b>${expectedW.toFixed(2)} Joule</b>`);
                }

            } else if (currentSubCalcCase === 1) {
                const { m, v1, v2 } = currentRawData;
                const expectedEk2 = 0.5 * m * Math.pow(v2, 2);
                const ek1 = 0.5 * m * Math.pow(v1, 2);
                const expectedW = expectedEk2 - ek1;

                if (Math.abs(val1 - expectedEk2) < 0.5 && Math.abs(val2 - expectedW) < 0.5) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Final Ek₂:' : 'Energi Kinetik Akhir Ek₂:'} <b>${expectedEk2.toFixed(1)} J</b><br>• ${isEn ? 'Work ΔEk:' : 'Usaha Total W:'} <b>${expectedW.toFixed(1)} Joule</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be Ek₂:' : 'Seharusnya Ek₂:'} <b>${expectedEk2.toFixed(1)} J</b><br>• ${isEn ? 'Should be W:' : 'Seharusnya W:'} <b>${expectedW.toFixed(1)} Joule</b>`);
                }

            } else if (currentSubCalcCase === 2) {
                const { m, h } = currentRawData;
                const expectedEp = m * G * h;
                const expectedWg = expectedEp; // Usaha gravitasi mengangkat = mgh

                if (Math.abs(val1 - expectedEp) < 0.5 && Math.abs(val2 - expectedWg) < 0.5) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Potential Energy Ep:' : 'Energi Potensial Ep:'} <b>${expectedEp.toFixed(1)} J</b><br>• ${isEn ? 'Gravity Work W_g:' : 'Usaha Gravitasi W_g:'} <b>${expectedWg.toFixed(1)} Joule</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be Ep:' : 'Seharusnya Ep:'} <b>${expectedEp.toFixed(1)} J</b><br>• ${isEn ? 'Should be W_g:' : 'Seharusnya W_g:'} <b>${expectedWg.toFixed(1)} Joule</b>`);
                }

            } else if (currentSubCalcCase === 3) {
                const { m, h } = currentRawData;
                const expectedV = Math.sqrt(2 * G * h);
                const expectedEkMax = m * G * h;

                if (Math.abs(val1 - expectedV) < 0.3 && Math.abs(val2 - expectedEkMax) < 0.5) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Velocity v:' : 'Kecepatan v:'} <b>${expectedV.toFixed(2)} m/s</b><br>• ${isEn ? 'Max Ek:' : 'Ek Maksimum:'} <b>${expectedEkMax.toFixed(1)} Joule</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be v:' : 'Seharusnya v:'} <b>${expectedV.toFixed(2)} m/s</b><br>• ${isEn ? 'Should be Ek:' : 'Seharusnya Ek:'} <b>${expectedEkMax.toFixed(1)} Joule</b>`);
                }

            } else if (currentSubCalcCase === 4) {
                const { Ein, Wout, t: time } = currentRawData;
                const expectedP = Wout / time;
                const expectedEta = (Wout / Ein) * 100;

                if (Math.abs(val1 - expectedP) < 0.3 && Math.abs(val2 - expectedEta) < 0.5) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Power Output P:' : 'Daya P:'} <b>${expectedP.toFixed(2)} Watt</b><br>• ${isEn ? 'Efficiency η:' : 'Efisiensi η:'} <b>${expectedEta.toFixed(1)}%</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be P:' : 'Seharusnya P:'} <b>${expectedP.toFixed(2)} Watt</b><br>• ${isEn ? 'Should be η:' : 'Seharusnya η:'} <b>${expectedEta.toFixed(1)}%</b>`);
                }
            }

        } else if (currentMainMod === 1) { // Mode 2: Pemahaman Konsep
            const a1 = document.getElementById('concept-ans-1').value;
            const a2 = document.getElementById('concept-ans-2').value;

            if (a1 === "" || a2 === "") {
                showFeedback('error', t.errFillFields);
                return;
            }

            const cases = energyConceptCasesData[currentLang];
            const c = cases[currentConceptIndex];
            const isCorrect1 = parseInt(a1) === c.ans1;
            const isCorrect2 = parseInt(a2) === c.ans2;

            if (isCorrect1 && isCorrect2) {
                showFeedback('success', `${t.evalSuccessConcept}<br>${c.diffExplanation}`);
            } else {
                showFeedback('warning', `${t.evalFailConcept}<br>• ${t.conceptUI.q1Label} <b>${c.options1[c.ans1]}</b><br>• ${t.conceptUI.q2Label} <b>${c.options2[c.ans2]}</b><br><br>${c.diffExplanation}`);
            }

        } else if (currentMainMod === 2) { // Mode 3: FBD Evaluation
            if (userFbdVectors.length === 0) {
                showFeedback('error', t.errFbdNoVector);
                return;
            }

            const cases = fbdCasesData[currentLang];
            const c = cases[currentFbdIndex];
            let score = 0;
            let totalReq = c.requiredVectors.length;

            c.requiredVectors.forEach(req => {
                const match = userFbdVectors.some(uv => {
                    const angleDiff = Math.abs(uv.angle - req.angle);
                    return angleDiff < 35 || Math.abs(angleDiff - 360) < 35;
                });
                if (match) score++;
            });

            if (score === totalReq) {
                showFeedback('success', t.evalSuccessFbd);
            } else {
                const promptText = isEn 
                    ? `⚠️ <b>Incomplete or Incorrect Free-Body Diagram.</b><br>Score Detected: <b>${score} of ${totalReq} required forces</b>.<br>Ensure you draw the following forces in correct directions:<br>`
                    : `⚠️ <b>Diagram Gaya Belum Lengkap/Tepat.</b><br>Skor Terdeteksi: <b>${score} dari ${totalReq} gaya utama</b>.<br>Pastikan Anda menggambar gaya berikut dengan arah yang benar:<br>`;
                showFeedback('warning', promptText + c.requiredVectors.map(r => `• ${r.name}`).join('<br>'));
            }
        }
    }
</script>
