    // State Variables
    let currentLang = 'id';
    let currentTheme = 'light';
    let currentMainMod = 0; // 0: Perhitungan, 1: Konsep, 2: Conserv. Angular Momentum
    let currentSubCalcCase = 0;
    let currentRawData = {};
    let currentConceptIndex = 0;

    // Canvas Animation Control
    let canvas, ctx;
    let animationId = null;
    let simProgress = 0;
    let isSimRunning = false;

    function applySettings() {
        currentLang = localStorage.getItem('user_lang') || 'id';
        currentTheme = localStorage.getItem('user_theme') || 'light';

        document.documentElement.lang = currentLang;
        document.documentElement.setAttribute('data-theme', currentTheme);

        updateUIStaticText();
        initNav();
        renderMainModule();
    }

    document.addEventListener('DOMContentLoaded', () => {
        applySettings();
    });

    window.addEventListener('storage', (e) => {
        if (e.key === 'user_theme' || e.key === 'user_lang') {
            applySettings();
        }
    });

    function updateUIStaticText() {
        const t = translations[currentLang];
        document.getElementById('page-title').innerText = t.pageTitle;
        document.getElementById('header-title').innerText = t.headerTitle;
        document.getElementById('home-text').innerText = t.homeText;
        document.getElementById('select-mod-label').innerHTML = `<i class="fa-solid fa-compass"></i> ${t.selectModLabel}`;
        document.getElementById('btn-new-sample').innerText = t.btnNewSample;
        document.getElementById('btn-submit').innerText = t.btnSubmit;
        document.getElementById('btn-start-sim').innerText = t.btnStartSim;
        document.getElementById('btn-reset-sim').innerText = t.btnResetSim;
    }

    function initNav() {
        const nav = document.getElementById('module-nav');
        nav.innerHTML = '';
        const t = translations[currentLang];
        t.mainModules.forEach((modMeta, idx) => {
            const card = document.createElement('div');
            card.className = `mod-card ${idx === currentMainMod ? 'active' : ''}`;
            card.onclick = () => switchMainModule(idx);
            
            card.innerHTML = `
                <div class="mod-card-icon">${modMeta.icon}</div>
                <div class="mod-card-title">${modMeta.name}</div>
            `;
            nav.appendChild(card);
        });
    }

    function switchMainModule(index) {
        currentMainMod = index;
        initNav();
        generateNewData();
    }

    function renderMainModule() {
        const t = translations[currentLang];
        const canvasEl = document.getElementById('rot-canvas');
        const btnGroup = document.getElementById('canvas-btn-group');
        document.getElementById('feedback').style.display = 'none';

        if (currentMainMod === 0) { // Kalkulasi
            canvasEl.style.display = 'block';
            btnGroup.style.display = 'flex';
            document.getElementById('inst-name').innerText = t.calcUI.instName;
            document.getElementById('inst-icon').innerText = "🔢";

            renderCalcModuleUI();

        } else if (currentMainMod === 1) { // Konsep
            canvasEl.style.display = 'none';
            btnGroup.style.display = 'none';
            document.getElementById('inst-name').innerText = t.conceptUI.instName;
            document.getElementById('inst-icon').innerText = "💡";

            renderConceptModuleUI();

        } else if (currentMainMod === 2) { // Skater Angular Momentum Sim
            canvasEl.style.display = 'block';
            btnGroup.style.display = 'flex';
            document.getElementById('inst-name').innerText = t.rotUI.instName;
            document.getElementById('inst-icon').innerText = "🎡";

    function renderCalcModuleUI() {

        const dynamicInputs = document.getElementById('dynamic-inputs');
        
        document.getElementById('task-title').innerText = t.calcUI.title;
        document.getElementById('task-desc').innerText = t.calcUI.desc;

            <div class="control-group">

    function changeCalcCase(val) {
        currentSubCalcCase = parseInt(val);
        generateNewData();
    }

    function updateCalcSensorDisplay() {
        const d = currentRawData;
        if (!d || Object.keys(d).length === 0) return;

        let txt = "";
        const isEn = currentLang === 'en';

        if (currentSubCalcCase === 0) {
            txt = isEn 
                ? `[Impulse & Momentum]\nMass (m) = ${d.m} kg\nInitial Velocity (v₁) = ${d.v1} m/s\nForce (F) = ${d.F} N | Contact Time (Δt) = ${d.dt} s`
                : `[Impuls & Momentum]\nMassa (m) = ${d.m} kg\nKecepatan Awal (v₁) = ${d.v1} m/s\nGaya (F) = ${d.F} N | Selang Waktu (Δt) = ${d.dt} s`;
        } else if (currentSubCalcCase === 1) {
            txt = isEn 
                ? `[Elastic Collision]\nMass 1 (m₁) = ${d.m1} kg, Initial Vel (v₁) = ${d.v1} m/s\nMass 2 (m₂) = ${d.m2} kg, Initial Vel (v₂) = ${d.v2} m/s`
                : `[Tumbukan Lenting Sempurna]\nMassa 1 (m₁) = ${d.m1} kg, Kecepatan (v₁) = ${d.v1} m/s\nMassa 2 (m₂) = ${d.m2} kg, Kecepatan (v₂) = ${d.v2} m/s`;
        } else if (currentSubCalcCase === 2) {
            txt = isEn 
                ? `[Torque]\nForce (F) = ${d.F} N\nLever Arm (r) = ${d.r} m\nAngle (θ) = ${d.theta}°`
                : `[Torsi / Momen Gaya]\nGaya (F) = ${d.F} N\nLengan Gaya (r) = ${d.r} m\nSudut (θ) = ${d.theta}°`;
        } else if (currentSubCalcCase === 3) {
            txt = isEn 
                ? `[Cylinder Moment of Inertia]\nMass (m) = ${d.m} kg\nRadius (r) = ${d.r} m\nAngular Velocity (ω) = ${d.omega} rad/s`
                : `[Momen Inersia Silinder]\nMassa (m) = ${d.m} kg\nJari-jari (r) = ${d.r} m\nKecepatan Sudut (ω) = ${d.omega} rad/s`;
        } else if (currentSubCalcCase === 4) {
            txt = isEn 
                ? `[Rotational Dynamics]\nMoment of Inertia (I) = ${d.I} kg·m²\nApplied Force (F) = ${d.F} N, Arm (r) = ${d.r} m`
                : `[Dinamika Rotasi]\nMomen Inersia (I) = ${d.I} kg·m²\nGaya Tangan (F) = ${d.F} N, Lengan (r) = ${d.r} m`;
        }

        document.getElementById('sensor-display').innerText = txt;
    }

    /* =========================================================
       GENERASI DATA & ANIMASI
       ========================================================= */
    function generateNewData() {
        document.getElementById('feedback').style.display = 'none';

        if (currentMainMod === 0) {
            if (currentSubCalcCase === 0) {
                const m = Math.floor(Math.random() * 5) + 2;
                const v1 = Math.floor(Math.random() * 6) + 2;
                const F = Math.floor(Math.random() * 40) + 10;
                const dt = parseFloat((Math.random() * 0.4 + 0.1).toFixed(2));
                currentRawData = { m, v1, F, dt };
            } else if (currentSubCalcCase === 1) {
                const m1 = Math.floor(Math.random() * 3) + 2;
                const m2 = Math.floor(Math.random() * 3) + 2;
                const v1 = Math.floor(Math.random() * 8) + 4;
                const v2 = 0;
                currentRawData = { m1, m2, v1, v2 };
            } else if (currentSubCalcCase === 2) {
                const F = Math.floor(Math.random() * 50) + 20;
                const r = parseFloat((Math.random() * 1.5 + 0.5).toFixed(2));
                const angles = [30, 45, 60, 90];
                const theta = angles[Math.floor(Math.random() * angles.length)];
                currentRawData = { F, r, theta };
            } else if (currentSubCalcCase === 3) {
                const m = Math.floor(Math.random() * 8) + 2;
                const r = parseFloat((Math.random() * 0.8 + 0.2).toFixed(2));
                const omega = Math.floor(Math.random() * 10) + 5;
                currentRawData = { m, r, omega };
            } else if (currentSubCalcCase === 4) {
                const I = parseFloat((Math.random() * 1.5 + 0.5).toFixed(2));
                const F = Math.floor(Math.random() * 30) + 10;
                const r = parseFloat((Math.random() * 0.8 + 0.2).toFixed(2));
                currentRawData = { I, F, r };
            }
            renderMainModule();
            drawCanvasState(0);

        } else if (currentMainMod === 1) {
            const cases = rotConceptCasesData[currentLang];
            currentConceptIndex = Math.floor(Math.random() * cases.length);
            renderMainModule();

        } else if (currentMainMod === 2) {
            const I_body = parseFloat((Math.random() * 1.0 + 1.0).toFixed(2));
            const m_hand = parseFloat((Math.random() * 2.0 + 1.0).toFixed(1));
            const r1 = 0.8;
            const r2 = 0.2;
            const w1 = Math.floor(Math.random() * 6) + 4;
            currentRawData = { I_body, m_hand, r1, r2, w1 };
            renderMainModule();
            drawCanvasState(0);
        }
    }

    function startSim() {
        if (isSimRunning) return;
        isSimRunning = true;
        let startTime = null;
        const duration = 3000;

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = Math.min((timestamp - startTime) / duration, 1);
            simProgress = progress;
            drawCanvasState(progress);

            if (progress < 1 && isSimRunning) {
                animationId = requestAnimationFrame(step);
            } else {
                isSimRunning = false;
            }
        }
        animationId = requestAnimationFrame(step);
    }

    function resetSim() {
        isSimRunning = false;
        if (animationId) cancelAnimationFrame(animationId);
        simProgress = 0;
        drawCanvasState(0);
    }

    function drawCanvasState(p) {
        canvas = document.getElementById('rot-canvas');
        if (!canvas || canvas.style.display === 'none') return;
        ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const w = canvas.width;
        const h = canvas.height;

        if (currentMainMod === 0) {
            if (currentSubCalcCase === 0) { // Impuls
                const bx = 40 + p * (w - 80);
                const by = h / 2;
                ctx.fillStyle = '#2563eb';
                ctx.fillRect(bx, by - 20, 40, 40);
                
                if (p < 0.2) {
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('F', bx - 20, by);
                }

            } else if (currentSubCalcCase === 1) { // Tumbukan
                const d = currentRawData;
                let b1x = 30 + p * 80;
                let b2x = 180;

                if (p >= 0.5) {
                    const p2 = (p - 0.5) * 2;
                    const v1p = ((d.m1 - d.m2) * d.v1) / (d.m1 + d.m2);
                    const v2p = (2 * d.m1 * d.v1) / (d.m1 + d.m2);
                    b1x = 110 + p2 * (v1p * 10);
                    b2x = 180 + p2 * (v2p * 10);
                }

                ctx.fillStyle = '#2563eb'; ctx.fillRect(b1x, h / 2 - 15, 30, 30);
                ctx.fillStyle = '#10b981'; ctx.fillRect(b2x, h / 2 - 15, 30, 30);

            } else if (currentSubCalcCase === 2) { // Torsi
                const cx = w / 2, cy = h / 2;
                const angle = p * Math.PI * 0.5;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(80, 0); ctx.stroke();
                ctx.restore();

            } else if (currentSubCalcCase === 3 || currentSubCalcCase === 4) { // Rotasi Silinder
                const cx = w / 2, cy = h / 2;
                const angle = p * Math.PI * 6;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(50, 0); ctx.stroke();
                ctx.restore();
            }

        } else if (currentMainMod === 2) { // Penari Es
            const cx = w / 2, cy = h / 2;
            const d = currentRawData;
            
            // Hitung ω1 dan ω2 untuk simulasi visual kecepatan putar
            const I1 = d.I_body + 2 * d.m_hand * Math.pow(d.r1, 2);
            const I2 = d.I_body + 2 * d.m_hand * Math.pow(d.r2, 2);
            const w2 = (I1 * d.w1) / I2;

            const currentArmLength = d.r1 - p * (d.r1 - d.r2);
            const speedFactor = d.w1 + p * (w2 - d.w1);
            const angle = p * speedFactor * Math.PI * 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            // Badan Penari
            ctx.fillStyle = '#ec4899'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();

            // Tangan Rentang/Lipat
            const armPx = currentArmLength * 60;
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(-armPx, 0); ctx.lineTo(armPx, 0); ctx.stroke();

            // Beban Tangan
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath(); ctx.arc(-armPx, 0, 8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(armPx, 0, 8, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }
    }

    function showFeedback(type, message) {
        const fb = document.getElementById('feedback');
        fb.className = `feedback ${type}`;
        fb.innerHTML = message;
        fb.style.display = 'block';
    }

    function submitAnalysis() {
        const t = translations[currentLang];
        const isEn = currentLang === 'en';

        if (currentMainMod === 0) { // Kalkulasi
            const val1 = parseFloat(document.getElementById('mod-val-1').value);
            const val2 = parseFloat(document.getElementById('mod-val-2').value);
            if (isNaN(val1) || isNaN(val2)) { showFeedback('error', t.errFillFields); return; }

            const d = currentRawData;

            if (currentSubCalcCase === 0) {
                const expI = d.F * d.dt;
                const expV2 = d.v1 + expI / d.m;

                if (Math.abs(val1 - expI) < 0.2 && Math.abs(val2 - expV2) < 0.2) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Impulse I:' : 'Impuls I:'} <b>${expI.toFixed(2)} N·s</b><br>• ${isEn ? 'Final Vel v₂:' : 'Kecepatan Akhir v₂:'} <b>${expV2.toFixed(2)} m/s</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be I:' : 'Seharusnya I:'} <b>${expI.toFixed(2)} N·s</b><br>• ${isEn ? 'Should be v₂:' : 'Seharusnya v₂:'} <b>${expV2.toFixed(2)} m/s</b>`);
                }

            } else if (currentSubCalcCase === 1) {
                const expV1p = ((d.m1 - d.m2) * d.v1) / (d.m1 + d.m2);
                const expV2p = (2 * d.m1 * d.v1) / (d.m1 + d.m2);

                if (Math.abs(val1 - expV1p) < 0.2 && Math.abs(val2 - expV2p) < 0.2) {
                    showFeedback('success', `${t.evalSuccess}<br>• v₁': <b>${expV1p.toFixed(2)} m/s</b><br>• v₂': <b>${expV2p.toFixed(2)} m/s</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be v₁\':' : 'Seharusnya v₁\':'} <b>${expV1p.toFixed(2)} m/s</b><br>• ${isEn ? 'Should be v₂\':' : 'Seharusnya v₂\':'} <b>${expV2p.toFixed(2)} m/s</b>`);
                }

            } else if (currentSubCalcCase === 2) {
                const rad = (d.theta * Math.PI) / 180;
                const expFperp = d.F * Math.sin(rad);
                const expTau = expFperp * d.r;

                if (Math.abs(val1 - expFperp) < 0.2 && Math.abs(val2 - expTau) < 0.2) {
                    showFeedback('success', `${t.evalSuccess}<br>• F⊥: <b>${expFperp.toFixed(2)} N</b><br>• τ: <b>${expTau.toFixed(2)} N·m</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be F⊥:' : 'Seharusnya F⊥:'} <b>${expFperp.toFixed(2)} N</b><br>• ${isEn ? 'Should be τ:' : 'Seharusnya τ:'} <b>${expTau.toFixed(2)} N·m</b>`);
                }

            } else if (currentSubCalcCase === 3) {
                const expI = 0.5 * d.m * Math.pow(d.r, 2);
                const expL = expI * d.omega;

                if (Math.abs(val1 - expI) < 0.05 && Math.abs(val2 - expL) < 0.1) {
                    showFeedback('success', `${t.evalSuccess}<br>• Inertia I: <b>${expI.toFixed(3)} kg·m²</b><br>• Angular Momentum L: <b>${expL.toFixed(3)} kg·m²/s</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be I:' : 'Seharusnya I:'} <b>${expI.toFixed(3)} kg·m²</b><br>• ${isEn ? 'Should be L:' : 'Seharusnya L:'} <b>${expL.toFixed(3)} kg·m²/s</b>`);
                }

            } else if (currentSubCalcCase === 4) {
                const expTau = d.F * d.r;
                const expAlpha = expTau / d.I;

                if (Math.abs(val1 - expTau) < 0.2 && Math.abs(val2 - expAlpha) < 0.2) {
                    showFeedback('success', `${t.evalSuccess}<br>• Torque τ: <b>${expTau.toFixed(2)} N·m</b><br>• Alpha α: <b>${expAlpha.toFixed(2)} rad/s²</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be τ:' : 'Seharusnya τ:'} <b>${expTau.toFixed(2)} N·m</b><br>• ${isEn ? 'Should be α:' : 'Seharusnya α:'} <b>${expAlpha.toFixed(2)} rad/s²</b>`);
                }
            }

        } else if (currentMainMod === 1) { // Konsep
            const a1 = document.getElementById('concept-ans-1').value;
            const a2 = document.getElementById('concept-ans-2').value;

            if (a1 === "" || a2 === "") { showFeedback('error', t.errFillFields); return; }

            const cases = rotConceptCasesData[currentLang];
            const c = cases[currentConceptIndex];
            const isCorrect1 = parseInt(a1) === c.ans1;
            const isCorrect2 = parseInt(a2) === c.ans2;

            if (isCorrect1 && isCorrect2) {
                showFeedback('success', `${t.evalSuccessConcept}<br>${c.diffExplanation}`);
            } else {
                showFeedback('warning', `${t.evalFailConcept}<br>• ${t.conceptUI.q1Label} <b>${c.options1[c.ans1]}</b><br>• ${t.conceptUI.q2Label} <b>${c.options2[c.ans2]}</b><br><br>${c.diffExplanation}`);
            }

        } else if (currentMainMod === 2) { // Penari Es
            const val1 = parseFloat(document.getElementById('mod-val-1').value);
            const val2 = parseFloat(document.getElementById('mod-val-2').value);
            if (isNaN(val1) || isNaN(val2)) { showFeedback('error', t.errFillFields); return; }

            const d = currentRawData;
            const expI1 = d.I_body + 2 * d.m_hand * Math.pow(d.r1, 2);
            const expI2 = d.I_body + 2 * d.m_hand * Math.pow(d.r2, 2);
            const expW2 = (expI1 * d.w1) / expI2;

            if (Math.abs(val1 - expI1) < 0.1 && Math.abs(val2 - expW2) < 0.2) {
                showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Initial Inertia I₁:' : 'Inersia Awal I₁:'} <b>${expI1.toFixed(2)} kg·m²</b><br>• ${isEn ? 'Final Angular Velocity ω₂:' : 'Kecepatan Sudut Akhir ω₂:'} <b>${expW2.toFixed(2)} rad/s</b>`);
            } else {
                showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be I₁:' : 'Seharusnya I₁:'} <b>${expI1.toFixed(2)} kg·m²</b><br>• ${isEn ? 'Should be ω₂:' : 'Seharusnya ω₂:'} <b>${expW2.toFixed(2)} rad/s</b>`);
            }
        }
    }
</script>
