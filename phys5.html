    /* Event Handler Canvas FBD Drawing */
    function initFbdEvents() {
        const cvs = document.getElementById('dynamics-canvas');
        
        const getCanvasCoords = (e) => {
            const rect = cvs.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        };

        const handleStart = (e) => {
            if (currentMainMod !== 2) return;
            isDrawingVector = true;
            dragStartPos = { x: cvs.width / 2, y: cvs.height / 2 };
            dragCurrentPos = getCanvasCoords(e);
        };

        const handleMove = (e) => {
            if (currentMainMod !== 2 || !isDrawingVector) return;
            dragCurrentPos = getCanvasCoords(e);
            drawFbdCanvas();
        };

        const handleEnd = () => {
            if (currentMainMod !== 2 || !isDrawingVector) return;
            isDrawingVector = false;

            const dx = dragCurrentPos.x - dragStartPos.x;
            const dy = dragCurrentPos.y - dragStartPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 20) {
                let rad = Math.atan2(dy, dx);
                let deg = Math.round(rad * (180 / Math.PI));
                if (deg < 0) deg += 360;

                const t = translations[currentLang];
                let forceName = prompt(t.promptVectorName, "F");
                if (forceName) {
                    userFbdVectors.push({
                        name: forceName.trim().toUpperCase(),
                        angle: deg,
                        dx: dx,
                        dy: dy
                    });
                }
            }
            drawFbdCanvas();
            updateFbdVectorListUI();
        };

        cvs.addEventListener('mousedown', handleStart);
        cvs.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        cvs.addEventListener('touchstart', handleStart);
        cvs.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);
    }

    function clearFbdVectors() {
        userFbdVectors = [];
        drawFbdCanvas();
        updateFbdVectorListUI();
    }

    function removeFbdVector(idx) {
        userFbdVectors.splice(idx, 1);

    function updateFbdVectorListUI() {
        const container = document.getElementById('fbd-vector-list');
        if (!container) return;
        container.innerHTML = '';

        if (userFbdVectors.length === 0) {
            container.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); text-align:center;">${t.noVectors}</div>`;
            return;
        }

        userFbdVectors.forEach((v, idx) => {
            const item = document.createElement('div');
            item.className = 'fbd-vector-item';
            item.innerHTML = `
                <span><span class="fbd-tag">${t.vectorLabel} ${v.name}</span> (${v.angle}°)</span>
                <button class="btn-del-vector" onclick="removeFbdVector(${idx})"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(item);
        });
    }

    function drawFbdCanvas() {
        if (currentMainMod !== 2) return;
        canvas = document.getElementById('dynamics-canvas');
        ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(cx - 30, cy - 25, 60, 50);
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = 2;
        ctx.strokeRect(cx - 30, cy - 25, 60, 50);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('m', cx, cy);

        userFbdVectors.forEach(v => {
            drawArrow(ctx, cx, cy, cx + v.dx, cy + v.dy, '#ef4444', v.name);
        });

        if (isDrawingVector) {
            drawArrow(ctx, cx, cy, dragCurrentPos.x, dragCurrentPos.y, '#38bdf8', '...');
        }
    }

    function drawArrow(context, fromx, fromy, tox, toy, color, label) {
        const headlen = 10;
        const dx = tox - fromx;
        const dy = toy - fromy;
        const angle = Math.atan2(dy, dx);
        
        context.strokeStyle = color;
        context.lineWidth = 3;
        context.beginPath();
        context.moveTo(fromx, fromy);
        context.lineTo(tox, toy);
        context.stroke();

        context.fillStyle = color;
        context.beginPath();
        context.moveTo(tox, toy);
        context.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
        context.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
        context.fill();

        if (label) {
            context.fillStyle = color;
            context.font = 'bold 12px sans-serif';
            context.fillText(label, tox + 12 * Math.cos(angle), toy + 12 * Math.sin(angle));
        }
    }

    /* =========================================================
       GENERASI DATA BARU & ANIMASI SIMULASI
       ========================================================= */
    function generateNewData() {
        document.getElementById('feedback').style.display = 'none';

        if (currentMainMod === 0) {
            if (currentSubCalcCase === 0) {
                const m = Math.floor(Math.random() * 8) + 2;
                const F = Math.floor(Math.random() * 30) + 10;
                currentRawData = { m, F };
            } else if (currentSubCalcCase === 1) {
                const m = Math.floor(Math.random() * 6) + 2;
                const uk = parseFloat((Math.random() * 0.3 + 0.1).toFixed(2));
                const fkExact = m * G * uk;
                const F = Math.floor(fkExact + Math.random() * 20 + 10);
                currentRawData = { m, F, uk };
            } else if (currentSubCalcCase === 2) {
                const m = Math.floor(Math.random() * 8) + 2;
                const angles = [30, 45, 60];
                const theta = angles[Math.floor(Math.random() * angles.length)];
                currentRawData = { m, theta };
            } else if (currentSubCalcCase === 3) {
                const m1 = Math.floor(Math.random() * 4) + 2;
                const m2 = m1 + Math.floor(Math.random() * 4) + 2;
                currentRawData = { m1, m2 };
            } else if (currentSubCalcCase === 4) {
                const m = Math.floor(Math.random() * 5) + 1;
                const r = Math.floor(Math.random() * 4) + 2;
                const v = Math.floor(Math.random() * 8) + 4;
                currentRawData = { m, r, v };
            }
            renderMainModule();
            drawCanvasState(0);

        } else if (currentMainMod === 1) {
            const cases = newtonConceptCasesData[currentLang];
            currentConceptIndex = Math.floor(Math.random() * cases.length);
            renderMainModule();

        } else if (currentMainMod === 2) {
            const cases = fbdCasesData[currentLang];
            currentFbdIndex = Math.floor(Math.random() * cases.length);
            userFbdVectors = [];
            renderMainModule();
        }
    }

    function startSim() {
        if (isSimRunning || currentMainMod !== 0) return;
        isSimRunning = true;
        let startTime = null;
        const duration = 2500;

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = Math.min((timestamp - startTime) / duration, 1);
            simProgress = progress;
            drawCanvasState(progress);

            if (progress < 1 && isSimRunning) {
                animationId = requestAnimationFrame(step);
            } else {
                isSimRunning = false;
            }
        }
        animationId = requestAnimationFrame(step);
    }

    function resetSim() {
        isSimRunning = false;
        if (animationId) cancelAnimationFrame(animationId);
        simProgress = 0;
        if (currentMainMod === 0) drawCanvasState(0);
    }

    function drawCanvasState(p) {
        if (currentMainMod !== 0) return;
        canvas = document.getElementById('dynamics-canvas');
        ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const w = canvas.width;
        const h = canvas.height;

        if (currentSubCalcCase === 0 || currentSubCalcCase === 1) {
            const groundY = 160;
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(20, groundY); ctx.lineTo(w - 20, groundY); ctx.stroke();

            const blockX = 30 + (p * p) * (w - 100);
            const blockY = groundY - 30;

            ctx.fillStyle = '#2563eb';
            ctx.fillRect(blockX, blockY, 40, 30);
            ctx.fillStyle = '#ffffff'; ctx.font = '12px sans-serif';
            ctx.fillText('m', blockX + 15, blockY + 20);

            ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(blockX + 40, blockY + 15); ctx.lineTo(blockX + 70, blockY + 15); ctx.stroke();

            if (currentSubCalcCase === 1) {
                ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.moveTo(blockX, blockY + 15); ctx.lineTo(blockX - 25, blockY + 15); ctx.stroke();
            }

        } else if (currentSubCalcCase === 2) {
            // PERBAIKAN: Bidang Miring Licin (Skala Disesuaikan Agar Puncak Selalu Terlihat Jelas)
            const thetaDeg = (currentRawData && currentRawData.theta) ? currentRawData.theta : 30;
            const angleRad = thetaDeg * (Math.PI / 180);

            // Tentukan tinggi maksimum segitiga agar puncak memiliki margin di atas
            const maxRampHeight = h - 60; // Mengatur batas atas puncak agar tidak terpotong (margin top)
            const baseWidth = Math.min(240, maxRampHeight / Math.tan(angleRad));
            const rampHeight = baseWidth * Math.tan(angleRad);

            // Koordinat dasar alas dan puncak
            const x0 = 30, y0 = 190;
            const x1 = x0 + baseWidth; // Ujung alas kanan
            const y1 = y0;
            const x2 = x1;             // Puncak tegak
            const y2 = y0 - rampHeight;

            // Gambar segitiga bidang miring
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath(); 
            ctx.moveTo(x0, y0); 
            ctx.lineTo(x1, y1); 
            ctx.lineTo(x2, y2); 
            ctx.closePath(); 
            ctx.fill();
            ctx.strokeStyle = '#64748b'; 
            ctx.lineWidth = 2; 
            ctx.stroke();

            // Posisi balok di sepanjang hipotenusa (meluncur dari atas ke bawah)
            const startX = x2;
            const startY = y2;
            const endX = x0;
            const endY = y0;

            // p = 0 di atas, p = 1 di bawah (meluncur turun)
            const bx = startX + p * (endX - startX);
            const by = startY + p * (endY - startY);

            const blockW = 34;
            const blockH = 22;

            ctx.save();
            ctx.translate(bx, by);
            // Putar canvas agar balok sejajar sempurna dengan permukaan miring
            ctx.rotate(-angleRad);

            // Gambar balok biru menempel di atas permukaan bidang miring
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(0, -blockH, blockW, blockH);
            ctx.strokeStyle = '#1d4ed8';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(0, -blockH, blockW, blockH);

            // Teks label massa m
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('m', blockW / 2, -blockH / 2);

            ctx.restore();

        } else if (currentSubCalcCase === 3) {
            const pulleyX = w / 2, pulleyY = 40, r = 20;

            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(pulleyX, 0); ctx.lineTo(pulleyX, pulleyY); ctx.stroke();

            ctx.fillStyle = '#94a3b8';
            ctx.beginPath(); ctx.arc(pulleyX, pulleyY, r, 0, Math.PI * 2); ctx.fill();

            const m1Y = 130 - p * 40;
            const m2Y = 110 + p * 40;

            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(pulleyX - r, pulleyY); ctx.lineTo(pulleyX - r, m1Y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pulleyX + r, pulleyY); ctx.lineTo(pulleyX + r, m2Y); ctx.stroke();

            ctx.fillStyle = '#3b82f6'; ctx.fillRect(pulleyX - r - 12, m1Y, 24, 24);
            ctx.fillStyle = '#ef4444'; ctx.fillRect(pulleyX + r - 15, m2Y, 30, 30);

        } else if (currentSubCalcCase === 4) {
            const centerX = w / 2, centerY = h / 2, radius = 60;

            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); ctx.stroke();
            ctx.setLineDash([]);

            const angle = p * Math.PI * 4;
            const bx = centerX + radius * Math.cos(angle);
            const by = centerY + radius * Math.sin(angle);

            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(bx, by); ctx.stroke();

            ctx.fillStyle = '#8b5cf6';
            ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI * 2); ctx.fill();
        }
    }

    /* =========================================================
       SUBMIT & FEEDBACK EVALUASI
       ========================================================= */
    function showFeedback(type, message) {
        const fb = document.getElementById('feedback');
        fb.className = `feedback ${type}`;
        fb.innerHTML = message;
        fb.style.display = 'block';
    }

    function submitAnalysis() {
        const t = translations[currentLang];
        const isEn = currentLang === 'en';

        if (currentMainMod === 0) { // Mode 1: Perhitungan
            const val1 = parseFloat(document.getElementById('mod-val-1').value);
            const val2 = parseFloat(document.getElementById('mod-val-2').value);
            if (isNaN(val1) || isNaN(val2)) { showFeedback('error', t.errFillFields); return; }

            if (currentSubCalcCase === 0) {
                const expectedA = currentRawData.F / currentRawData.m;
                const expectedN = currentRawData.m * G;

                if (Math.abs(val1 - expectedA) < 0.2 && Math.abs(val2 - expectedN) < 0.2) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Acceleration a:' : 'Percepatan a:'} <b>${expectedA.toFixed(2)} m/s²</b><br>• ${isEn ? 'Normal Force N:' : 'Gaya Normal N:'} <b>${expectedN.toFixed(1)} N</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be a:' : 'Seharusnya a:'} <b>${expectedA.toFixed(2)} m/s²</b><br>• ${isEn ? 'Should be N:' : 'Seharusnya N:'} <b>${expectedN.toFixed(1)} N</b>`);
                }

            } else if (currentSubCalcCase === 1) {
                const { m, F, uk } = currentRawData;
                const expectedFk = m * G * uk;
                const expectedA = (F - expectedFk) / m;

                if (Math.abs(val1 - expectedFk) < 0.2 && Math.abs(val2 - expectedA) < 0.2) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Friction Force fₖ:' : 'Gaya Gesek fₖ:'} <b>${expectedFk.toFixed(2)} N</b><br>• ${isEn ? 'Acceleration a:' : 'Percepatan a:'} <b>${expectedA.toFixed(2)} m/s²</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be fₖ:' : 'Seharusnya fₖ:'} <b>${expectedFk.toFixed(2)} N</b><br>• ${isEn ? 'Should be a:' : 'Seharusnya a:'} <b>${expectedA.toFixed(2)} m/s²</b>`);
                }

            } else if (currentSubCalcCase === 2) {
                const rad = (currentRawData.theta * Math.PI) / 180;
                const expectedFx = currentRawData.m * G * Math.sin(rad);
                const expectedA = G * Math.sin(rad);

                if (Math.abs(val1 - expectedFx) < 0.3 && Math.abs(val2 - expectedA) < 0.2) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Force Fₓ:' : 'Gaya Fₓ:'} <b>${expectedFx.toFixed(2)} N</b><br>• ${isEn ? 'Acceleration a:' : 'Percepatan a:'} <b>${expectedA.toFixed(2)} m/s²</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be Fₓ:' : 'Seharusnya Fₓ:'} <b>${expectedFx.toFixed(2)} N</b><br>• ${isEn ? 'Should be a:' : 'Seharusnya a:'} <b>${expectedA.toFixed(2)} m/s²</b>`);
                }

            } else if (currentSubCalcCase === 3) {
                const { m1, m2 } = currentRawData;
                const expectedA = ((m2 - m1) * G) / (m1 + m2);
                const expectedT = (2 * m1 * m2 * G) / (m1 + m2);

                if (Math.abs(val1 - expectedA) < 0.2 && Math.abs(val2 - expectedT) < 0.3) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Acceleration a:' : 'Percepatan a:'} <b>${expectedA.toFixed(2)} m/s²</b><br>• ${isEn ? 'Tension T:' : 'Tegangan Tali T:'} <b>${expectedT.toFixed(2)} N</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be a:' : 'Seharusnya a:'} <b>${expectedA.toFixed(2)} m/s²</b><br>• ${isEn ? 'Should be T:' : 'Seharusnya T:'} <b>${expectedT.toFixed(2)} N</b>`);
                }

            } else if (currentSubCalcCase === 4) {
                const { m, r, v } = currentRawData;
                const expectedAs = Math.pow(v, 2) / r;
                const expectedFs = m * expectedAs;

                if (Math.abs(val1 - expectedAs) < 0.2 && Math.abs(val2 - expectedFs) < 0.3) {
                    showFeedback('success', `${t.evalSuccess}<br>• ${isEn ? 'Centripetal Acceleration a⛤:' : 'Percepatan a⛤:'} <b>${expectedAs.toFixed(2)} m/s²</b><br>• ${isEn ? 'Centripetal Force F⛤:' : 'Gaya Sentripetal F⛤:'} <b>${expectedFs.toFixed(2)} N</b>`);
                } else {
                    showFeedback('warning', `${t.evalFailCalc}<br>• ${isEn ? 'Should be a⛤:' : 'Seharusnya a⛤:'} <b>${expectedAs.toFixed(2)} m/s²</b><br>• ${isEn ? 'Should be F⛤:' : 'Seharusnya F⛤:'} <b>${expectedFs.toFixed(2)} N</b>`);
                }
            }

        } else if (currentMainMod === 1) { // Mode 2: Pemahaman Konsep
            const a1 = document.getElementById('concept-ans-1').value;
            const a2 = document.getElementById('concept-ans-2').value;

            if (a1 === "" || a2 === "") {
                showFeedback('error', t.errFillFields);
                return;
            }

            const cases = newtonConceptCasesData[currentLang];
            const c = cases[currentConceptIndex];
            const isCorrect1 = parseInt(a1) === c.ans1;
            const isCorrect2 = parseInt(a2) === c.ans2;

            if (isCorrect1 && isCorrect2) {
                showFeedback('success', `${t.evalSuccessConcept}<br>${c.diffExplanation}`);
            } else {
                showFeedback('warning', `${t.evalFailConcept}<br>• ${t.conceptUI.q1Label} <b>${c.options1[c.ans1]}</b><br>• ${t.conceptUI.q2Label} <b>${c.options2[c.ans2]}</b><br><br>${c.diffExplanation}`);
            }

        } else if (currentMainMod === 2) { // Mode 3: FBD Evaluation
            if (userFbdVectors.length === 0) {
                showFeedback('error', t.errFbdNoVector);
                return;
            }

            const cases = fbdCasesData[currentLang];
            const c = cases[currentFbdIndex];
            let score = 0;
            let totalReq = c.requiredVectors.length;

            c.requiredVectors.forEach(req => {
                const match = userFbdVectors.some(uv => {
                    const angleDiff = Math.abs(uv.angle - req.angle);
                    return angleDiff < 35 || Math.abs(angleDiff - 360) < 35;
                });
                if (match) score++;
            });

            if (score === totalReq) {
                showFeedback('success', t.evalSuccessFbd);
            } else {
                const promptText = isEn 
                    ? `⚠️ <b>Incomplete or Incorrect Free-Body Diagram.</b><br>Score Detected: <b>${score} of ${totalReq} required forces</b>.<br>Ensure you draw the following forces in correct directions:<br>`
                    : `⚠️ <b>Diagram Gaya Belum Lengkap/Tepat.</b><br>Skor Terdeteksi: <b>${score} dari ${totalReq} gaya utama</b>.<br>Pastikan Anda menggambar gaya berikut dengan arah yang benar:<br>`;
                showFeedback('warning', promptText + c.requiredVectors.map(r => `• ${r.name}`).join('<br>'));
            }
        }
    }
</script>
