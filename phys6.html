<body>

<div class="container">
    <header>
        <div>
            <h1 id="app-title">TOPİK 6: IMPULS, MOMENTUM & DINAMIKA ROTASI</h1>
            <div class="subtitle" id="app-subtitle">Laboratorium Simulasi & Verifikasi Kalkulasi Interaktif</div>
        </div>
        <div class="header-actions">
            <button class="btn-nav" onclick="toggleLang()" id="btn-lang"><i class="fa-solid fa-language"></i> EN</button>
            <button class="btn-nav" onclick="toggleTheme()" id="btn-theme"><i class="fa-solid fa-moon"></i> Theme</button>
        </div>
    </header>

    <!-- Submodule Navigation -->
    <div class="module-selector-container">
        <div class="module-selector-label" id="mod-nav-label">
            <i class="fa-solid fa-layer-group"></i> Pilih Sub-Modul Eksperimen
        </div>
        <div class="module-grid" id="module-nav"></div>
    </div>

    <!-- Lab Main Layout -->
    <div class="lab-grid">
        <!-- Left: Visual & Sensor Panel -->
        <div class="instrument-panel">
            <div class="instrument-header">
                <div class="instrument-icon" id="inst-icon">🚀</div>
                <div class="instrument-title" id="inst-name">Panel Telemetri Datamu</div>
            </div>

            <div class="sensor-display" id="sensor-display">Memuat data sensor...</div>

            <canvas id="sim-canvas" width="420" height="210"></canvas>

            <div class="canvas-controls">
                <button class="btn-sub" onclick="startSim()" id="btn-start"><i class="fa-solid fa-play"></i> Mulai Sim</button>
                <button class="btn-sub" onclick="resetSim()" id="btn-reset"><i class="fa-solid fa-rotate-left"></i> Reset</button>
            </div>

            <button class="btn-action" style="background: var(--bg); color: var(--text-main); border: 1px solid var(--card-border); margin-top: 12px; padding: 9px;" onclick="generateRandomData()" id="btn-new-sample">
                <i class="fa-solid fa-shuffle"></i> acak Nilai Parametrik
            </button>
        </div>

        <!-- Right: Tasks & Verification Panel -->
        <div>
            <div class="task-card">
                <h4 id="task-title">Judul Modul</h4>
                <p id="task-desc">Petunjuk tugas instruksional akan ditampilkan di sini.</p>
                <div class="formula-box" id="formula-box">Rumus dasar: -</div>
            </div>

            <div id="dynamic-inputs"></div>

            <button class="btn-action" id="btn-submit" onclick="verifyCalculation()"><i class="fa-solid fa-check-circle"></i> Verifikasi Hasil Kalkulasi</button>
            
            <div id="feedback" class="feedback"></div>
        </div>
    </div>
</div>

<script>
    // System State
    let currentLang = 'id';
    let currentTheme = 'light';
    let currentModule = 0;
    let animFrame = null;
    let animState = { running: false, t: 0, x1: 0, x2: 0, v1: 0, v2: 0, angle: 0, y: 0, vy: 0 };

    // Dataset & Modules Definition
    const modules = [
        {
            id: 'impulse',
            icon: '⚡',
            title: { id: '1. Impuls & Perubahan Momentum', en: '1. Impulse & Momentum Change' },
            desc: {
                id: 'Hitung Impuls ($J$) dan Gaya Rata-rata ($F$) yang bekerja pada benda bermassa $m$ akibat perubahan kecepatan.',
                en: 'Calculate Impulse ($J$) and Average Force ($F$) acting on mass $m$ during velocity change.'
            },
            formula: 'J = Δp = m(v₂ - v₁) | F = J / Δt',
            generate: () => ({
                m: +(Math.random() * 4 + 0.5).toFixed(2), // kg
                v1: +(Math.random() * 10 - 5).toFixed(1),  // m/s
                v2: +(Math.random() * 15 + 2).toFixed(1),  // m/s
                dt: +(Math.random() * 0.1 + 0.02).toFixed(3) // s
            }),
            formatSensor: (d, l) => l === 'id' ?
                `[TELEMETRI IMPULS]\nMassa Benda (m)   = ${d.m} kg\nKecepatan Awal (v1) = ${d.v1} m/s\nKecepatan Akhir (v2)= ${d.v2} m/s\nDurasi Kontak (Δt)  = ${d.dt} s` :
                `[IMPULSE TELEMETRY]\nObject Mass (m)      = ${d.m} kg\nInitial Velocity (v1)= ${d.v1} m/s\nFinal Velocity (v2)  = ${d.v2} m/s\nContact Duration (Δt)= ${d.dt} s`,
            inputs: [
                { id: 'val_J', label: { id: 'Impuls J (N·s atau kg·m/s):', en: 'Impulse J (N·s or kg·m/s):' } },
                { id: 'val_F', label: { id: 'Gaya Rata-rata Impulsif F (N):', en: 'Average Impulsive Force F (N):' } }
            ],
            solve: (d) => {
                const J = d.m * (d.v2 - d.v1);
                const F = J / d.dt;
                return { val_J: J, val_F: F };
            }
        },
        {
            id: 'elastic',
            icon: '💥',
            title: { id: '2. Tumbukan Lenting Sempurna', en: '2. Perfectly Elastic Collision' },
            desc: {
                id: 'Hitung kecepatan akhir dua benda ($v_1\'$ dan $v_2\'$) setelah mengalami tumbukan lenting sempurna ($e = 1$).',
                en: 'Calculate final velocities ($v_1\'$ & $v_2\'$) after a 1D elastic collision ($e = 1$).'
            },
            formula: "m₁v₁ + m₂v₂ = m₁v₁' + m₂v₂' | e = -(v₂' - v₁')/(v₂ - v₁) = 1",
            generate: () => ({
                m1: +(Math.random() * 3 + 1).toFixed(1),
                v1: +(Math.random() * 6 + 2).toFixed(1),
                m2: +(Math.random() * 3 + 1).toFixed(1),
                v2: +(-Math.random() * 4 - 1).toFixed(1)
            }),
            formatSensor: (d, l) => l === 'id' ?
                `[TUMBUKAN LENTING SEMPURNA (e = 1.0)]\nMassa 1 (m1) = ${d.m1} kg | Vel 1 (v1) = ${d.v1} m/s\nMassa 2 (m2) = ${d.m2} kg | Vel 2 (v2) = ${d.v2} m/s` :
                `[PERFECTLY ELASTIC COLLISION (e = 1.0)]\nMass 1 (m1)  = ${d.m1} kg | Vel 1 (v1) = ${d.v1} m/s\nMass 2 (m2)  = ${d.m2} kg | Vel 2 (v2) = ${d.v2} m/s`,
            inputs: [
                { id: 'val_v1_prime', label: { id: 'Kecepatan Akhir v1\' (m/s):', en: 'Final Velocity v1\' (m/s):' } },
                { id: 'val_v2_prime', label: { id: 'Kecepatan Akhir v2\' (m/s):', en: 'Final Velocity v2\' (m/s):' } }
            ],
            solve: (d) => {
                const m1 = d.m1, m2 = d.m2, v1 = d.v1, v2 = d.v2;
                const v1_prime = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
                const v2_prime = ((m2 - m1) * v2 + 2 * m1 * v1) / (m1 + m2);
                return { val_v1_prime: v1_prime, val_v2_prime: v2_prime };
            }
        },
        {
            id: 'inelastic',
            icon: '🧲',
            title: { id: '3. Tumbukan Tidak Lenting Sama Sekali', en: '3. Perfectly Inelastic Collision' },
            desc: {
                id: 'Dua benda menyatu setelah tumbukan ($e = 0$). Hitung kecepatan gabungan ($v_f$) & Energi Kinetik yang hilang ($\Delta EK$).',
                en: 'Two masses stick together ($e = 0$). Calculate combined velocity ($v_f$) & Lost Kinetic Energy ($\Delta EK$).'
            },
            formula: 'v_f = (m₁v₁ + m₂v₂) / (m₁ + m₂) | ΔEK = EK_awal - EK_akhir',
            generate: () => ({
                m1: +(Math.random() * 4 + 1).toFixed(1),
                v1: +(Math.random() * 8 + 2).toFixed(1),
                m2: +(Math.random() * 4 + 1).toFixed(1),
                v2: +(-Math.random() * 4).toFixed(1)
            }),
            formatSensor: (d, l) => l === 'id' ?
                `[TUMBUKAN TIDAK LENTING (e = 0)]\nMassa 1 (m1) = ${d.m1} kg | Vel 1 (v1) = ${d.v1} m/s\nMassa 2 (m2) = ${d.m2} kg | Vel 2 (v2) = ${d.v2} m/s` :
                `[PERFECTLY INELASTIC (e = 0)]\nMass 1 (m1)  = ${d.m1} kg | Vel 1 (v1) = ${d.v1} m/s\nMass 2 (m2)  = ${d.m2} kg | Vel 2 (v2) = ${d.v2} m/s`,
            inputs: [
                { id: 'val_vf', label: { id: 'Kecepatan Bersama vf (m/s):', en: 'Combined Velocity vf (m/s):' } },
                { id: 'val_dEK', label: { id: 'Energi Kinetik Hilang ΔEK (Joule):', en: 'Lost Kinetic Energy ΔEK (Joules):' } }
            ],
            solve: (d) => {
                const vf = (d.m1 * d.v1 + d.m2 * d.v2) / (d.m1 + d.m2);
                const ek1 = 0.5 * d.m1 * d.v1 * d.v1 + 0.5 * d.m2 * d.v2 * d.v2;
                const ek2 = 0.5 * (d.m1 + d.m2) * vf * vf;
                return { val_vf: vf, val_dEK: ek1 - ek2 };
            }
        },
        {
            id: 'restitution',
            icon: '🏀',
            title: { id: '4. Koefisien Restitusi Bola Memantul', en: '4. Restitution Coefficient Bounce' },
            desc: {
                id: 'Hitung koefisien restitusi ($e$) dan tinggi pantulan kedua ($h_2$) saat bola dijatuhkan dari tinggi $h_0$ ke $h_1$.',
                en: 'Calculate restitution coefficient ($e$) and 2nd rebound height ($h_2$) for a ball dropped from $h_0$ to $h_1$.'
            },
            formula: 'e = √(h₁ / h₀) = √(h₂ / h₁)',
            generate: () => ({
                h0: +(Math.random() * 5 + 4).toFixed(2), // m
                h1: +(Math.random() * 2 + 1.5).toFixed(2)  // m
            }),
            formatSensor: (d, l) => l === 'id' ?
                `[UJI PANTULAN BOLA]\nTinggi Awal Jatuh (h0) = ${d.h0} m\nTinggi Pantulan 1 (h1) = ${d.h1} m` :
                `[BALL REBOUND TEST]\nInitial Drop Height (h0) = ${d.h0} m\nRebound Height 1 (h1)   = ${d.h1} m`,
            inputs: [
                { id: 'val_e', label: { id: 'Koefisien Restitusi e:', en: 'Restitution Coefficient e:' } },
                { id: 'val_h2', label: { id: 'Tinggi Pantulan Kedua h2 (m):', en: 'Second Rebound Height h2 (m):' } }
            ],
            solve: (d) => {
                const e = Math.sqrt(d.h1 / d.h0);
                const h2 = d.h1 * e * e;
                return { val_e: e, val_h2: h2 };
            }
        },
        {
            id: 'torque',
            icon: '🔧',
            title: { id: '5. Torsi & Momen Inersia', en: '5. Torque & Moment of Inertia' },
            desc: {
                id: 'Hitung Torsi ($\\tau = F \\cdot r \\cdot \\sin\\theta$) dan Momen Inersia ($I$) Silinder Pejal ($I = \\frac{1}{2} M R^2$).',
                en: 'Calculate Torque ($\\tau = F \\cdot r \\cdot \\sin\\theta$) and Solid Cylinder Inertia ($I = \\frac{1}{2} M R^2$).'
            },
            formula: 'τ = F · r · sin(θ) | I_silinder = 1/2 · M · R²',
            generate: () => ({
                F: +(Math.random() * 50 + 10).toFixed(1), // N
                r: +(Math.random() * 1.5 + 0.2).toFixed(2), // m
                angleDeg: [30, 45, 60, 90][Math.floor(Math.random() * 4)],
                M: +(Math.random() * 8 + 2).toFixed(1), // kg
                R: +(Math.random() * 0.8 + 0.2).toFixed(2) // m
            }),
            formatSensor: (d, l) => l === 'id' ?
                `[DATA DYNAMO TORSI]\nGaya (F) = ${d.F} N | Lengan Momen (r) = ${d.r} m | Sudut (θ) = ${d.angleDeg}°\nMassa Silinder (M) = ${d.M} kg | Jari-jari Silinder (R) = ${d.R} m` :
                `[TORQUE DYNAMO DATA]\nForce (F) = ${d.F} N | Arm (r) = ${d.r} m | Angle (θ) = ${d.angleDeg}°\nCylinder Mass (M) = ${d.M} kg | Radius (R) = ${d.R} m`,
            inputs: [
                { id: 'val_torque', label: { id: 'Torsi τ (N·m):', en: 'Torque τ (N·m):' } },
                { id: 'val_inertia', label: { id: 'Momen Inersia I (kg·m²):', en: 'Moment of Inertia I (kg·m²):' } }
            ],
            solve: (d) => {
                const rad = d.angleDeg * Math.PI / 180;
                const tau = d.F * d.r * Math.sin(rad);
                const I = 0.5 * d.M * d.R * d.R;
                return { val_torque: tau, val_inertia: I };
            }
        },
        {
            id: 'rotation',
            icon: '🎡',
            title: { id: '6. Dinamika & Kinematika Rotasi', en: '6. Rotational Dynamics & Kinematics' },
            desc: {
                id: 'Hitung Percepatan Sudut ($\\alpha = \\tau / I$), Kecepatan Sudut ($\\omega$), dan Posisi Sudut ($\\theta$) pada detik $t$.',
                en: 'Calculate Angular Acceleration ($\\alpha = \\tau / I$), Angular Velocity ($\\omega$), and Angle ($\\theta$) at time $t$.'
            },
            formula: 'α = τ / I | ω = α · t | θ = 1/2 · α · t²',
            generate: () => ({
                tau: +(Math.random() * 20 + 5).toFixed(2), // N m
                I: +(Math.random() * 4 + 0.5).toFixed(2),  // kg m^2
                t: +(Math.random() * 5 + 2).toFixed(1)     // s
            }),
            formatSensor: (d, l) => l === 'id' ?
                `[ROTATIONAL KINETICS]\nTorsi Neto (τ) = ${d.tau} N·m\nMomen Inersia (I) = ${d.I} kg·m²\nWaktu Tempuh (t) = ${d.t} s` :
                `[ROTATIONAL KINETICS]\nNet Torque (τ) = ${d.tau} N·m\nInertia (I) = ${d.I} kg·m²\nTime (t) = ${d.t} s`,
            inputs: [
                { id: 'val_alpha', label: { id: 'Percepatan Sudut α (rad/s²):', en: 'Angular Acceleration α (rad/s²):' } },
                { id: 'val_omega', label: { id: 'Kecepatan Sudut ω (rad/s):', en: 'Angular Velocity ω (rad/s):' } },
                { id: 'val_theta', label: { id: 'Posisi Sudut θ (rad):', en: 'Angular Position θ (rad):' } }
            ],
            solve: (d) => {
                const alpha = d.tau / d.I;
                const omega = alpha * d.t;
                const theta = 0.5 * alpha * d.t * d.t;
                return { val_alpha: alpha, val_omega: omega, val_theta: theta };
            }
        }
    ];

    let activeData = {};

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
        renderModuleNav();
        loadModule(0);
    });

    function renderModuleNav() {
        const nav = document.getElementById('module-nav');
        nav.innerHTML = '';
        modules.forEach((m, idx) => {
            const card = document.createElement('div');
            card.className = `mod-card ${idx === currentModule ? 'active' : ''}`;
            card.onclick = () => loadModule(idx);
            card.innerHTML = `
                <div class="mod-card-icon">${m.icon}</div>
                <div class="mod-card-title">${m.title[currentLang]}</div>
            `;
            nav.appendChild(card);
        });
    }

    function loadModule(index) {
        currentModule = index;
        const m = modules[index];

        // Update Nav Active State
        renderModuleNav();

        // Update Text
        document.getElementById('inst-icon').innerText = m.icon;
        document.getElementById('task-title').innerText = m.title[currentLang];
        document.getElementById('task-desc').innerText = m.desc[currentLang];
        document.getElementById('formula-box').innerText = `${currentLang === 'id' ? 'Rumus Utama' : 'Core Formula'}: ${m.formula}`;

        // Hide Feedback
        const fb = document.getElementById('feedback');
        fb.style.display = 'none';

        // Generate Dataset
        generateRandomData();
    }

    function generateRandomData() {
        const m = modules[currentModule];
        activeData = m.generate();
        document.getElementById('sensor-display').innerText = m.formatSensor(activeData, currentLang);
        renderInputs(m.inputs);
        resetSim();
    }

    function renderInputs(inputs) {
        const container = document.getElementById('dynamic-inputs');
        container.innerHTML = '';
        inputs.forEach(inp => {
            const grp = document.createElement('div');
            grp.className = 'control-group';
            grp.innerHTML = `
                <label for="${inp.id}">${inp.label[currentLang]}</label>
                <input type="number" step="any" id="${inp.id}" placeholder="0.00">
            `;
            container.appendChild(grp);
        });
    }

    function verifyCalculation() {
        const m = modules[currentModule];
        const answers = m.solve(activeData);
        let allCorrect = true;
        let details = [];

        m.inputs.forEach(inp => {
            const userVal = parseFloat(document.getElementById(inp.id).value);
            const expected = answers[inp.id];
            
            if (isNaN(userVal)) {
                allCorrect = false;
                details.push(`• ${inp.label[currentLang]} ${currentLang === 'id' ? 'belum diisi!' : 'is empty!'}`);
            } else {
                const margin = Math.abs(expected * 0.03) + 0.01; // 3% tolerance
                const diff = Math.abs(userVal - expected);
                if (diff <= margin) {
                    details.push(`✅ ${inp.label[currentLang]} ${currentLang === 'id' ? 'Tepat' : 'Correct'} (${userVal.toFixed(2)})`);
                } else {
                    allCorrect = false;
                    details.push(`❌ ${inp.label[currentLang]} ${currentLang === 'id' ? 'Salah' : 'Incorrect'}. ${currentLang === 'id' ? 'Harusnya' : 'Expected'}: ~${expected.toFixed(2)}`);
                }
            }
        });

        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        if (allCorrect) {
            fb.className = 'feedback success';
            fb.innerHTML = `<strong>🎉 ${currentLang === 'id' ? 'Analisis Sempurna!' : 'Perfect Analysis!'}</strong><br>${details.join('<br>')}`;
        } else {
            fb.className = 'feedback error';
            fb.innerHTML = `<strong>⚠️ ${currentLang === 'id' ? 'Periksa Kembali Kalkulasi' : 'Check Calculation'}</strong><br>${details.join('<br>')}`;
        }
    }

    // Toggle Functions
    function toggleLang() {
        currentLang = currentLang === 'id' ? 'en' : 'id';
        document.getElementById('btn-lang').innerHTML = `<i class="fa-solid fa-language"></i> ${currentLang.toUpperCase()}`;
        document.getElementById('app-title').innerText = currentLang === 'id' ? 'TOPIK 6: IMPULS, MOMENTUM & DINAMIKA ROTASI' : 'TOPIC 6: IMPULSE, MOMENTUM & ROTATIONAL DYNAMICS';
        document.getElementById('app-subtitle').innerText = currentLang === 'id' ? 'Laboratorium Simulasi & Verifikasi Kalkulasi Interaktif' : 'Interactive Physics Simulation & Calculation Verification';
        document.getElementById('mod-nav-label').innerHTML = `<i class="fa-solid fa-layer-group"></i> ${currentLang === 'id' ? 'Pilih Sub-Modul Eksperimen' : 'Select Sub-Module Experiment'}`;
        document.getElementById('inst-name').innerText = currentLang === 'id' ? 'Panel Telemetri Datamu' : 'Telemetry Data Panel';
        document.getElementById('btn-new-sample').innerHTML = `<i class="fa-solid fa-shuffle"></i> ${currentLang === 'id' ? 'Acak Nilai Parametrik' : 'Randomize Parameters'}`;
        document.getElementById('btn-submit').innerHTML = `<i class="fa-solid fa-check-circle"></i> ${currentLang === 'id' ? 'Verifikasi Hasil Kalkulasi' : 'Verify Calculation'}`;
        document.getElementById('btn-start').innerHTML = `<i class="fa-solid fa-play"></i> ${currentLang === 'id' ? 'Mulai Sim' : 'Start Sim'}`;
        document.getElementById('btn-reset').innerHTML = `<i class="fa-solid fa-rotate-left"></i> Reset`;
        
        loadModule(currentModule);
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('btn-theme').innerHTML = `<i class="fa-solid fa-${currentTheme === 'light' ? 'moon' : 'sun'}"></i> Theme`;
        drawCanvas();
    }

    // Canvas Simulation System
    function resetSim() {
        if (animFrame) cancelAnimationFrame(animFrame);
        animState.running = false;
        animState.t = 0;

        if (currentModule === 0) { // Impulse
            animState.x1 = 40;
            animState.v1 = activeData.v1;
        } else if (currentModule === 1 || currentModule === 2) { // Elastic / Inelastic
            animState.x1 = 60;
            animState.x2 = 300;
            animState.v1 = activeData.v1;
            animState.v2 = activeData.v2;
        } else if (currentModule === 3) { // Restitution
            animState.y = 20;
            animState.vy = 0;
        } else if (currentModule === 4 || currentModule === 5) { // Torque / Rotation
            animState.angle = 0;
        }

        drawCanvas();
    }

    function startSim() {
        if (!animState.running) {
            animState.running = true;
            animate();
        }
    }

    function animate() {
        if (!animState.running) return;
        animState.t += 0.03;

        const cvs = document.getElementById('sim-canvas');
        
        if (currentModule === 0) { // Impulse
            animState.x1 += animState.v1 * 1.5;
            if (animState.x1 > cvs.width - 40 || animState.x1 < 20) {
                animState.v1 = activeData.v2 * (animState.v1 > 0 ? -1 : 1);
            }
        } else if (currentModule === 1) { // Elastic Collision
            animState.x1 += animState.v1 * 0.8;
            animState.x2 += animState.v2 * 0.8;
            if (Math.abs(animState.x1 - animState.x2) < 40) {
                const sol = modules[1].solve(activeData);
                animState.v1 = sol.val_v1_prime;
                animState.v2 = sol.val_v2_prime;
            }
        } else if (currentModule === 2) { // Inelastic Collision
            if (Math.abs(animState.x1 - animState.x2) < 40) {
                const sol = modules[2].solve(activeData);
                animState.v1 = sol.val_vf;
                animState.v2 = sol.val_vf;
            }
            animState.x1 += animState.v1 * 0.8;
            animState.x2 += animState.v2 * 0.8;
        } else if (currentModule === 3) { // Restitution drop
            animState.vy += 0.4;
            animState.y += animState.vy;
            if (animState.y > 170) {
                animState.y = 170;
                const sol = modules[3].solve(activeData);
                animState.vy = -Math.sqrt(2 * 0.4 * (sol.val_h2 * 20)); // scale rebound
            }
        } else if (currentModule === 4 || currentModule === 5) { // Torque & Rotation
            const sol = modules[currentModule].solve(activeData);
            const alpha = currentModule === 4 ? (sol.val_torque / sol.val_inertia) : sol.val_alpha;
            animState.angle += 0.5 * alpha * Math.pow(animState.t, 2) * 0.05;
        }

        drawCanvas();
        animFrame = requestAnimationFrame(animate);
    }

    function drawCanvas() {
        const cvs = document.getElementById('sim-canvas');
        const ctx = cvs.getContext('2d');
        const isDark = currentTheme === 'dark';

        ctx.clearRect(0, 0, cvs.width, cvs.height);

        // Ground/Background Grid
        ctx.strokeStyle = isDark ? '#334155' : '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 180); ctx.lineTo(cvs.width, 180);
        ctx.stroke();

        if (currentModule === 0) { // Impulse Box
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(animState.x1, 140, 40, 40);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('m', animState.x1 + 14, 164);
        } else if (currentModule === 1 || currentModule === 2) { // Collisions
            // Object 1
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(animState.x1, 140, 40, 40);
            ctx.fillStyle = '#fff';
            ctx.fillText('m1', animState.x1 + 10, 164);

            // Object 2
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(animState.x2, 140, 40, 40);
            ctx.fillStyle = '#fff';
            ctx.fillText('m2', animState.x2 + 10, 164);
        } else if (currentModule === 3) { // Bouncing Ball
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(cvs.width / 2, animState.y, 16, 0, Math.PI * 2);
            ctx.fill();
        } else if (currentModule === 4 || currentModule === 5) { // Rotating Wheel
            const cx = cvs.width / 2;
            const cy = 100;
            const r = 60;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(animState.angle);

            // Outer Wheel
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.stroke();

            // Spokes
            ctx.strokeStyle = isDark ? '#94a3b8' : '#64748b';
            ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(r * Math.cos(i * Math.PI / 2), r * Math.sin(i * Math.PI / 2));
                ctx.stroke();
            }

            ctx.restore();

            // Center Pin
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }
</script>
