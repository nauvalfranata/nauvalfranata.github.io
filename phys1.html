<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Virtual Lab: Besaran, Satuan, dan Pengukuran - Untirta</title>
    <style>
        /* Light Theme Default Variables */
        :root[data-theme="light"] {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --panel-border: #e2e8f0;
            --accent-color: #0284c7;
            --accent-light: #e0f2fe;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --sensor-bg: #1e293b;
            --sensor-text: #38bdf8;
            --sensor-border: #0f172a;
            --nav-btn-bg: #f1f5f9;
            --nav-btn-border: #cbd5e1;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --success-bg: #dcfce7;
            --success-color: #16a34a;
            --success-border: #86efac;
            --warning-bg: #fef3c7;
            --warning-color: #d97706;
            --warning-border: #fcd34d;
            --error-bg: #fee2e2;
            --error-color: #dc2626;
            --error-border: #fca5a5;
            --toggle-bg: #e2e8f0;
            --toggle-text: #0f172a;
        }

        /* Dark Theme Variables */
        :root[data-theme="dark"] {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent-color: #38bdf8;
            --accent-light: rgba(56, 189, 248, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --sensor-bg: #022c22;
            --sensor-text: #4ade80;
            --sensor-border: #065f46;
            --nav-btn-bg: #0f172a;
            --nav-btn-border: #334155;
            --input-bg: #0f172a;
            --input-border: #475569;
            --success-bg: rgba(34, 197, 94, 0.15);
            --success-color: #4ade80;
            --success-border: #22c55e;
            --warning-bg: rgba(245, 158, 11, 0.15);
            --warning-color: #fbbf24;
            --warning-border: #f59e0b;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-color: #f87171;
            --error-border: #ef4444;
            --toggle-bg: #334155;
            --toggle-text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--panel-border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        header {
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 1.6rem; color: var(--accent-color); }
        .subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-top: 4px; font-weight: 500; }
        .univ-tag { color: var(--text-secondary); font-size: 0.85rem; font-style: italic; }

        /* Control Toggle Buttons */
        .toggle-btn {
            background: var(--toggle-bg);
            color: var(--toggle-text);
            border: 1px solid var(--nav-btn-border);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        /* Navigation Modules */
        .module-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--panel-border);
        }

        .mod-btn {
            background: var(--nav-btn-bg);
            color: var(--text-secondary);
            border: 1px solid var(--nav-btn-border);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .mod-btn:hover { background: var(--accent-light); color: var(--accent-color); }
        .mod-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        .lab-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .lab-grid { grid-template-columns: 1fr; }
        }

        .instrument-panel {
            background: var(--bg-color);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .sensor-display {
            background: var(--sensor-bg);
            color: var(--sensor-text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid var(--sensor-border);
            margin: 15px 0;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            word-break: break-all;
        }

        .instrument-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .task-card {
            background: var(--accent-light);
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .task-card h4 { margin: 0 0 8px 0; color: var(--text-primary); }
        .task-card p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4; }

        .symbol-legend {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--accent-color);
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .symbol-legend ul {
            margin: 5px 0 0 0;
            padding-left: 18px;
        }

        .control-group {
            width: 100%;
            margin-bottom: 12px;
        }

        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-secondary); font-weight: 600; }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action {
            width: 100%;
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .btn-action:hover { opacity: 0.9; }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            display: none;
            line-height: 1.4;
        }

        .feedback.success { background: var(--success-bg); color: var(--success-color); border: 1px solid var(--success-border); }
        .feedback.warning { background: var(--warning-bg); color: var(--warning-color); border: 1px solid var(--warning-border); }
        .feedback.error { background: var(--error-bg); color: var(--error-color); border: 1px solid var(--error-border); }
    </style>
</head>
<body>

            <button class="toggle-btn" id="lang-toggle-btn" onclick="toggleLang()">

        <div class="instrument-panel">

            <div class="sensor-display" id="sensor-display">0.00</div>
            <button class="btn-action" style="background: var(--nav-btn-bg); color: var(--text-primary); border: 1px solid var(--nav-btn-border); padding: 8px;" onclick="generateNewData()" id="btn-new-sample">
                🔄 Dapatkan Sampel / Soal Baru
            </button>
        </div>

        <!-- Student Analysis Input Panel -->
        <div>
            <div class="task-card">
                <h4 id="task-title">Judul Modul</h4>
                <p id="task-desc">Deskripsi tugas akan muncul di sini.</p>
                <div id="symbol-legend-box" class="symbol-legend" style="display: none;"></div>

            <!-- Dynamic Input Container -->
            <div id="dynamic-inputs"></div>

            <button class="btn-action" onclick="submitAnalysis()" id="btn-submit">Kirim Data Analisis</button>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>
</div>

    let currentLang = 'id';

    // Theme & Lang Initialization
    function initSettings() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        const savedLang = localStorage.getItem('lang') || 'id';

        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('lang', savedLang);
        
        currentLang = savedLang;
        updateUIStaticText();
        updateToggleBtnUI(savedTheme);
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateToggleBtnUI(newTheme);
    }

    function toggleLang() {
        currentLang = currentLang === 'id' ? 'en' : 'id';
        localStorage.setItem('lang', currentLang);
        document.documentElement.setAttribute('lang', currentLang);
        updateUIStaticText();
        initNav();
        generateNewData();
    }

    function updateToggleBtnUI(theme) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        const t = translations[currentLang];
        if (theme === 'dark') {
            icon.innerText = '☀️';
            text.innerText = t.themeLight;
        } else {
            icon.innerText = '🌙';
            text.innerText = t.themeDark;
        }
    }

    function updateUIStaticText() {
        const t = translations[currentLang];
        document.getElementById('page-title').innerText = t.pageTitle;
        document.getElementById('header-title').innerText = t.headerTitle;
        document.getElementById('header-lecturer').innerText = t.lecturer;
        document.getElementById('home-link').innerText = t.home;
        document.getElementById('lang-text').innerText = currentLang === 'id' ? 'EN' : 'ID';
        document.getElementById('btn-new-sample').innerText = t.btnNewSample;
        document.getElementById('btn-submit').innerText = t.btnSubmit;
        
        const currentTheme = document.documentElement.getAttribute('data-theme');
        updateToggleBtnUI(currentTheme);
    }

            instrument: { id: 'Generator Notasi Ilmiah', en: 'Scientific Notation Generator' },
            type: 'exponential',
            generate: () => {
                const isVeryLarge = Math.random() > 0.5;

                    num = (Math.random() * 8.9 + 1) * Math.pow(10, exp);
                } else {
                    exp = -(Math.floor(Math.random() * 6) + 1);
                    num = (Math.random() * 8.9 + 1) * Math.pow(10, exp);
                }
                return { val: num, display: num.toLocaleString('fullwide', { useGrouping: false, maximumFractionDigits: 8 }) };

        },
        {

                        dimConsistent: true,

                            en: ['<b>S</b> = Displacement / Distance [m]', '<b>v</b> = Initial Velocity [m/s]', '<b>t</b> = Time [s]', '<b>a</b> = Acceleration [m/s²]']

                        reason: {
                            id: 'Dimensi ruas kiri [L] sama dengan suku-suku ruas kanan [L][T]⁻¹ · [T] + [L][T]⁻² · [T]² = [L].',
                            en: 'Left side dimension [L] matches Right side terms [L][T]⁻¹ · [T] + [L][T]⁻² · [T]² = [L].'
                        }
                    },
                    {

                        dimConsistent: false,
                        symbols: {
                            id: ['<b>F</b> = Gaya [N = kg·m/s²]', '<b>m</b> = Massa [kg]', '<b>v</b> = Kecepatan [m/s]'],
                            en: ['<b>F</b> = Force [N = kg·m/s²]', '<b>m</b> = Mass [kg]', '<b>v</b> = Velocity [m/s]']

                            en: 'Inconsistent! Left side Force has dimension [M][L][T]⁻², whereas right side m·v² has dimension [M][L]²[T]⁻² (Energy). Correct Force formula is F = m·a.'

                    },

                        symbols: {

                            en: 'Dimensionally consistent! Left side Power [M][L]²[T]⁻³ equals Right side Force × Velocity [M][L][T]⁻² · [L][T]⁻¹.'

                    },
                    { 
                        eq: 'Ek = m · g · h', 
                        dimConsistent: true,

                            en: ['<b>Ek</b> = Kinetic Energy [Joule]', '<b>m</b> = Mass [kg]', '<b>g</b> = Gravitational Acceleration [m/s²]', '<b>h</b> = Height [m]']

                        }
                    },
                    { 
                        eq: 'v² = u² + 2 · a · S', 
                        dimConsistent: true,
                        symbols: {
                            id: ['<b>v, u</b> = Kecepatan Akhir & Awal [m/s]', '<b>a</b> = Percepatan [m/s²]', '<b>S</b> = Jarak [m]'],
                            en: ['<b>v, u</b> = Final & Initial Velocity [m/s]', '<b>a</b> = Acceleration [m/s²]', '<b>S</b> = Distance [m]']
                        },
                        reason: {
                            id: 'Konsisten secara dimensi! Kuadrat kecepatan berdimensi [L]²[T]⁻².',

                        }
                    },
                    { 
                        eq: 'P = F / t', 
                        dimConsistent: false,
                        symbols: {
                            id: ['<b>P</b> = Daya [Watt]', '<b>F</b> = Gaya [N]', '<b>t</b> = Waktu [s]'],
                            en: ['<b>P</b> = Power [Watt]', '<b>F</b> = Force [N]', '<b>t</b> = Time [s]']
                        },
                        reason: {
                            id: 'Tidak konsisten! Ruas kiri Daya [M][L]²[T]⁻³, sedangkan F/t menghasilkan [M][L][T]⁻³.',

                ];
                return equations[Math.floor(Math.random() * equations.length)];
            }
        }
    ];

    let currentModIndex = 0;
    let currentRawData = {};
    let currentDisplayStr = '';
    let selectedQuantityKey = 'current';

    function initNav() {
        const nav = document.getElementById('module-nav');
        nav.innerHTML = '';
        const t = translations[currentLang];
        modules.forEach((mod, idx) => {
            const btn = document.createElement('button');
            btn.className = `mod-btn ${idx === currentModIndex ? 'active' : ''}`;
            btn.innerText = t.modules[idx];
            btn.onclick = () => switchModule(idx);
            nav.appendChild(btn);
        });
    }

    function switchModule(index) {
        currentModIndex = index;
        initNav();
        generateNewData();
    }

    function countSigFigs(str) {
        str = str.trim();
        if (!str || isNaN(Number(str))) return 0;
        if (str.includes('.')) {
            str = str.replace('.', '').replace(/^0+/, '');
            return str.length;
        }
        str = str.replace(/^0+/, '').replace(/0+$/, '');
        return str.length;
    }

    function generateNewData() {
        const mod = modules[currentModIndex];
        const t = translations[currentLang];
        document.getElementById('feedback').style.display = 'none';

        const legendBox = document.getElementById('symbol-legend-box');
        legendBox.style.display = 'none';

        const dynamicInputs = document.getElementById('dynamic-inputs');
        dynamicInputs.innerHTML = '';

        if (mod.type === 'base-quantities-module') {
            const qData = baseQuantities[selectedQuantityKey];
            
            const randomUnitObj = qData.units[Math.floor(Math.random() * qData.units.length)];
            let val = (Math.random() * 800 + 0.1);
            if (selectedQuantityKey === 'temp' && randomUnitObj.symbol === '°C') {
                val = Math.random() * 200 - 20;
            }
            
            const nonSiUnits = qData.units.filter(u => !u.isSI);
            const randomTargetUnitObj = nonSiUnits.length > 0 
                ? nonSiUnits[Math.floor(Math.random() * nonSiUnits.length)]
                : qData.units[0];

            currentRawData = {
                val: val,
                unit: randomUnitObj.symbol,
                qKey: selectedQuantityKey,
                targetRandomUnit: randomTargetUnitObj.symbol
            };

            let formattedVal = currentRawData.val.toPrecision(4);
            currentDisplayStr = formattedVal;

            document.getElementById('inst-icon').innerText = qData.icon;
            document.getElementById('inst-name').innerText = qData.instrument[currentLang];
            document.getElementById('sensor-display').innerText = `${formattedVal} ${currentRawData.unit}`;
            document.getElementById('task-title').innerText = t.mod1Title;
            document.getElementById('task-desc').innerText = t.mod1Desc;

            let qOptionsHtml = Object.keys(baseQuantities).map(k => 
                `<option value="${k}" ${k === selectedQuantityKey ? 'selected' : ''}>${baseQuantities[k].name[currentLang]}</option>`
            ).join('');

            let unitOptionsHtml = qData.units.map(u => 
                `<option value="${u.symbol}">${u.name}</option>`
            ).join('');

            const label3Text = t.mod1Label3.replace('{target}', currentRawData.targetRandomUnit);
            const placeholderRandom = t.mod1PlaceholderRandom.replace('{target}', currentRawData.targetRandomUnit);

            dynamicInputs.innerHTML = `
                <div class="control-group">
                    <label for="quantity-select">${t.mod1Label1}</label>
                    <select id="quantity-select" onchange="onQuantityChange(this.value)">
                        ${qOptionsHtml}
                    </select>
                </div>
                <div class="control-group">
                    <label>${t.mod1Label2}</label>
                    <div class="input-row">
                        <select id="si-unit-select" style="flex: 1;">
                            ${unitOptionsHtml}
                        </select>
                        <input type="number" id="si-val-input" step="any" placeholder="${t.mod1PlaceholderSI}" style="flex: 2;">
                    </div>
                </div>
                <div class="control-group">
                    <label>${label3Text}</label>
                    <input type="number" id="random-val-input" step="any" placeholder="${placeholderRandom}">
                </div>
                <div class="control-group">
                    <label for="sigfig-input">${t.mod1Label4}</label>
                    <input type="number" id="sigfig-input" placeholder="${t.mod1PlaceholderSigFig}">
                </div>
            `;
        } else {
            currentRawData = mod.generate();
            document.getElementById('inst-icon').innerText = mod.icon;
            document.getElementById('inst-name').innerText = mod.instrument[currentLang];

            if (mod.type === 'exponential') {
                document.getElementById('sensor-display').innerText = currentRawData.display;
                document.getElementById('task-title').innerText = t.mod2Title;
                document.getElementById('task-desc').innerText = t.mod2Desc;

                dynamicInputs.innerHTML = `
                    <div class="control-group">
                        <label>${t.mod2Label}</label>
                        <div class="input-row">
                            <input type="number" id="coef-input" step="any" placeholder="${t.mod2PlaceholderCoef}" style="flex: 2;">
                            <span style="font-weight: bold; color: var(--accent-color);">× 10</span>
                            <input type="number" id="exp-input" placeholder="${t.mod2PlaceholderExp}" style="flex: 1;">
                        </div>
                        <small style="color: var(--text-secondary); font-size: 0.75rem;">${t.mod2Hint}</small>
                    </div>
                `;
            } else if (mod.type === 'dimension-check') {
                document.getElementById('sensor-display').innerText = currentRawData.eq;
                document.getElementById('task-title').innerText = t.mod3Title;
                document.getElementById('task-desc').innerText = t.mod3Desc;

                const syms = currentRawData.symbols[currentLang];
                if (syms && syms.length > 0) {
                    legendBox.innerHTML = `<strong>${t.mod3SymbolTitle}</strong><ul>` + 
                        syms.map(s => `<li>${s}</li>`).join('') + 
                        `</ul>`;
                    legendBox.style.display = 'block';
                }

                dynamicInputs.innerHTML = `
                    <div class="control-group">
                        <label for="dim-select">${t.mod3Label}</label>
                        <select id="dim-select">
                            <option value="">${t.mod3SelectDefault}</option>
                            <option value="valid">${t.mod3Valid}</option>
                            <option value="invalid">${t.mod3Invalid}</option>
                        </select>
                    </div>
                `;
            }
        }
    }

    function onQuantityChange(newKey) {
        selectedQuantityKey = newKey;
        generateNewData();
    }

    function calculateConversion(val, fromUnitStr, toUnitStr, qKey) {
        if (qKey === 'temp') {
            if (fromUnitStr === toUnitStr) return val;
            if (fromUnitStr === '°C' && toUnitStr === 'K') return val + 273.15;
            if (fromUnitStr === 'K' && toUnitStr === '°C') return val - 273.15;
        }
        
        const qData = baseQuantities[qKey];
        const fromObj = qData.units.find(u => u.symbol === fromUnitStr);
        const toObj = qData.units.find(u => u.symbol === toUnitStr);

        const baseVal = val * fromObj.factor;
        return baseVal / toObj.factor;
    }

    function showFeedback(type, message) {
        const fb = document.getElementById('feedback');
        fb.className = `feedback ${type}`;
        fb.innerHTML = message;
        fb.style.display = 'block';
    }

    function submitAnalysis() {
        const mod = modules[currentModIndex];
        const t = translations[currentLang];

        if (mod.type === 'base-quantities-module') {
            const userQ = document.getElementById('quantity-select').value;
            const userSiUnit = document.getElementById('si-unit-select').value;
            const userSiVal = parseFloat(document.getElementById('si-val-input').value);
            const userRandomVal = parseFloat(document.getElementById('random-val-input').value);
            const userSigFig = parseInt(document.getElementById('sigfig-input').value);

            if (isNaN(userSiVal) || isNaN(userRandomVal) || isNaN(userSigFig)) {
                showFeedback('error', t.errFillAll);
                return;
            }

            const correctQKey = currentRawData.qKey;
            const qData = baseQuantities[correctQKey];
            const correctSiUnit = qData.siUnit;
            const expectedSiVal = calculateConversion(currentRawData.val, currentRawData.unit, correctSiUnit, correctQKey);
            const expectedRandomVal = calculateConversion(currentRawData.val, currentRawData.unit, currentRawData.targetRandomUnit, correctQKey);
            const expectedSigFig = countSigFigs(currentDisplayStr);

            let isQCorrect = (userQ === correctQKey);
            let isSiUnitCorrect = (userSiUnit === correctSiUnit);
            let isSiValCorrect = Math.abs((userSiVal - expectedSiVal) / expectedSiVal) < 0.02;
            let isRandomValCorrect = Math.abs((userRandomVal - expectedRandomVal) / expectedRandomVal) < 0.02;
            let isSigFigCorrect = (userSigFig === expectedSigFig);

            if (isQCorrect && isSiUnitCorrect && isSiValCorrect && isRandomValCorrect && isSigFigCorrect) {
                showFeedback('success', t.successMod1);
            } else {
                let msg = t.warnMod1Title;
                if (!isQCorrect) msg += t.warnMod1Q.replace('{val}', qData.name[currentLang]);
                if (!isSiUnitCorrect) msg += t.warnMod1SIUnit.replace('{name}', qData.name[currentLang]).replace('{val}', correctSiUnit);
                if (!isSiValCorrect) msg += t.warnMod1SIVal.replace('{val}', expectedSiVal.toPrecision(4)).replace('{unit}', correctSiUnit);
                if (!isRandomValCorrect) msg += t.warnMod1RandVal.replace('{unit}', currentRawData.targetRandomUnit).replace('{val}', expectedRandomVal.toPrecision(4)).replace('{unit}', currentRawData.targetRandomUnit);
                if (!isSigFigCorrect) msg += t.warnMod1SigFig.replace('{val}', expectedSigFig);
                msg += '</ul>';
                showFeedback('warning', msg);
            }

        } else if (mod.type === 'exponential') {
            const coef = parseFloat(document.getElementById('coef-input').value);
            const exp = parseInt(document.getElementById('exp-input').value);

            if (isNaN(coef) || isNaN(exp)) {
                showFeedback('error', t.errFillCoefExp);
                return;
            }

            const actualVal = currentRawData.val;
            const userVal = coef * Math.pow(10, exp);
            const isRangeCorrect = coef >= 1 && coef < 10;
            const isValCorrect = Math.abs((userVal - actualVal) / actualVal) < 0.01;

            if (isValCorrect && isRangeCorrect) {
                showFeedback('success', t.successMod2.replace('{coef}', coef).replace('{exp}', exp));
            } else {
                let msg = t.warnMod2Title;
                if (!isRangeCorrect) msg += t.warnMod2Range;
                if (!isValCorrect) msg += t.warnMod2Val;
                showFeedback('warning', msg);
            }

        } else if (mod.type === 'dimension-check') {
            const choice = document.getElementById('dim-select').value;
            if (!choice) {
                showFeedback('error', t.errSelectDim);
                return;
            }

            const expectedChoice = currentRawData.dimConsistent ? 'valid' : 'invalid';
            const reason = currentRawData.reason[currentLang];
            if (choice === expectedChoice) {
                showFeedback('success', t.successMod3.replace('{reason}', reason));
            } else {
                showFeedback('warning', t.warnMod3.replace('{reason}', reason));
            }
        }
    }

    // Initialize Page
    window.onload = () => {
        initSettings();
        initNav();
        generateNewData();
    };
</script>
</body>
</html>
