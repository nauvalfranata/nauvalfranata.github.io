            --accent-light: #e0f2fe;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --sensor-bg: #0f172a;
            --sensor-text: #38bdf8;
            --sensor-border: #1e293b;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --success-bg: #dcfce7;
            --success-color: #16a34a;
            --success-border: #86efac;
            --warning-bg: #fef3c7;
            --warning-color: #d97706;
            --warning-border: #fcd34d;
            --error-bg: #fee2e2;
            --error-color: #dc2626;
            --error-border: #fca5a5;
        }

        /* CSS Variables - Dark Theme */
        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #f8fafc;
            --accent: #38bdf8;
            --accent-light: rgba(56, 189, 248, 0.15);
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --sensor-bg: #022c22;
            --sensor-text: #4ade80;
            --sensor-border: #065f46;
            --input-bg: #0f172a;
            --input-border: #475569;
            --success-bg: rgba(34, 197, 94, 0.15);
            --success-color: #4ade80;
            --success-border: #22c55e;
            --warning-bg: rgba(245, 158, 11, 0.15);
            --warning-color: #fbbf24;
            --warning-border: #f59e0b;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-color: #f87171;
            --error-border: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--card-border);
        }

        header {
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            background: var(--bg);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); font-weight: 800; }

        /* Navigation Modules - Interactive Grid Selector */
        .module-selector-container {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
        }

        .module-selector-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .mod-card {
            background: var(--bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .mod-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
        }

        .mod-card.active {
            background: rgba(37, 99, 235, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .mod-card-icon {
            font-size: 1.4rem;
            background: var(--card-bg);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .mod-card.active .mod-card-icon {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .mod-card-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .lab-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .lab-grid { grid-template-columns: 1fr; }
            .module-grid { grid-template-columns: 1fr; }
        }

        .instrument-panel {
            background: var(--bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .sensor-display {
            background: var(--sensor-bg);
            color: var(--sensor-text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid var(--sensor-border);
            margin: 15px 0;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            word-break: break-all;
            width: 90%;
            box-sizing: border-box;
        }

        .instrument-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .task-card {
            background: var(--bg);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-top: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
        }

        .task-card h4 { margin: 0 0 8px 0; color: var(--secondary); font-weight: 700; font-size: 1.05rem; }
        .task-card p { margin: 0; color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }

        .control-group {
            width: 100%;
            margin-bottom: 12px;
        }

        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .btn-action:hover { background-color: var(--primary-dark); }

        .btn-game-opt {
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--bg);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: 0.2s;
        }

        .btn-game-opt:hover {
            background: var(--accent-light);
            border-color: var(--primary);
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            display: none;
            line-height: 1.4;
        }

        .feedback.success { background: var(--success-bg); color: var(--success-color); border: 1px solid var(--success-border); }
        .feedback.warning { background: var(--warning-bg); color: var(--warning-color); border: 1px solid var(--warning-border); }
        .feedback.error { background: var(--error-bg); color: var(--error-color); border: 1px solid var(--error-border); }

        canvas {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            touch-action: none;
        }
    </style>
</head>

            <button class="btn-action" id="btn-submit" onclick="submitAnalysis()">Kirim Data Analisis</button>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>
</div>

    function resetGeoCanvas() {
        canvas = document.getElementById('vector-canvas');
        ctx = canvas.getContext('2d');

        geoVectors = {
            A: { startX: 40, startY: 200, endX: 40 + currentRawData.targetAx * GRID_SIZE, endY: 200 - currentRawData.targetAy * GRID_SIZE, color: '#2563eb', label: 'A' },
            B: { startX: 40, startY: 100, endX: 40 + currentRawData.targetBx * GRID_SIZE, endY: 100 - currentRawData.targetBy * GRID_SIZE, color: '#e11d48', label: 'B' },
            R: { startX: 180, startY: 180, endX: 240, endY: 120, color: '#16a34a', label: 'R' }
        };

        initCanvasEvents();
        drawCanvas();
    }

    function drawCanvas() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Grid
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        // Draw Vectors
        Object.keys(geoVectors).forEach(key => {
            const v = geoVectors[key];
            drawArrow(ctx, v.startX, v.startY, v.endX, v.endY, v.color, v.label);
        });
    }

    function drawArrow(context, fromx, fromy, tox, toy, color, label) {
        const headlen = 10;
        const dx = tox - fromx;
        const dy = toy - fromy;
        const angle = Math.atan2(dy, dx);

        context.strokeStyle = color;
        context.fillStyle = color;
        context.lineWidth = 3;

        context.beginPath();
        context.moveTo(fromx, fromy);
        context.lineTo(tox, toy);
        context.stroke();

        context.beginPath();
        context.moveTo(tox, toy);
        context.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
        context.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
        context.closePath();
        context.fill();

        context.font = 'bold 12px Plus Jakarta Sans';
        context.fillText(label, (fromx + tox) / 2 + 5, (fromy + toy) / 2 - 5);
    }

    function initCanvasEvents() {
        canvas.onmousedown = handlePointerDown;
        canvas.onmousemove = handlePointerMove;
        canvas.onmouseup = handlePointerUp;

        canvas.ontouchstart = (e) => {
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousedown", { clientX: touch.clientX, clientY: touch.clientY });
            canvas.dispatchEvent(mouseEvent);
        };
        canvas.ontouchmove = (e) => {
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousemove", { clientX: touch.clientX, clientY: touch.clientY });
            canvas.dispatchEvent(mouseEvent);
        };
        canvas.ontouchend = () => {
            const mouseEvent = new MouseEvent("mouseup", {});
            canvas.dispatchEvent(mouseEvent);
        };
    }

    function handlePointerDown(e) {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        dragTarget = null;
        Object.keys(geoVectors).forEach(key => {
            const v = geoVectors[key];
            const distStart = Math.hypot(mx - v.startX, my - v.startY);
            const distEnd = Math.hypot(mx - v.endX, my - v.endY);

            if (distStart < 15) {
                dragTarget = { key, part: 'start' };
            } else if (distEnd < 15) {
                dragTarget = { key, part: 'end' };
            } else {
                const midX = (v.startX + v.endX) / 2;
                const midY = (v.startY + v.endY) / 2;
                if (Math.hypot(mx - midX, my - midY) < 20) {
                    dragTarget = { key, part: 'body', startX: v.startX, startY: v.startY, endX: v.endX, endY: v.endY, mx, my };
                }
            }
        });
    }

    function handlePointerMove(e) {
        if (!dragTarget) return;
        const rect = canvas.getBoundingClientRect();
        let mx = Math.round((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
        let my = Math.round((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

        const v = geoVectors[dragTarget.key];
        if (dragTarget.part === 'start') {
            v.startX = mx;
            v.startY = my;
        } else if (dragTarget.part === 'end') {
            v.endX = mx;
            v.endY = my;
        } else if (dragTarget.part === 'body') {
            const dx = mx - Math.round(dragTarget.mx / GRID_SIZE) * GRID_SIZE;
            const dy = my - Math.round(dragTarget.my / GRID_SIZE) * GRID_SIZE;
            v.startX = dragTarget.startX + dx;
            v.startY = dragTarget.startY + dy;
            v.endX = dragTarget.endX + dx;
            v.endY = dragTarget.endY + dy;
        }
        drawCanvas();
    }

    function handlePointerUp() {
        dragTarget = null;
    }

    function showFeedback(type, message) {

    function submitAnalysis() {
        const t = translations[currentLang];

        if (currentModIndex === 1) {
            // Modul 2 Validation
            const userMag = parseFloat(document.getElementById('mod2-mag').value);
            const userDeg = parseFloat(document.getElementById('mod2-deg').value);

            if (isNaN(userMag) || isNaN(userDeg)) {
                showFeedback('error', t.errFillFields);
                return;
            }

            const actualMag = Math.hypot(currentRawData.ax, currentRawData.ay);
            let actualRad = Math.atan2(currentRawData.ay, currentRawData.ax);
            let actualDeg = actualRad * (180 / Math.PI);
            if (actualDeg < 0) actualDeg += 360;

            const isMagOk = Math.abs(userMag - actualMag) < 0.1;
            const isDegOk = Math.abs(userDeg - actualDeg) < 1.0;

            if (isMagOk && isDegOk) {
                showFeedback('success', t.mod2Correct.replace('{mag}', actualMag.toFixed(2)).replace('{deg}', actualDeg.toFixed(1)));
            } else {
                showFeedback('warning', t.mod2Incorrect.replace('{mag}', actualMag.toFixed(2)).replace('{deg}', actualDeg.toFixed(1)));
            }
        } else if (currentModIndex === 2) {
            // Modul 3 Validation
            const userRx = parseFloat(document.getElementById('mod3-rx').value);
            const userRy = parseFloat(document.getElementById('mod3-ry').value);

            if (isNaN(userRx) || isNaN(userRy)) {
                showFeedback('error', t.errFillBothRxRy);
                return;
            }

            const expectedRx = currentRawData.ax + currentRawData.bx;
            const expectedRy = currentRawData.ay + currentRawData.by;

            if (userRx === expectedRx && userRy === expectedRy) {
                showFeedback('success', t.mod3Correct.replace('{rx}', expectedRx).replace('{ry}', expectedRy));
            } else {
                showFeedback('warning', t.mod3Incorrect.replace('{rx}', expectedRx).replace('{ry}', expectedRy));
            }
        } else if (currentModIndex === 3) {
            // Modul 4 Validation
            const A = geoVectors.A;
            const B = geoVectors.B;
            const R = geoVectors.R;

            const curAx = (A.endX - A.startX) / GRID_SIZE;
            const curAy = -(A.endY - A.startY) / GRID_SIZE;
            const curBx = (B.endX - B.startX) / GRID_SIZE;
            const curBy = -(B.endY - B.startY) / GRID_SIZE;
            const curRx = (R.endX - R.startX) / GRID_SIZE;
            const curRy = -(R.endY - R.startY) / GRID_SIZE;

            const isAOk = curAx === currentRawData.targetAx && curAy === currentRawData.targetAy;
            const isBOk = curBx === currentRawData.targetBx && curBy === currentRawData.targetBy;

            if (activeGeoMethod === 'triangle') {
                const isHeadTail = A.endX === B.startX && A.endY === B.startY;
                const isROk = R.startX === A.startX && R.startY === A.startY && R.endX === B.endX && R.endY === B.endY;

                if (isAOk && isBOk && isHeadTail && isROk) {
                    showFeedback('success', t.mod4TriSuccess.replace('{rx}', curRx).replace('{ry}', curRy));
                } else {
                    let err = t.mod4TriErrTitle;
                    if (!isAOk) err += t.mod4TriErrA;
                    if (!isBOk) err += t.mod4TriErrB;
                    if (!isHeadTail) err += t.mod4TriErrHeadTail;
                    if (!isROk) err += t.mod4TriErrR;
                    showFeedback('warning', err);
                }
            } else if (activeGeoMethod === 'parallelogram') {
                const isTailTail = A.startX === B.startX && A.startY === B.startY;
                const isROriginOk = R.startX === A.startX && R.startY === A.startY;
                const isRDiagonal = (R.endX - R.startX) === (A.endX - A.startX + B.endX - B.startX) &&
                                    (R.endY - R.startY) === (A.endY - A.startY + B.endY - B.startY);

                if (isAOk && isBOk && isTailTail && isROriginOk && isRDiagonal) {
                    showFeedback('success', t.mod4ParaSuccess.replace('{rx}', curRx).replace('{ry}', curRy));
                } else {
                    let err = t.mod4ParaErrTitle;
                    if (!isAOk) err += t.mod4ParaErrA;
                    if (!isBOk) err += t.mod4ParaErrB;
                    if (!isTailTail) err += t.mod4ParaErrTailTail;
                    if (!isROriginOk) err += t.mod4ParaErrROrigin;
                    if (!isRDiagonal) err += t.mod4ParaErrRDiag;
                    showFeedback('warning', err);
                }
            } else if (activeGeoMethod === 'subtraction') {
                const isHeadTail = A.endX === B.startX && A.endY === B.startY;
                const isBReversed = curBx === -currentRawData.targetBx && curBy === -currentRawData.targetBy;
                const isROk = R.startX === A.startX && R.startY === A.startY && R.endX === B.endX && R.endY === B.endY;

                if (isAOk && isBReversed && isHeadTail && isROk) {
                    showFeedback('success', t.mod4SubSuccess.replace('{rx}', curRx).replace('{ry}', curRy));
                } else {
                    let err = t.mod4SubErrTitle;
                    if (!isAOk) err += t.mod4SubErrA;
                    if (!isBReversed) err += t.mod4SubErrB;
                    if (!isHeadTail) err += t.mod4SubErrHeadTail;
                    if (!isROk) err += t.mod4SubErrR;
                    showFeedback('warning', err);
                }
            }
        } else if (currentModIndex === 4) {
            // Modul 5 Validation
            const userDot = parseFloat(document.getElementById('mod5-dot').value);
            const userCross = parseFloat(document.getElementById('mod5-cross').value);

            if (isNaN(userDot) || isNaN(userCross)) {
                showFeedback('error', t.errFillBothProducts);
                return;
            }

            const expectedDot = (currentRawData.ax * currentRawData.bx) + (currentRawData.ay * currentRawData.by);
            const expectedCrossMag = Math.abs((currentRawData.ax * currentRawData.by) - (currentRawData.ay * currentRawData.bx));

            const isDotOk = userDot === expectedDot;
            const isCrossOk = userCross === expectedCrossMag;

            if (isDotOk && isCrossOk) {
                showFeedback('success', t.mod5Correct.replace('{dot}', expectedDot).replace('{cross}', expectedCrossMag));
            } else {
                showFeedback('warning', t.mod5Incorrect.replace('{dot}', expectedDot).replace('{cross}', expectedCrossMag));
            }
        }
    }
</script>
